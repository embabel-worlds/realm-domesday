    textEdition: '[`HURSTINGSTONE'' Hundred] The men who have sworn in HUNTINGDON say that the Church of St Mary in the Borough and the land that belongs to it was the Church of Thorney''s; but the Abbot
      gave it in pledge to the burgesses. However, King Edward gave it to Vitalis and Bernard, his priests; they sold it to Hugh, King Edward''s chamberlain. But Hugh sold it to two priests of Huntingdon,
      for which they have King Edward''s seal. Eustace ^[the sheriff]^ now has it without deliverer, without writ and without installer.'
