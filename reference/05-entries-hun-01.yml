    textEdition: '[* `HURSTINGSTONE'' Hundred *] In the Borough of HUNTINGDON there are four quarters. In two quarters there were 116 burgesses before 1066, and still are. They pay all customary dues and
      the King''s tax. Under them are 100 smallholders who aid them in discharging the tax. St Benedict''s of Ramsey had 10 of these burgesses with full jurisdiction and every customary due, but they only
      paid tax before 1066. Eustace [* the sheriff *] took them from the Abbey by force, and they are now in the King''s hands, with the others.'
