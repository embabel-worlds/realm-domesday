    places: Whittlesey
    name: Whittlesey (Huntingdonshire 7,8)
    holding: land
    textEdition: In WHITTLESEY MERE the Abbot of Ramsey has 1 boat; the Abbot of Peterborough 1 boat; and the Abbot of Thorney 2 boats. Of these two [boats], the Abbot of Peterborough holds one from the
      Abbot of Thorney, and [also] 2 fisheries and 2 fishermen, and 1 virgate of land. For these he gives pasture sufficient for 120 pigs, and, if the pasture is inadequate he feeds and fattens 60 pigs
      with corn. But he also finds materials for one house of 60 feet, and stakes for the enclosure around the house; he also repairs the house and court if they fall into disrepair. This agreement was
      made between them before 1066. The Abbot of Ramsey's fisheries and meres in Huntingdonshire are valued at £10; the Abbot of Thorney's at 60s; the Abbot of Peterborough's at £4. [= ?7? Land of St Mary's,
      Thorney =] <205b> ?8? Land of St Peter's of Peterborough
