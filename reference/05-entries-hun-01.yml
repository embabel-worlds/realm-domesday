    textEdition: ?M? In EYNESBURY King Edward had 9 hides taxable. Land for 28 ploughs. Now the Countess has 4 ploughs in lordship; 34 villagers and 8 smallholders who have 28 ploughs. A church and a priest.
      2 mills, 32s; pasturable woodland, 60 acres. In the same village is a sheepfold with 662 sheep; 60 acres of meadow; which the Countess gave to St Helen's [* of Elstow *]. Value 70s. Of the above 9
      hides Gilbert the priest holds 2 hides from the Countess. He has 2 ploughs in lordship. Meadow, 8 acres. Value 40s. Of the same land her steward Alan has 2 hides from her. 2 smallholders. Value 10s.
      Value of the manor before 1066 £20; now, the value of the Countess' lordship, £14 12s. [= ?20? Land of Countess Judith =]
    text: In EYNESBURY King Edward had 9 hides taxable. Land for 28 ploughs. Now the Countess has 4 ploughs in lordship; 34 villagers and 8 smallholders who have 28 ploughs. A church and a priest. 2 mills,
