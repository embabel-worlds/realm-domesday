    textEdition: '[In {HEZETRE} Hundred] The King holds KINGSLAND. King Edward held it. 15 hides. In lordship 5 ploughs; a further 3 ploughs possible. 21 villagers and 9 smallholders with 17 ploughs. 10
      ploughmen, 2 slaves and 6 freedmen. 2 mills at 26s 4d and 500 eels; from the woodland and pasture, 8s; from customary dues, mills, villagers and freedmen come 100s, less 5s, besides eels. Ralph of
      Mortimer holds one member of this manor, {MERESTONE}, at 2 hides. Roger of Lacy [holds] one manor at 2 hides, named HOPLEYS [Green]; another manor at 1 hide, named STREET; and a third manor at 1 hide,
      named LAWTON. Roger also holds 1/2 hide which a pigman held before 1066. Earl William gave this land to Walter of Lacy. Also of this manor Ilbert son of Turold holds 1/2 virgate which a pigman held.
      This land is called {ALAC}. Value before 1066 £6; now it is in the revenue at £13 3s. ^[Sainte-Marie of Cormeilles holds in alms from the King the church of this manor]^ [= ?[1]? Land of the King.
      King William holds it. King Edward held it =]'
