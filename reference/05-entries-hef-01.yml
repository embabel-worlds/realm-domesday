    places: Feckenham
    name: Feckenham (Herefordshire 1,40)
    holding: manor
    textEdition: '[Worcestershire] In `ASH'' Hundred The King holds FECKENHAM. Five thanes held it from Earl Edwin; they could go where they would with the land. Under them they had 4 men-at-arms, as free
      as they were themselves; between them there were 13 ploughs. 10 hides. In lordship 6 ploughs; 30 villagers, 11 smallholders, a reeve, a beadle, a miller and a smith; between them they have 18 ploughs.
      12 male and 5 female slaves. A rider holds 1/2 hide, 2 parts of 1/2 hide and 1 croft; he has 1 plough. A mill at 2s; in Droitwich 4 salt-houses; the woodland of this manor has been put outside, into
      the King''s woodland, and 1/2 hide of land which Earl William gave to Jocelyn the hunter. Earl William gave to the Church of Sainte-Marie [* of Lyre *] the tithe of this manor and the church with
      a priest, and 2 virgates of land with 1 villager. Walter of Lacy gave 1 hide out of the lordship land to one Hubert; he has 1/2 plough. [= ?[1]? Land of the King. King William holds it =]'
    text: '[Worcestershire] In `ASH'' Hundred The King holds FECKENHAM. Five thanes held it from Earl Edwin; they could go where they would with the land. Under them they had 4 men-at-arms, as free as they
