    name: Kingstone (Herefordshire 1,3)
    holding: manor
    textEdition: '[?In STRETFORD Hundred] The King holds KINGSTONE. King Edward held it. 4 hides. In lordship 2 hides, less 1 virgate. 1 plough there; another would be possible. 6 villagers with a reeve;
      3 smallholders and a smith; between them they have 6 ploughs. A wood named TREVILLE which pays no customary dues except hunting rights. The villagers who lived there before 1066 carried [the produce
      of] the hunt to Hereford and did no other service, as the Shire states. Sainte-Marie of Cormeilles holds the whole tithe of this manor, and 1 villager with 1 virgate of land. Ilbert son of Turold
      holds 2 hides of this manor as one manor. Before 1066, 1 parcel of land, CUSOP, belonged to this manor; its customary dues went to Kingstone. Roger of Lacy holds from the King. The sheriff placed
      {WAPLEFORD} in this manor in Earl William''s time. Alwin held this manor; he could go to whichever lord he would. 1 hide there. Land for 2 ploughs. 2 villagers with 1 plough. The whole of this, added
      together thus, pays the King 50s of blanched pence and 1 hawk. [= ?[1]? Land of the King. King William holds it. King Edward held it =]'
    text: '[?In STRETFORD Hundred] The King holds KINGSTONE. King Edward held it. 4 hides. In lordship 2 hides, less 1 virgate. 1 plough there; another would be possible. 6 villagers with a reeve; 3 smallholders
      and a smith; between them they have 6 ploughs. A wood named TREVILLE which pays no customary dues except hunting rights. The villagers who lived there before 1066 carried [the produce of] the hunt
      to Hereford and did no other service, as the Shire states. Sainte-Marie of Cormeilles holds the whole tithe of this manor, and 1 villager with 1 virgate of land. Ilbert son of Turold holds 2 hides
      of this manor as one manor. Before 1066, 1 parcel of land, CUSOP, belonged to this manor; its customary dues went to Kingstone. Roger of Lacy holds from the King. The sheriff placed WAPLEFORD in this
      manor in Earl William''s time. Alwin held this manor; he could go to whichever lord he would. 1 hide there. Land for 2 ploughs. 2 villagers with 1 plough. The whole of this, added together thus, pays
      the King 50s of blanched pence and 1 hawk.'
