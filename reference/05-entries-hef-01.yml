    name: '[Much] Marcle (Herefordshire 1,7)'
    holding: manor
    textEdition: 'In {WIMUNDESTREU} Hundred The King holds [Much] MARCLE. Earl Harold held it. 17 hides which pay tax. [***]. In lordship 4 ploughs; 36 villagers and 10 smallholders with 40 ploughs. These
      villagers plough and sow with their own seed 80 acres of wheat and as many of oats, except for 9 acres: 6 of these belong to William son of Baderon, 3 to Sainte-Marie of Cormeilles. In this manor
      is a reeve, 1 Frenchman and 1 riding man; they have 3 ploughs. 8 slaves, 1 ploughman and 6 female slaves. A mill which pays nothing, except sustenance for its keeper. Woodland which pays 5s which
      are given to Droitwich for 60 measures of salt. In Hereford are 4 burgesses who pay 18 ploughshares to this manor. 1 hide of this manor is at {TURLESTANE}; before 1066 it paid 50 lumps of iron and
      6 salmon. This land is now in the Forest. The sheriff holds 1 hide of this manor; he has 2 ploughs. Also in this manor are 58 acres of land, cleared, extracted from the woodland; the reeve and 2 other
      men hold many acres of this land. Sainte-Marie of Cormeilles has the tithe of this manor, a priest and the church, with 1 villager who holds 1 virgate of land. Value before 1066 £30; value now as
      much. [= ?[1]? Land of the King. King William holds it =]'
