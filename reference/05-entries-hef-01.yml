    textEdition: In BROMSASH Hundred The King holds CLEEVE. Earl Harold held it. 14 1/2 hides, with an outlier named WILTON. In lordship 4 ploughs; 20 villagers, a reeve, and 11 smallholders with 16 ploughs.
      9 male and 5 female slaves and 1 ploughman. 2 mills at 6s; a fishery which pays nothing. To this manor belong as many Welshmen as have 8 ploughs; they pay 10 1/2 sesters of honey and 6s 5d. Sainte-Marie
      of Cormeilles holds the church of this manor, a priest and the tithe, with 1 villager. In King William's Forest there is as much land of this manor as paid 6 sesters of honey and 6 sheep with lambs
      before 1066. Of this manor William Baderon holds 1 hide and 3 virgates; <180a> Godfrey holds 1 virgate. Roger of Lacy holds 1/2 fishery which belonged to this manor before 1066; 25 measures of salt
      from Droitwich then belonged there also. At that time there were in this manor 2 hides, less 1 virgate, which are in ASHE [Ingen]. Alfred of Marlborough holds them now. Harold was holding them when
      he died. The Shire states that they are this manor's. This manor pays £9 10s of blanched pence. [= ?[1]? Land of the King. King William holds it =]
