    places: Leominster
    name: Leominster (Herefordshire 1,10c)
    holding: dependency
    textEdition: Of the 80 hides of this manor ^[Leominster]^ Urso of Abetot holds 3 hides in EDWYN [Ralph]; Roger of Lacy 3 1/2 hides in HUMBER and 1 1/2 hides in BROCKMANTON; Ralph of Mortimer 1 hide
      in AYMESTREY and 8 hides in LEINTHALL which pay tax; William son of Norman 1/2 hide in LYE and 1 hide in EYTON. In these, 3 ploughs in lordship; 11 villagers, 22 smallholders and 2 priests; between
      them they have 10 ploughs; 16 slaves. 2 mills at 24s. At Leinthall woodland 1 league long and 1 league wide. In total, value of these lands £12 11s. Leofwin the interpreter holds as much land in Leominster
      as is worth 25s. St Peter's [* of Hereford *] has 15s from Ralph of Mortimer's land in Aymestrey. Before 1066 two manors, Stanford and [Much] Marcle, belonged to this manor; they now pay £30 to the
      King, as stated above. ^[Belongs to Leominster. Queen Edith held it]^ [= ?[1]? Land of the King. King William holds it =] <180b> List 3 These lands mentioned below were an adjunct of Leominster before
      1066
