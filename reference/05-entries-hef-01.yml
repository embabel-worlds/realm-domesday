    textEdition: '[In LEOMINSTER Hundred] The King holds LEOMINSTER. Queen Edith held it, with 16 members: LUSTON, YARPOLE, AYMESTREY, BRIMFIELD, ASHTON, STOCKTON, STOKE [Prior], MARSTON [Stannett], UPTON,
      [Miles] HOPE, BRIERLEY, IVINGTON, CHOLSTREY, LEINTHALL, EDWYN [Ralph] and FARLOW. In this manor, with these members, were 80 hides. In lordship 30 ploughs. There were 8 reeves, 8 beadles, 8 riding
      men, 238 villagers, 75 smallholders and 82 slaves, male and female; altogether they had 230 ploughs. The villagers ploughed 140 acres of the lord''s land and sowed it with their own wheat seed. They
      gave £11 and 52d in customary dues. The riding men gave 14s 4d and 3 sesters of honey. There were 8 mills at 73s and 30 sticks of eels; the woodland paid 24s and pasture dues. In this manor the King
      now has in lordship 60 hides, 29 ploughs and 6 priests, 6 riders, 7 reeves, 7 beadles, 224 villagers, 81 smallholders and 25 slaves, male and female; between them they have 201 ploughs. These [men]
      plough and sow 125 acres with their own wheat. In customary dues they give £7 14s 8 1/2d, 17s for fish, 8s for salt and 65s from honey. 8 mills at 108s and 100 sticks of eels, less 10; woodland 6
      leagues long and 3 leagues wide which pays 22s. From these, 5s are given for buying timber in Droitwich, and 30 measures of salt are had from there. Each villager who has 10 pigs gives 1 pig in pasture
      dues. From cleared woodland come 17s 4d. A hawk''s eyrie there. [= ?[1]? Land of the King. King William holds it =]'
    text: '[In LEOMINSTER Hundred] The King holds LEOMINSTER. Queen Edith held it, with 16 members: LUSTON, YARPOLE, AYMESTREY, BRIMFIELD, ASHTON, STOCKTON, STOKE [Prior], MARSTON [Stannett], UPTON, [Miles]
