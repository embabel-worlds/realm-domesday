    textEdition: 'The King holds HOLLOW [Court]. Siward [* the fat *], a thane and kinsman of King Edward, held it. 3 hides. In lordship 3 ploughs; 4 villagers, 1 smallholder, a reeve and a beadle with
      3 ploughs. 6 slaves, male and female. A park for wild animals, but it has been put outside the manor, with all the woodland; in Droitwich 4 salt-houses and 1 {hoch}; in Worcester 1 house which pays
      2 ploughshares; another 2 houses which belong to Feckenham: they paid nothing and have been put outside [the manor]. These two manors pay to Hereford £18 of pence at 20 to the {ora}. [= ?[1]? Land
      of the King. King William holds it =] <180d>'
