    textEdition: In {CUTESTORNES} Hundred Alfred also holds BURGHILL. Earl Harold held it. 8 hides which pay tax. In lordship 2 ploughs; 16 villagers, 19 smallholders and a priest with 24 ploughs. 4 slaves;
      a mill at 20s and 25 sticks of eels; woodland which pays 4s. 5 burgesses in Hereford pay 52d to this manor. In this manor 2 men-at-arms have 2 ploughs; 2 ploughmen. Godric, a thane, has 1 plough;
      another man has 1 villager. Before 1066 the third penny of the two Hundreds, Stretford and {Cutestornes}, belonged to this manor. Value then £20; now £15. ^[Osbern uncle of Alfred held it before 1066
      after [* Earl *] Godwin and [* Earl *] Harold had been exiled]^ [= ?[19]? Land of Alfred of Marlborough =]
