    textEdition: '[* In `DODDINGTREE'' Hundred *] The King holds SUCKLEY. Earl Edwin held it. 5 hides. In lordship 2 ploughs; 22 villagers and 24 smallholders with 27 ploughs. Another 10 impoverished smallholders.
