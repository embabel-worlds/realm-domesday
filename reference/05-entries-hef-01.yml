    holding: manor
    textEdition: '[CASTLE outside Hundred] Ralph of Tosny holds CLIFFORD Castle. Earl William built it on waste land, which Bruning held before 1066. Ralph has land there for 3 ploughs, but there is only
      1 plough. This castle is in the kingdom of England and not subject to any Hundred or customary dues. Gilbert the sheriff holds it at a revenue, both the Borough ^[Clifford Castle]^ and the plough
      [***]. From the whole he pays 60s. In this castlery Roger holds land for 4 ploughs; Gilbert [* the sheriff *] for 12 ploughs; Drogo [* son of Poyntz *] for 5 ploughs; Herbert for 2 ploughs. They have
      9 ploughs in lordship and 16 burgesses, 13 smallholders, 5 Welshmen, 6 male and 4 female slaves. A mill which pays 3 measures of corn. 4 ploughmen there. The men have 3 ploughs. In total, the value
      of what they have is £8 5s. These men and whoever else has anything there, hold from Ralph. [= ?8? Land of Ralph of Tosny =]'
    text: '[CASTLE outside Hundred] Ralph of Tosny holds CLIFFORD Castle. Earl William built it on waste land, which Bruning held before 1066. Ralph has land there for 3 ploughs, but there is only 1 plough.
