    name: Marden (Herefordshire 1,4)
    holding: manor
    textEdition: '[In {TORNELAUS} Hundred] The King holds MARDEN. King Edward held it. There were many hides, but only 2 of them pay tax. This land is divided between many [people]. The King has 3 ploughs
      in lordship; 25 villagers, 5 smallholders, 2 ploughmen, 4 slaves and 4 freedmen; between them they have 21 ploughs. A mill at 20s and 25 sticks of eels; woodland which pays 20s. A fishery without
      dues; from the salt-houses in Droitwich, 9 packloads of salt or 9d; further, 8 servants of the King have 7 ploughs. William son of Norman holds 3 hides, less 1 virgate, of this manor. Norman the pigman
      holds 1/2 hide of this manor. Earl William put 1 virgate outside this manor and gave it to a burgess of Hereford. Ansketil holds 40 acres, both open land and meadow, which King Edward''s reeve leased
      to a relative of his. 3 riding men held William son of Norman''s land; they could not be separated from this manor. 9s comes from the produce of this manor''s land. Before 1066 it paid £9 of blanched
      pence; now it is valued at £16. [= ?[1]? Land of the King. King William holds it. King Edward held it =] <179d>'
    text: '[In TORNELAUS Hundred] The King holds MARDEN. King Edward held it. There were many hides, but only 2 of them pay tax. This land is divided between many [people]. The King has 3 ploughs in lordship;
      25 villagers, 5 smallholders, 2 ploughmen, 4 slaves and 4 freedmen; between them they have 21 ploughs. A mill at 20s and 25 sticks of eels; woodland which pays 20s. A fishery without dues; from the
      salt-houses in Droitwich, 9 packloads of salt or 9d; further, 8 servants of the King have 7 ploughs. William son of Norman holds 3 hides, less 1 virgate, of this manor. Norman the pigman holds 1/2
      hide of this manor. Earl William put 1 virgate outside this manor and gave it to a burgess of Hereford. Ansketil holds 40 acres, both open land and meadow, which King Edward''s reeve leased to a relative
      of his. 3 riding men held William son of Norman''s land; they could not be separated from this manor. 9s comes from the produce of this manor''s land. Before 1066 it paid £9 of blanched pence; now
      it is valued at £16.'
