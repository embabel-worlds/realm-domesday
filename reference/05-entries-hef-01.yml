    textEdition: There were seven moneyers there. One of these was the Bishop's moneyer. When the coinage was renewed, each of them gave 18s for acquiring the dies, and after the day on which they returned,
      within one month, each of them gave 20s to the King, and the Bishop [* of Hereford *] likewise had 20s from his moneyer. When the King came to the City, the moneyers made him as many pence as he wanted,
      that is from the King's silver. These seven had their own full jurisdiction. When any moneyer of the King died, the King had 20s in death-duty. But if he died without bequeathing his wealth, the King
      had all his wealth. ^[Hereford]^
