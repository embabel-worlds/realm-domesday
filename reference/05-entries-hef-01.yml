      *] holds the tithe of this village, with 1 villager and 1/2 virgate of land. Earl Roger gave 1/2 virgate of land in absolute freedom to one Richard. These six manors pay to Hereford £50 in revenue
      and 25s as a premium. [= ?[1]? Land of the King. King William holds it =]'
