    textEdition: In BROMSASH Hundred King William holds LINTON. King Edward held it. There were 5 hides. It paid the fourth part of one night's revenue. Now it is extremely reduced. In lordship 3 ploughs;
      10 villagers and 5 smallholders with 12 ploughs. 6 slaves; a mill at 8d. 1 Frenchman who holds 1/2 hide which paid 4s before 1066. This manor, as it now is, pays £10 of white pence. Of this manor
      Sainte-Marie of Cormeilles holds the church, a priest with his land, and the whole tithe, and 1 villager with 1 virgate of land. Ansfrid of Cormeilles holds 2 hides of this manor; 9 villagers and
      9 ploughs. William son of Baderon holds 1 virgate of land which lay there before 1066. Ilbert the sheriff has in his revenue of Archenfield all the customary dues of honey and sheep which belonged
      to this manor before 1066. William son of Norman has from it 6 sesters of honey, 6 sheep with lambs and 12d. [= ?[1]? Land of the King. King William holds it. King Edward held it =]
