    textEdition: In WORCESTERSHIRE [* In `OSWALDSLOW' Hundred *] The King holds BUSHLEY. Brictric [* son of Algar *] held it; he bought it from Leofing Bishop of Worcester for 3 gold marks; also a house
      in the City of Worcester which pays a silver mark a year; also a wood 1 league long and as wide. He bought the whole of this and held it exempt, so that he did not serve any man for it. In this manor
      1 hide. In lordship 2 ploughs; 4 villagers, 8 smallholders, a reeve and a beadle; between them they have 4 ploughs. 8 slaves, male and female; a cowman and a dairymaid. A forester who holds 1/2 virgate
      of land. In PULL [Court] there are 3 virgates of land which lay in [the lands of] Longdon, a manor of Earl Oda. Earl William put this land in Bushley. 1 plough there. A man of the monks of Lyre holds
      1 virgate of land. Earl William put 2 foresters, one from Hanley [Castle], the other from Bushley, outside his manors to guard the woodlands. [= ?[1]? Land of the King. King William holds it =]
