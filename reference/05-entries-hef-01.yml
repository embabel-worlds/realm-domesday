      and 52d in customary dues. The riding men gave 14s 4d and 3 sesters of honey. There were 8 mills at 73s and 30 sticks of eels; the woodland paid 24s and pasture dues. In this manor the King now has
      in lordship 60 hides, 29 ploughs and 6 priests, 6 riders, 7 reeves, 7 beadles, 224 villagers, 81 smallholders and 25 slaves, male and female; between them they have 201 ploughs. These [men] plough
      and sow 125 acres with their own wheat. In customary dues they give £7 14s 8 1/2d, 17s for fish, 8s for salt and 65s from honey. 8 mills at 108s and 100 sticks of eels, less 10; woodland 6 leagues
