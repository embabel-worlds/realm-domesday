    kind: manor
    edition: Great Domesday
    figuresSource: Hull coding
    places: Martley
    name: Martley (Herefordshire 1,39)
    holding: manor
    textEdition: '[Worcestershire] In `DODDINGTREE'' Hundred The King holds MARTLEY. Queen Edith held it. 10 hides and 1 virgate of land. In lordship 8 ploughs; 47 villagers, 16 smallholders and 2 riders
      with 43 ploughs. A mill at 8s; 2 weirs pay 2500 eels and 5 sticks. A reeve and a beadle have 2 virgates of land; 2 ploughs. In Worcester 3 houses which pay 12d. The villagers and smallholders pay
      12s in place of fish and timber. This manor pays to Hereford £24 of pence at 20 to the {ora}, and 12s as a premium. Earl William gave to Sainte-Marie of Cormeilles the church of this manor with the
      land belonging to it and its tithe, and 2 villagers with 2 virgates of land. The Earl himself gave Ralph of Bernay 2 riders; he put them outside this manor, with the land they held; they have 2 ploughs.
      The Earl also gave Druward 1 virgate of land, which he still holds. [= ?[1]? Land of the King. King William holds it =]'
    text: '[Worcestershire] In `DODDINGTREE'' Hundred The King holds MARTLEY. Queen Edith held it. 10 hides and 1 virgate of land. In lordship 8 ploughs; 47 villagers, 16 smallholders and 2 riders with
      43 ploughs. A mill at 8s; 2 weirs pay 2500 eels and 5 sticks. A reeve and a beadle have 2 virgates of land; 2 ploughs. In Worcester 3 houses which pay 12d. The villagers and smallholders pay 12s in
      place of fish and timber. This manor pays to Hereford £24 of pence at 20 to the ora, and 12s as a premium. Earl William gave to Sainte-Marie of Cormeilles the church of this manor with the land belonging
      to it and its tithe, and 2 villagers with 2 virgates of land. The Earl himself gave Ralph of Bernay 2 riders; he put them outside this manor, with the land they held; they have 2 ploughs. The Earl
