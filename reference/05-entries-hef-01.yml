    name: Herefordshire 1,49
    textEdition: '[* In Archenfield *] In ARCHENFIELD the King has 100 men, less 4, who have 73 ploughs, with their men. In customary dues they give 41 sesters of honey, 20s in place of the sheep which
      they used to give, and 10s for hearth tax. They do not pay tax nor other customary dues, except that they march in the King''s army if they have been ordered. If a free man dies there, the King has
      his horse with his arms. The King has 1 ox from a villager when he dies. King Gruffydd and Bleddyn laid this land waste before 1066; therefore what it was like at that time is not known. [= ?[1]?
      Land of the King. King William holds it. King Edward held it =]'
