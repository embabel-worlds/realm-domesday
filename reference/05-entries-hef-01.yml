    name: Ewyas [Harold], Monnington (Herefordshire 19,1)
    holding: manor
    textEdition: '[CASTLE] Alfred of Marlborough holds the castle of EWYAS [Harold] from King William. The King himself granted him the lands which Earl William, who had refortified the castle, had given
      him; that is, 5 carucates of land in that place and 5 other carucates at MONNINGTON. The King also granted him the land of Ralph of Bernay which belonged to the castle. He has 2 ploughs in lordship;
      9 Welshmen with 6 ploughs who pay 7 sesters of honey; 12 smallholders who work 1 day a week. 4 ploughmen; 1 man who pays 6d. Five men-at-arms of his, Richard, Gilbert, William, ^[another]^ William,
      and Arnold, have 5 ploughs in lordship; 12 smallholders and 3 fisheries; meadow, 22 acres. Two others, ^[a third]^ William and Ralph, hold land for 2 ploughs. {Turstin} [* of Wigmore *] holds land
      which pays 19d; Warner <of Ewyas> land at 5s. They have 5 smallholders. Value of this castle of Ewyas [Harold] £10. [= ?[19]? Land of Alfred of Marlborough =]'
