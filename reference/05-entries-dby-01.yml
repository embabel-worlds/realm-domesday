    holding: borough
    textEdition: ?B? In the Borough of DERBY before 1066 there were 243 resident burgesses. To this borough are attached 12 carucates of land taxable, which 8 ploughs can plough. This land was divided between
      41 burgesses who also had 12 ploughs. From dues and tolls and fines and all customary dues, two parts [were] the King's, the third the Earl's. In the same borough 1 church was in the King's lordship,
      with 7 clerics, who held 2 carucates of land freely in [Little] Chester. There was also another church, likewise the King's, in which 6 clerics held 9 bovates of land in Quarndon and [Little] Eaton,
      likewise freely. In the town itself were 14 mills.
    text: In the Borough of DERBY before 1066 there were 243 resident burgesses. To this borough are attached 12 carucates of land taxable, which 8 ploughs can plough. This land was divided between 41 burgesses
      who also had 12 ploughs. From dues and tolls and fines and all customary dues, two parts [were] the King's, the third the Earl's. In the same borough 1 church was in the King's lordship, with 7 clerics,
      who held 2 carucates of land freely in [Little] Chester. There was also another church, likewise the King's, in which 6 clerics held 9 bovates of land in Quarndon and [Little] Eaton, likewise freely.
      In the town itself were 14 mills.
