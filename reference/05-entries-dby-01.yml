    name: Bakewell (Derbyshire 1,27)
    holding: manor
    textEdition: '[* BLACKWELL Wapentake *] ?M? In BAKEWELL, with 8 outliers, King Edward had 18 carucates of land taxable. Land for 18 ploughs. Now the King has in lordship 7 ploughs and 33 villagers and
      9 smallholders. 2 priests and a church, and under them 2 villagers and 5 smallholders, all of whom have 11 ploughs altogether. 1 man-at-arms has 16 acres of land and 2 smallholders. 1 mill, 10s 8d;
      1 lead mine; meadow, 80 acres; underwood 1 league long and 1 wide. Of this land, 3 carucates belong to the church. Henry of Ferrers claims 1 carucate in HADDON. These are the outliers of this manor:
      HADDON, HOLME, ROWSLEY, ''BURTON'', CONKSBURY, ONE ASH, MONYASH, HADDON. ^[With Ashford[-in-the-Water] and Hope it paid £30, 5 1/2 sesters of honey and 5 wagon-loads of 50 lead sheets before 1066;
      now they pay £10 6s. William Peverel has charge [of them]]^ [= ?1? Land of the King. King William holds it. King Edward held it =]'
    text: '[BLACKWELL Wapentake] In BAKEWELL, with 8 outliers, King Edward had 18 carucates of land taxable. Land for 18 ploughs. Now the King has in lordship 7 ploughs and 33 villagers and 9 smallholders.
      2 priests and a church, and under them 2 villagers and 5 smallholders, all of whom have 11 ploughs altogether. 1 man-at-arms has 16 acres of land and 2 smallholders. 1 mill, 10s 8d; 1 lead mine; meadow,
      80 acres; underwood 1 league long and 1 wide. Of this land, 3 carucates belong to the church. Henry of Ferrers claims 1 carucate in HADDON. These are the outliers of this manor: HADDON, HOLME, ROWSLEY,
      ''BURTON'', CONKSBURY, ONE ASH, MONYASH, HADDON. [With Ashford[-in-the-Water] and Hope it paid £30, 5 1/2 sesters of honey and 5 wagon-loads of 50 lead sheets before 1066; now they pay £10 6s. William
      Peverel has charge [of them]]'
