      DONINGTON 5 carucates of land. Meadow 3 furlongs long and 1 furlong wide. In COSSINGTON 6 carucates of land. In HOTON 6 carucates of land. In SEAGRAVE 2 carucates of land. Meadow, 10 acres. In SILEBY
