      is waste. In GADDESBY 1 carucate of land. Meadow, 4 acres; a mill, 3s. In ROTHERBY 3 carucates of land less 2 bovates Meadow, 3 acres. In FRISBY[-on-the-Wreake] 1 1/2 carucates of land. Meadow, 4
      acres; a mill, 28d. Of these lands 4 men-at-arms hold 12 carucates of land from the Earl. In these the Earl himself has in lordship 4 1/2 ploughs, and 30 Freemen, 25 villagers and 13 smallholders
      who have 15 1/2 ploughs, with 1 slave. His men-at-arms have in lordship 3 ploughs, and 12 villagers with 1 Freeman and 2 smallholders who have 3 ploughs. [= ?43? Land of Earl Hugh =]'
