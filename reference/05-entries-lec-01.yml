    textEdition: In FRAMLAND Wapentake Geoffrey holds MELTON [Mowbray] himself. 7 hides, 1 carucate of land and 1 bovate. In each hide are 14 1/2 carucates of land. In lordship 4 ploughs; 4 slaves. 20 villagers
      with 2 priests and 14 smallholders have 6 1/2 ploughs. A market which pays 20s; 2 mills, 25s; meadow, 20 acres; woodland 1 furlong long and 1 furlong wide. The value was 100s; now £8. These members
      are attached to this manor. In FREEBY 10 carucates of land. Meadow, 30 acres. In WYFORDBY 1 1/2 carucates of land and 1/2 bovate. Meadow, 6 acres. In BURTON [Lazars] 12 carucates of land less 1 bovate.
      Meadow, 12 acres. In [Eye] KETTLEBY 8 carucates of land. Meadow, 6 acres. In KIRBY [Bellars] 17 carucates of land. In SYSONBY 2 1/2 carucates of land. In EASTWELL 6 carucates of land. Meadow, 10 acres.
      In GOADBY [Marwood] 6 carucates of land. Meadow, 20 acres. In these lands there were 48 ploughs before 1066. Now 100 Freemen with 10 villagers and 13 smallholders who have 43 ploughs. Value of the
      whole when acquired £4 10s; now £15 10s. Before 1066 Leofric son of Leofwin held this land with full jurisdiction. [= ?29? Land of Geoffrey of la Guerche =] <235d>
