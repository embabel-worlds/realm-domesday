    textEdition: COSWARTH has been taken away from St Petroc's Church; before 1066 it paid this Church 1 ox and 7 sheep as a customary due. The King holds it. [!1! Brictric held it in 1066. !1!] <121b>
      These lands listed below have been taken from St Petroc's. The Count of Mortain holds them, and his men from him. In TREGENNA? 1 virgate of land, which paid 15d in customary dues. In TREVORNICK 1/2
      hide of land paid 12 sheep and 15d. In TRENHAILE 1 virgate of land paid 6 sheep and 8d. In [Higher] TOLCARNE 1/2 hide of land paid 1 ox. In TREMORE 1/2 hide of land paid 1 ox, 15d and 12 sheep. In
      LANCARFFE 1 virgate of land paid 15d. In TRENINNICK 1 virgate of land paid 15d and 5 sheep. Before 1066 St Petroc's held all the lands listed above. This Saint's lands have never paid tax, save to
      this Church.
