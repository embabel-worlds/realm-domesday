    name: Lichfield (Staffordshire 2,22)
    holding: manor
    textEdition: '[* In OFFLOW Hundred *] The Bishop holds LICHFIELD himself. It has already been described before. Woodland 8 1/2 leagues and 7 furlongs long and 6 1/2 leagues and 8 furlongs wide, belongs
      there. To the manor itself belong these members: `HORTON'', land for 2 ploughs; Alwin holds it. PACKINGTON, land for 4 ploughs; Ulfkil holds it. TAMHORN, land for 4 ploughs; Nigel [* of Stafford *]
      holds it. HANDSACRE, land for 5 ploughs; Robert holds them. HINTS, land for 7 ploughs; Oswald <of Hints> holds it. YOXALL, land for 4 ploughs; Raven <of Yoxall> and Alwin hold it. [Pipe] RIDWARE,
      land for 1 plough; Alric holds it. WEEFORD, {BUROUESTONE} and {LITELBECH}, land for 4 ploughs; Ralph holds it. FREEFORD, land for 6 ploughs; Ranulf holds it. `TYMMOR'', land for 1 plough; Ranulf holds
      it. HARBORNE, land for 1 plough; [* another *] Robert holds it. SMETHWICK, land for 2 ploughs. TIPTON land for 5 ploughs; William holds it. In these lands or outliers, 7 ploughs in lordship; 60 villagers
      and 22 smallholders with 25 ploughs. Between them all, meadow, 52 acres; a mill. The value [of these members] is accounted for in [that of] the manor. [= ?2? Land of the Bishop of Chester =] <247c>
      ?3? Land of St Peter''s of Westminster'
    text: '[In OFFLOW Hundred] The Bishop holds LICHFIELD himself. It has already been described before. Woodland 8 1/2 leagues and 7 furlongs long and 6 1/2 leagues and 8 furlongs wide, belongs there.
