    textEdition: In BRADENHAM William of Warenne holds 1/2 carucate of land which Godric [* the steward *] held. Always 5 villagers, 2 smallholders; 1 slave. 1 plough in lordship and 1 men's plough. Also
      2 free men who hold land [ploughed] by 2 oxen. Woodland, 20 pigs; meadow, 4 acres. Value then 10s; now the same, but William's men say that he had nothing from it. William held this land before [Ralph]
      forfeited but as the Hundred testifies [* Earl *] R[alph] [* Wader *] held it when he forfeited. Afterwards Robert Blunt [held it] at revenue from the King and Godric [answered for it] in the King's
      treasury in his return for 20s. Later it was in the King's hands. The men of the Hundred did not see the writ or the commissioner who delivered it to W[illiam]. [= Annexation of William of Warenne
      =]
