    textEdition: In BRETTENHAM Thorgisl held; 7 free men before 1066, 1 1/2 carucates of land. Meadow, 2 acres. Then and later 1 1/2 ploughs, now 1 plough; and there could be 1/2. Value then 30s; later
      and now 20[s]. The jurisdiction of 6 of these [was] in the King's [manor of] Buckenham; St Etheldreda's [had] the jurisdiction and patronage of the seventh. But Lisois [* of Moutiers *] kept the whole
