      30 smallholders, later and now 36. Then 7 slaves, now 4. Then 4 ploughs in lordship, now 2. Then 7 men''s ploughs, <246b> now 5. Woodland, 20 pigs; meadow, 4 acres. Under him 4 free men, 1 carucate
      of land, delivered to Heinfrid <of Icklingham> his predecessor for land. Under these, 5 villagers; 12 smallholders. Then 5 ploughs between them all, now 4. 1 horse at the hall. Now 40 pigs; 20 goats.
      Value of the whole then £6, now [£]8. In the same ^[Topcroft]^ [another] Godwin, a free man, half Edric''s and half St Edmund''s under patronage only before 1066, held 1 1/2 carucates [of land] where
      Godwin held. Always 8 villagers; 11 smallholders. Always 4 slaves. Then 2 ploughs, now none. Then 8 1/2 men''s ploughs, now 5 1/2. Meadow, 3 acres. Value of the whole then 30s, now 40[s]. It has 1
      league and 1 furlong in length, and 9 furlongs in width, tax of 20d, whoever holds there. [= ?29? Lands of Eudo son of Spirewic =]'
