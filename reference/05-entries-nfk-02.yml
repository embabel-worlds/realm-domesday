      men, 20 acres; 1 plough. His predecessor had the patronage of these before 1066. Also 2 free men and a half, 75 acres, in patronage only before 1066. 1 smallholder and a half. Always 2 1/2 ploughs.
      2 slaves. Also 1 free man, at 1/2 acre. Value then 10s; now 17[s]. Intwood has 1 league in length and 1/2 in width; tax of 9 1/4d. Value of this manor before 1066, 60s; now 80[s]. LANDS OF WALTER
