    textEdition: BLOFIELD Hundred In POSTWICK Skuli, 1 free man, held before 1066 2 carucates of land. The 6 villagers, later and now 5. Always 9 smallholders; 2 slaves. Then 1 1/2 ploughs in lordship,
      later and now 1. Always 3 men's ploughs; woodland, 40 pigs; meadow, 15 acres. Now 1 mill. Always 3 cobs; 15 head of cattle. Then 40 pigs, now 16. 1 church, 20 acres; value 2s. 1 outlier, CATTON, is
      attached to this, at 30 acres of land. 3 smallholders. Then 1/2 a plough between the whole; now 5 oxen. Meadow, 5 acres. Value then 40s; later and now £4. In the same ^[Postwick]^ Rathi [* of Gimingham
      *], 1 free man, held 1 carucate of land before 1066. Always 3 villagers; 5 smallholders; 1 slave. Always 1 plough in lordship; 1/2 men's plough; woodland, 20 pigs; meadow, 8 [acres]; always 3 pigs.
      Also 2 Freemen, at 4 acres of land. Value then 20[s]; later and now 40[s]. Further in the same ^[Postwick]^ Skalpi [* the Guard *], a free man, held 1 carucate of land before 1066. Always 3 villagers.
      Then 1 plough in lordship. Always 1/2 men's plough; woodland, 15 pigs; meadow, 8 acres. Value then 15s; now 40[s]. The whole has 1 league in length and 1/2 in width, tax of 13 1/2d. Lisois [* of Moutiers
      *] held all this as 1 manor, now Eudo his successor holds. Before 1066 the full jurisdiction was in the Hundred, but now Eudo holds. [= ?24? Lands of Eudo the steward =]
