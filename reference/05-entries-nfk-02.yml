      Stigand the jurisdiction. In the same ^[Dersingham]^ 21 free men hold 2 carucates of land and 35 acres. 5 smallholders. Always 3 ploughs; meadow, 7 acres. Value of the whole, 40s. His predecessor
      had the patronage only of all these; 18 of them were to give 2s each if they wished to withdraw. [* Archbishop *] Stigand [had] the jurisdiction of them all. In the same ^[Dersingham]^ 2 free men,
      2 carucates of land. Then and later 2 ploughs in lordship, now 1. One of these had 6 free men and 5 smallholders, the other 4 smallholders. Always 1 men's plough; meadow, 11 1/2 acres. Value then
      and later 40s; now 25[s]. [= Annexation of Peter of Valognes =]
