    textEdition: Hundred of HUMBLEYARD Ralph holds INTWOOD which Coleman, a free man of [* Archbishop *] Stigand's, held; 1 1/2 carucates of land. Always 3 villagers; 3 smallholders. Then 2 slaves, now
      3. Always 2 ploughs in lordship; 1 1/2 men's ploughs; meadow, 3 <240b> acres; woodland, 8 pigs; 1/4 of a mill. Then 4 cobs, now 3; always 4 head of cattle. Then 40 pigs, now 30. Then 60 sheep, now
      50. 1 church, at 14 acres of land; meadow, 1 1/2 acres. 1 outlier, SWAINSTHORPE, 60 acres. A plough in lordship; meadow, 1 1/2 acres. Also 15 Freemen, 40 acres of land. Always 2 ploughs; meadow, 4
      acres. Also 5 free men, 20 acres; 1 plough. His predecessor had the patronage of these before 1066. Also 2 free men and a half, 75 acres, in patronage only before 1066. 1 smallholder and a half. Always
      2 1/2 ploughs. 2 slaves. Also 1 free man, at 1/2 acre. Value then 10s; now 17[s]. Intwood has 1 league in length and 1/2 in width; tax of 9 1/4d. Value of this manor before 1066, 60s; now 80[s]. [=
      ?24? Lands of Eudo the steward =] ?25? LANDS OF WALTER GIFFARD
