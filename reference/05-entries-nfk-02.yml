      100s; now £10 12s. 18 free men were an adjunct of this manor in patronage only, now 12; 1 carucate and 20 acres of land. Meadow, 5 acres. Then and later 4 ploughs, now 2. Value then 20s; now 28[s].
      These free men are by exchange. The whole has 2 leagues and 1 furlong in length and 1 league and 15 perches in width; tax of 9d.
    name: Hudeston (Norfolk 31,8)
