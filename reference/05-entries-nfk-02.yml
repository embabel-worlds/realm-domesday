      at 4 acres of land. Value then 20[s]; later and now 40[s]. Further in the same [Postwick] Skalpi [the Guard], a free man, held 1 carucate of land before 1066. Always 3 villagers. Then 1 plough in
      lordship. Always 1/2 men's plough; woodland, 15 pigs; meadow, 8 acres. Value then 15s; now 40[s]. The whole has 1 league in length and 1/2 in width, tax of 13 1/2d. Lisois [of Moutiers] held all this
