      2 ploughs, later and now 1 1/2 ploughs; woodland, 12 pigs. In MAYTON Albert [* the burnt *] holds 1 carucate of land, an outlier to this manor. Always 2 villagers; 1 mill. Later, 1 plough. Value [then]
      30s, now nothing. In CROSTWICK 6 men, 1 carucate of land. Then and later 2 ploughs, now 1/2. [* Archbishop *] Stigand had the jurisdiction of these men. In the lordship of this manor then 20 pigs;
      60 sheep; 4 head of cattle; now nothing. Always 20 goats. Value then and later 100s; now £7. The whole of Hainford has 1 league in length and 1/2 in width; tax of 23 1/2d. Mayton has 3 furlongs in
      length and 3 in width, and Crostwick half a league in length and 4 furlongs in width; tax of 10d. [= ?26? Lands which were of Roger of Poitou =]
