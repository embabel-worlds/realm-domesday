    textEdition: This is the Hundred of `EAST FLEGG' In FILBY 51 acres; 1 free man before 1066. Then Alwy [* of Thetford *] had the patronage only of this man's wife and the wife had nothing out of this
      land. Earl R[alph] ^[Wader]^ had possession of this land when he forfeited. Robert Blunt held it at tribute in the King's hands. Later the same Alwy, R[oger] Bigot's predecessor, annexed it under
      Godric [* the steward *], and his son Stanhard [* son of Alwy *] held it. Whereof Roger Bigot has given pledge and does not claim this land as part of his Holding. Now Godric has custody of it in
      the King's hands. There is on that land 1 plough; meadow, 1 1/2 acres. Value 5s. [= Annexation of Roger Bigot =]
