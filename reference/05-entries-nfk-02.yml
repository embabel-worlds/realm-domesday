    textEdition: '`HENSTEAD'' Hundred In BRAMERTON Aitard [* of Vaux *] holds from Roger 16 acres which a free woman under the patronage of Edric [* of Laxfield *] held. Earl R[alph] ^[Wader]^ held when
      he forfeited so the Hundred testifies, and later Robert Blunt in the King''s hands, and now Aitard [* of Vaux *], a man under the patronage of Roger Bigot, holds it since R[alph] forfeited. The Hundred
      testifies that it is so and the woman herself offers judicial ordeal that it is true as the Hundred testifies. Aitard [* of Vaux *] counters this. Under her there are two whole free men and a half,
      at 6 acres. Meadow, 1 1/2 acres. Between them all always 1/2 plough. Value then 2s; now 4[s]. [= Annexation of Roger Bigot =]'
