    textEdition: William [* of Parthenay *] holds BARNEY which Thorkil held before 1066, 2 carucates of land. Then and later 14 smallholders, now 13. Always 2 ploughs in lordship; 1 men's plough. Then and
      later 2 slaves, now 1. Woodland for 60 pigs; meadow, 14 acres; always 1 cob. Then 14 wild mares. Then and later 10 head of cattle, now 14. Then 20 pigs, now 28. Then 60 sheep, now 100. Then 40 goats,
      now 38. Now 2 beehives. Also 17 free men, 80 acres of land. He claims [to hold] these by livery to make up this manor. Always 2 ploughs; meadow, 6 acres. Value then and always £4. It has half a league
      in length and a half in width, tax of 6d. One of the King's servants claims, by whatever mode of trial it be adjudged, 13 and a half of these [free men] as part of the Holding of Earl Ralph ^[Wader]^
      who held them when he forfeited, and this the Hundred testifies. They hold 80 acres of land; meadow, 2 acres. They pay 17s 4d in [Great] Snoring. [= ?34? Lands of Peter of Valognes =]
