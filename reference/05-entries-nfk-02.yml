    textEdition: Leofric, 1 free man under the patronage of [* Earl *] Harold, held in CHEDGRAVE, now Geoffrey [* Baynard *] holds as a manor, 2 carucates of land. <253b> Always 4 villagers; 6 smallholders.
      Then 1 slave, now none. Then 2 ploughs in lordship; later 1/2, now 2. Then 2 men's ploughs, later and now 1 1/2. Woodland, 15 pigs; meadow, 12 acres; 1 mill. Then 2 head of cattle, now 1. Then 5 pigs,
      now none. 1 church, 50 acres; meadow, 1 [acre]; value 2 {orae}. Also 6 Freemen and a half, at 23 acres; 1 free man under the patronage of Leofric with 17 Freemen and a half. Then 1 plough, now 1 1/2.
      Always 1/2 [carucate?] plough; meadow, 1/2 acre. Value then and later 30s; now 40[s]. This is by exchange. Robert son of Corbucion claims [to hold] this land by livery, but ^[Ralph]^ Baynard had possession
      first, Robert later, and the Hundred does not know by what means. The jurisdiction [is] in the Hundred. [= ?31? Lands of Ralph Baynard =]
    text: Leofric, 1 free man under the patronage of [Earl] Harold, held in CHEDGRAVE, now Geoffrey [Baynard] holds as a manor, 2 carucates of land. Always 4 villagers; 6 smallholders. Then 1 slave, now
      none. Then 2 ploughs in lordship; later 1/2, now 2. Then 2 men's ploughs, later and now 1 1/2. Woodland, 15 pigs; meadow, 12 acres; 1 mill. Then 2 head of cattle, now 1. Then 5 pigs, now none. 1 church,
      50 acres; meadow, 1 [acre]; value 2 orae. Also 6 Freemen and a half, at 23 acres; 1 free man under the patronage of Leofric with 17 Freemen and a half. Then 1 plough, now 1 1/2. Always 1/2 [carucate?]
      plough; meadow, 1/2 acre. Value then and later 30s; now 40[s]. This is by exchange. Robert son of Corbucion claims [to hold] this land by livery, but [Ralph] Baynard had possession first, Robert later,
      and the Hundred does not know by what means. The jurisdiction [is] in the Hundred.
