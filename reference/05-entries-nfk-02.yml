    textEdition: In BIXLEY 1 free man under the patronage of Aslak <of {Rodenhala}> with a half-a-free-man before 1066, at 17 acres. Always 1/2 plough. 1 villager; 1 smallholder. Roger Bigot has custody
      of him in the King's hands so he says and he pays tribute in the Hundred. But the Hundred testifies that Godric the steward held under the King as part of Earl R[alph] ^[Wader]^'s Holding for 1 year
      before he forfeited and later for 2 years of the King's gift. Against this Roger Bigot offers to prove the contrary by judicial ordeal or by battle. Godric claims this [land] with half <278a> of the
      land which is in Roger Bigot's return. Godric the steward acquired this for 1/2 carucate of land. [= Annexation of Roger Bigot =]
    text: In BIXLEY 1 free man under the patronage of Aslak with a half-a-free-man before 1066, at 17 acres. Always 1/2 plough. 1 villager; 1 smallholder. Roger Bigot has custody of him in the King's hands
      so he says and he pays tribute in the Hundred. But the Hundred testifies that Godric the steward held under the King as part of Earl R[alph] [Wader]'s Holding for 1 year before he forfeited and later
      for 2 years of the King's gift. Against this Roger Bigot offers to prove the contrary by judicial ordeal or by battle. Godric claims this [land] with half of the land which is in Roger Bigot's return.
      Godric the steward acquired this for 1/2 carucate of land.
    name: Bixley (Norfolk 66,81)
