    textEdition: In SOUTHWOOD Wigmund <of Southwood>, 1 free man of whom Godric [* the steward *]'s predecessor had the patronage before 1066, holds 60 acres. Always 2 smallholders. Then and later 1 plough;
      meadow, 2 acres. Also 26 free men in patronage under him, 83 1/2 acres. Then and later 6 ploughs, now 2. Value then 20s; now 40[s]. This is by exchange. Robert son of Corbucion claims this land of
      the King's gift and vouches [the King] his deliverer, but the Hundred testifies that ^[Ralph]^ Baynard had possession of it before. The whole of Southwood has 1 league in length and 1/2 in width;
      tax of 8d. [= ?31? Lands of Ralph Baynard =]
