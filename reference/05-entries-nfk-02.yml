    textEdition: '`WEST FLEGG'' Hundred In BURGH [St Margaret] [* Earl *] Gyrth held freely 60 acres of land before 1066; meadow, 8 acres. 1 villager. Also 8 free men under him, at 27 acres of land; meadow,
