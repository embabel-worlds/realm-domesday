    textEdition: TUNSTEAD Hundred He also ^[Albert [* the burnt *]]^ holds TUNSTEAD [which] Alfhere, a thane of [* Earl *] Harold's, [held] before 1066, 5 1/2 carucates of land. Always 23 villagers; 16
      smallholders. Then and later 2 ploughs, now 1/2. Then 12 men's ploughs, later and now 7. Meadow, 8 acres; woodland, 12 pigs. Then 3 head of cattle. Then 4 pigs, now 1. Then 140 sheep, now 100. Also
      24 Freemen, 1 carucate of land. Then 12 ploughs, later and now 5. Meadow, 2 acres. They were added after 1066. And Earl R[alph] ^[Wader]^ added 6 free men, 1 1/2 carucates of land. St Benedict's ^[of
      Holme]^ has the jurisdiction of these, and the patronage of one, and the 3 forfeitures of the 24. The 6 free men have under them 4 smallholders. Then 4 ploughs, later and now 3. Meadow, 2 acres. To
      this manor Robert the bowman added, after ^[Earl]^ Ralph ^[Wader]^ forfeited - by order of Godric [* the steward *] he says, but he himself denies it - 1 carucate of land which lay in Hoveton before
      1066, which Earl Ralph ^[the constable]^ gave to St Benedict's with his wife. Then 7 villagers, and when Robert took it 7, now 6. Value 10s. Then 1 1/2 ploughs, when Robert took it the same, now 1
      plough. Meadow, 4 acres. Value then 100s; when Robert the bowman held it in the King's hands from Godric £10; now [£]11. It has 1 league and 1 furlong in length and 1 league in width; <244b> tax of
      18d. In [Sco] RUSTON 1 free man, 6 acres of land; meadow, 1 acre. [It is included] in the same valuation. In WESTWICK 1 free man and a half, 12 acres. [It is included] in the same valuation. [= ?26?
      Lands which were of Roger of Poitou =]
    text: TUNSTEAD Hundred He also [Albert [the burnt]] holds TUNSTEAD [which] Alfhere, a thane of [Earl] Harold's, [held] before 1066, 5 1/2 carucates of land. Always 23 villagers; 16 smallholders. Then
      and later 2 ploughs, now 1/2. Then 12 men's ploughs, later and now 7. Meadow, 8 acres; woodland, 12 pigs. Then 3 head of cattle. Then 4 pigs, now 1. Then 140 sheep, now 100. Also 24 Freemen, 1 carucate
      of land. Then 12 ploughs, later and now 5. Meadow, 2 acres. They were added after 1066. And Earl R[alph] [Wader] added 6 free men, 1 1/2 carucates of land. St Benedict's [of Holme] has the jurisdiction
      of these, and the patronage of one, and the 3 forfeitures of the 24. The 6 free men have under them 4 smallholders. Then 4 ploughs, later and now 3. Meadow, 2 acres. To this manor Robert the bowman
      added, after [Earl] Ralph [Wader] forfeited - by order of Godric [the steward] he says, but he himself denies it - 1 carucate of land which lay in Hoveton before 1066, which Earl Ralph [the constable]
