    holding: manor
    textEdition: '[In {ALNODESTREU} Hundred] The Earl holds MORVILLE himself with 18 outliers. King Edward held it. 12 hides. One of these outliers, Chawson, at 1 hide, is in Worcestershire. Of this land
      4 hides are in lordship; 2 ploughs there; 6 other ploughs would be possible. 9 villagers and 6 smallholders with 3 ploughs; a further two others would be possible. 4 ploughmen. The whole of {Alnodestreu}
      Hundred belongs to this manor. Two pennies were King Edward''s, the third the Earl''s. In total, it paid £10; value now of what the Earl has £3. This manor''s church is in honour of St Gregory [*
      of Morville *] and before 1066 it had 8 hides of this land; 8 canons served there. The Church of St Peter [* of Shrewsbury *] holds this church from the Earl with 5 hides of land. In lordship 2 ploughs;
      4 others possible. 9 villagers, 1 smallholder and 3 priests with 9 ploughs; 4 ploughmen. A man-at-arms holds 1 hide and pays 4s to the monks. Value of the whole of this, 67s. The Earl ^[Roger]^''s
      chaplains hold the remaining 3 hides, and 5 men from them. Land for 6 ploughs. 2 ploughs there. Value of the whole, 60s and 18d. Of this manor''s land Richard the butler holds 2 hides. He has 1 plough,
      2 slaves and 7 villagers with 1 plough. A mill which pays 10 packloads of corn. 9 more ploughs would be possible. Value 20s. [= ?[4,1]? [What Earl Roger himself holds] =] <253c>'
