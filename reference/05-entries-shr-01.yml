    textEdition: In {CULVESTAN} Hundred Roger also holds STANTON [Lacy]. Siward [* the fat *] held it; he was a free man. 20 1/2 hides which pay tax. Land for 50 ploughs. In lordship 10 ploughs; 28 slaves,
      male and female; 67 villagers, 2 smiths, 5 smallholders and 4 Cottagers; between them all they have 23 ploughs. A church which has 1 1/2 hides; 2 priests with 2 villagers have 3 ploughs. 2 mills at
      26s. St Peter's of Hereford has 1 villager there. Of this manor's land Richard [* of Stanton *] holds 1 1/2 hides, Ascelin <of Colton> 1 1/2 hides, <260d> Roger 1 1/2 hides. They have 6 ploughs in
      lordship and 6 slaves and 2 half-villagers, 5 smallholders and 2 Cottagers with 1 plough. A mill at 10s. Also of this manor 4 servants have land for 3 ploughs and 1 furlong and 10 acres of land; they
      have 4 ploughs. 3 riding men who have land for 2 1/2 ploughs. They have as many ploughs. A man, Auti <of Quatt>, holds one member of this manor, where there are 3 hides. He has 1 plough, with a half-villager.
      Value of the whole manor before 1066 £24; now £25. [= ?7? Land of Roger of Lacy =]
