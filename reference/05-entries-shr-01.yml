    textEdition: The English burgesses of SHREWSBURY state that it is very hard on them that they pay as much tax as was paid before 1066, although the Earl's castle has taken over 51 messuages and 50 other
      messuages are unoccupied and 43 French burgesses hold messuages which paid tax before 1066 and the Earl has himself given to the Abbey, which he is building there, 39 burgesses who once paid tax likewise
      with the others. In total there are 200 messuages, less 7, which do not pay tax. List 2 List of those who hold land from the King in Shropshire 1 The Bishop of Chester 2 The Bishop of Hereford 3 Saint-Rémy's
      Church 4 Earl Roger, with his men, holds the remainder 5 Osbern son of Richard 6 Ralph of Mortimer 7 Roger of Lacy 8 Hugh the ass 9 Nigel the doctor <252b> ?1? Land of the Bishop of Chester
