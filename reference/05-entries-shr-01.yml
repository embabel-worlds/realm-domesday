    holding: manor
    textEdition: In this manor ^[BROMFIELD]^ before 1066 there were 20 hides; 12 canons of this Church ^[St Mary's of Bromfield]^ had the whole. One of them, Spirtes ^[the priest]^ by name, alone held 10
      hides, but after he had been exiled from England King Edward gave these 10 hides to Robert son of Wiuhomarch as if to a canon. But Robert gave the same land to a son-in-law of his. When the canons
      informed the King of this, he immediately ordered the land to be returned to the Church, only waiting until, at the imminent Christmas court, he could command Robert to provide other land for his
      son-in-law. However, the King himself died during those feast days and from then until now the Church has been without the land. Now Robert holds it from Earl Roger. It is waste and was found waste.
      In total, land for 54 ploughs. ?[3e]? What St Michael's [* of Shrewsbury *] holds
