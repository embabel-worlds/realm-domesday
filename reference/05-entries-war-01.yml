    name: Alveston (Warwickshire 3,4)
    holding: land
    textEdition: Before 1066 Brictwin held 7 1/2 hides in ALVESTON. Archbishop Aldred had the full jurisdiction of this land, and market rights and church-tax, and all other forfeitures except those four
      which the King has throughout his whole Kingdom. His sons Leofwin [* uncle of Thorkil *], Edmer and four others testify thereto, but they do not know from whom he held this land, whether from the
      church or from Earl Leofric, whom he served. They state however that they held it themselves from Earl Leofric, and could turn where they would with the land. Brictnoth and Alwy held the remaining
      7 1/2 hides before 1066, but the County does not know from whom they held. Bishop Wulfstan however states that he established his claim to this land before Queen Matilda in the presence of the four
      Sheriffdoms, and he has King William's writ for it, and also the witness of the County of Warwick. [= ?3? Land of the Bishop of Worcester =]
    text: Before 1066 Brictwin held 7 1/2 hides in ALVESTON. Archbishop Aldred had the full jurisdiction of this land, and market rights and church-tax, and all other forfeitures except those four which
      the King has throughout his whole Kingdom. His sons Leofwin [uncle of Thorkil], Edmer and four others testify thereto, but they do not know from whom he held this land, whether from the church or
      from Earl Leofric, whom he served. They state however that they held it themselves from Earl Leofric, and could turn where they would with the land. Brictnoth and Alwy held the remaining 7 1/2 hides
      before 1066, but the County does not know from whom they held. Bishop Wulfstan however states that he established his claim to this land before Queen Matilda in the presence of the four Sheriffdoms,
      and he has King William's writ for it, and also the witness of the County of Warwick.
