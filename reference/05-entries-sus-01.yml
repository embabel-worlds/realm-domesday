    places: Stoughton
    name: Stoughton (Sussex 11,37)
    holding: manor
    textEdition: The Earl holds STOUGHTON himself, in lordship. Earl Godwin held it. 36 hides there, but then and now it answered for 15 hides. 16 of these hides were put in the manor of Westbourne, but
      now they are in Stoughton again. Land for 26 ploughs. In lordship 3 ploughs; 54 villagers and 35 smallholders with 23 ploughs. 5 slaves; meadow, 11 acres; woodland at 100 pigs; 15 sites in Chichester
      at 7s 8d. In this manor is a church, to which 1 1/2 hides belong. A priest has 1/2 plough there; value of this £4. Value of the whole manor before 1066 £40; later £30; now £40; however, it pays £50.
      1 hide of this manor is in the Rape of William of Braose ^[Bramber]^; woodland, 1500 pigs. [= ?11? Land of Earl Roger =]
