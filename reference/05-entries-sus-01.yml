    textEdition: In BEXHILL Hundred Osbern [* son of Geoffrey *] holds BEXHILL from the Count. Before 1066 Bishop Alric held it because it is the Bishopric's; he held it later until King William gave the
      castlery of Hastings to the Count. Before 1066 and now it answered for 20 hides. Land for 26 ploughs. The Count holds 3 hides of the land of this manor himself in lordship. He has 1 plough; 7 villagers
      with 4 ploughs. Osbern [* son of Geoffrey *] has 10 hides of this land; Wenenc 1 hide; William of Sept-Meules 2 1/2 hides less 1/2 virgate; Robert St Léger 1 hide and 1/2 virgate; Reinbert [* the
      sheriff *] 1/2 hide; Ansketil [* of Rieux *] 1/2 hide; Robert of Criel 1/2 hide; the clerics Geoffrey and Roger 1 hide in prebend; 2 churches. In lordship 4 ploughs; 46 villagers and 27 cottagers
      with 29 ploughs. In the whole manor, meadow, 6 acres. Value of the whole manor before 1066 £20; later it was waste; now £18 10s; the Count's part takes 40s thereof. [= ?9? Land of the Count of Eu
      =]
