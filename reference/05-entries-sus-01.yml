    textEdition: Ralph [* of Quesnay *] holds HAMSEY from William. Wulfeva [* {Beteslau} *] held it from King Edward. Then it answered for 25 hides; now there are 14 because the others are in the Count
      of Mortain's Rape, namely 7 hides; and in Earl Roger's Rape 4 hides less 1/2 virgate. Now what Ralph has pays tax for 13 hides. Land for 13 ploughs. In lordship 2 hides; 16 villagers and 14 smallholders
      with 10 ploughs. A church; meadow 200 acres; woodland at 10 pigs; from grazing 13s. Hugh holds 1 hide of this land; ^[another]^ Ralph 1/2 hide. Total value before 1066 £20; later £10; now £10. [=
      ?12? Land of William of Warenne =]
