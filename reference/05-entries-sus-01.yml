    textEdition: '[* Lewes Rape *] In SWANBOROUGH Hundred William of Warenne holds IFORD in lordship. Queen Edith held it. Before 1066 it answered for 77 1/2 hides. When William acquired it there were only
      58 hides because the others were in the Count of Mortain''s Rape [* Pevensey *]. These 58 hides now answer for 36 hides. Land for 52 ploughs. In lordship 5 ploughs. 100 villagers, less 3, and 32 smallholders
      have 34 ploughs. A church; 6 slaves; 2 mills at 23s; meadow, 208 acres; woodland, 30 pigs; 26 burgesses in the Borough of Lewes at 13s; from pasture 15s 8d; 16 thousands of herrings. The monks of
      St Pancras [of Lewes] hold 6 1/2 hides of this land. They have 2 ploughs in lordship, and 10 villagers with 3 ploughs. These hides do not pay tax. Hugh [* son of Golda *] has 2 hides of this land;
      Tosard 1 1/2 hides. They have 2 ploughs in lordship, with 4 smallholders. The villagers held these lands. Value of the whole manor before 1066 £50; later £20; now, William''s lordship £35, the monks''
      £3; the men''s 75s. [= ?12? Land of William of Warenne =]'
