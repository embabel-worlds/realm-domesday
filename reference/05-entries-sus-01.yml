      4 1/2 virgates; {Werelc} 2 virgates; another Robert 2 virgates. Between them they have 3 1/2 ploughs in lordship; and 12 villagers and 3 smallholders with 7 ploughs. Value of the whole manor before
      1066 £25; later £6; now the Count''s lordship £14; his men-at-arms'' £7 7s. [= ?9? Land of the Count of Eu =]'
