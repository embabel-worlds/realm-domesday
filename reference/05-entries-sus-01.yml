    places: Lewes
    name: Lewes (Sussex 12,1)
    holding: borough
    textEdition: '[Lewes Rape] [* In SWANBOROUGH Hundred *] The Borough of LEWES before 1066 paid £6 4s and 3 halfpence from tribute and toll. King Edward had 127 burgesses in lordship. Their custom was,
      if the King wished to send his men in his absence to guard the sea, they collected 20s from all men whosesoever the land was, and those who had charge of arms in the ships had these [shillings]. Whoever
      sells a horse in the Borough gives a penny to the reeve; the buyer gives another; for an ox 1/2d; for a man 4d, wherever he buys within the Rape. Whoever sheds blood is fined 7s 4d. A man who commits
      adultery or rape is fined 8s 4d, and a woman as much. The King has the adulterous man, the Archbishop the woman. For a fugitive, 8s 4d if he is recovered. When the money is renewed, each moneyer gives
      20s. Of all this, two parts {{are}} were the King''s; the third was the Earl''s. In all, the Borough pays now as it did then, and 38s in addition. In the Rape of Pevensey 39 inhabited messuages and
      20 uninhabited, from which the King has 26s 6d; William of Warenne has half of them. Total value before 1066 £26. The King had one half, and the Earl ^[Harold]^ the other; value now £34, and 112s
      from the new mint; William has half of all this, and the King the other half. [= ?12? Land of William of Warenne =]'
    text: '[Lewes Rape] [In SWANBOROUGH Hundred] The Borough of LEWES before 1066 paid £6 4s and 3 halfpence from tribute and toll. King Edward had 127 burgesses in lordship. Their custom was, if the King
      wished to send his men in his absence to guard the sea, they collected 20s from all men whosesoever the land was, and those who had charge of arms in the ships had these [shillings]. Whoever sells
      a horse in the Borough gives a penny to the reeve; the buyer gives another; for an ox 1/2d; for a man 4d, wherever he buys within the Rape. Whoever sheds blood is fined 7s 4d. A man who commits adultery
      or rape is fined 8s 4d, and a woman as much. The King has the adulterous man, the Archbishop the woman. For a fugitive, 8s 4d if he is recovered. When the money is renewed, each moneyer gives 20s.
      Of all this, two parts were the King''s; the third was the Earl''s. In all, the Borough pays now as it did then, and 38s in addition. In the Rape of Pevensey 39 inhabited messuages and 20 uninhabited,
      from which the King has 26s 6d; William of Warenne has half of them. Total value before 1066 £26. The King had one half, and the Earl [Harold] the other; value now £34, and 112s from the new mint;
      William has half of all this, and the King the other half.'
