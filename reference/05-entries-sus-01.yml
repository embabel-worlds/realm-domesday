    textEdition: '[* Pevensey Rape *] In {WANDELMESTREI} Hundred The Abbot of St Martin''s of Battle holds ALCISTON from the King. Alnoth the noble [* of Kent *] held it from King Edward. Then it answered
      for 50 hides; now for 44 1/2 hides. Land for 28 ploughs. 3 1/2 of these hides lie in the Rape of Hastings; and 2 hides in the Rape of Lewes; 7 burgesses [* in Pevensey *]. The Abbot has 4 ploughs
      in lordship. 65 villagers with 7 smallholders have 21 1/2 ploughs. 12 slaves; meadow, 50 acres; woodland, 4 pigs from pasturage; 6 pigs from grazing. Of the said 5 hides, Robert holds 1 hide and 3
      virgates from the Abbot; Reinbert [* the sheriff *] 5 virgates; Geoffrey 1/2 hide; Alfred 3 virgates. In lordship they have 4 ploughs. 5 villagers and 1 smallholder with 1 1/2 ploughs. Value of the
      whole manor before 1066 £48; later £30; now, what the Abbot holds £36; what his men hold £4 5s. [= ?8? Land of Battle Church =]'
