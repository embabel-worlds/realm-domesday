    textEdition: '[* In Arundel Rape *] [* In BINSTED Hundred *] ARUNDEL CASTLE before 1066 paid 40s from a mill; 20s for 3 banquets; and 20s for 1 entertainment. Now the Borough and the harbour and the
      ship customs between them pay £12; value, however, £13, of which St Nicholas'' [* of Arundel *] has 24s. A fishery at 5s; a mill which pays 10 measures of wheat and 10 measures of rough corn; 4 measures
      in addition. This is valued at £14. Robert son of Theobald has 2 sites at 2s; he has his tolls from strangers. Morin has customs dues there from 2 burgesses at 12d; Arnold 1 burgess at 12d; Saint-Martin''s
      ^[of Sées]^ 1 burgess at 12d; Ralph <of Bignor> 1 site at 12d; William 5 sites at 5s; Nigel 5 sites which do service. [= ?11? Land of Earl Roger =]'
