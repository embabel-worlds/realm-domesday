    textEdition: Godfrey holds OVINGDEAN from William. Alnoth [* the noble *] held it from King Edward; he could go where he would. Then it answered for 5 hides. In the same village Edeva held 3 hides from
      the King, jointly. When Godfrey acquired them he found them in one manor, but of these 8 hides the Count of Mortain has 1 1/2 hides in his Rape. What Godfrey holds pays tax for 6 hides now. Land for
      4 ploughs. In lordship 2 ploughs; 5 villagers and 5 smallholders with 1 plough. A small church; 4 slaves. 10 sites in Lewes at 5s. With these hides Godfrey holds 2 hides of a manor of William's, his
      lord, which never paid tax; he has nothing there. Total value before 1066 £6; later £4; now £7. [= ?12? Land of William of Warenne =]
