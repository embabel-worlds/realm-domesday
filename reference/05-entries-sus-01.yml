    places: '[West]bourne'
    name: '[West]bourne (Sussex 11,30)'
    holding: manor
    textEdition: '[* In Chichester Rape *] In {GHIDENETROI} Hundred The Earl holds WESTBOURNE himself, in lordship. Earl Godwin held it. 36 hides there, but then and now it answered for 12 hides. Land for
      30 ploughs. In lordship 2 ploughs; 27 villagers and 31 smallholders with 15 ploughs. 7 slaves; 4 mills at 40s; a fishery at 16d; woodland, 3 pigs; 6 sites in Chichester at 30d. Warblington in Hampshire
      belongs to this manor. Before 1066 it answered for 12 hides; now for 4 hides. Land [for *** ploughs]. In lordship 2 ploughs; <24a> 17 villagers and 12 smallholders with 5 ploughs. 2 churches; 6 slaves.
      1 mill at 10s. Payne holds 4 hides of this land. Alric held it for the monastery ^[of Westbourne]^. In lordship 1 plough; 8 villagers and 5 smallholders with 2 ploughs. 1 mill at 10s; meadow, 2 acres;
      1 site in Chichester at 12d. Value of the whole manor before 1066 £30; later £10; now, what the Earl holds £40; however it pays £50; the value of what Payne holds is and was 60s. [= ?11? Land of Earl
      Roger =]'
    text: '[In Chichester Rape] In GHIDENETROI Hundred The Earl holds WESTBOURNE himself, in lordship. Earl Godwin held it. 36 hides there, but then and now it answered for 12 hides. Land for 30 ploughs.
      In lordship 2 ploughs; 27 villagers and 31 smallholders with 15 ploughs. 7 slaves; 4 mills at 40s; a fishery at 16d; woodland, 3 pigs; 6 sites in Chichester at 30d. Warblington in Hampshire belongs
      to this manor. Before 1066 it answered for 12 hides; now for 4 hides. Land [for *** ploughs]. In lordship 2 ploughs; 17 villagers and 12 smallholders with 5 ploughs. 2 churches; 6 slaves. 1 mill at
      10s. Payne holds 4 hides of this land. Alric held it for the monastery [of Westbourne]. In lordship 1 plough; 8 villagers and 5 smallholders with 2 ploughs. 1 mill at 10s; meadow, 2 acres; 1 site
      in Chichester at 12d. Value of the whole manor before 1066 £30; later £10; now, what the Earl holds £40; however it pays £50; the value of what Payne holds is and was 60s.'
