    textEdition: In EASTBOURNE Hundred The Count of Mortain holds EASTBOURNE in lordship. King Edward held it. There were and are 46 hides. Land for 28 ploughs. In lordship 4 ploughs; 68 villagers and 3
      smallholders with 28 ploughs. 1 mill at 5s; 16 salt-houses at £4 40d; meadow, 25 acres; from pasture £6. 2 hides and 1 virgate of this manor's land are in the Rape of Hastings. William [* of Keynes
      *] holds 1 hide of this land; Alfred [* the butler *] 1 hide; the castle wardens 2 hides; Roger the cleric 3 virgates. In lordship 1 1/2 ploughs; 2 villagers and 6 smallholders with 1/2 plough. Before
