    name: Treyford (Sussex 11,8)
    holding: manor
    textEdition: Robert son of Theobald holds TREYFORD from the Earl. Aelhard held it from Earl Godwin. Then and now it answered for 11 hides. Land for 6 ploughs. In lordship 2; 8 villagers and 8 smallholders
      with 4 ploughs. 5 slaves; 1 mill at 30d; meadow, 6 1/2 acres; woodland, 10 pigs. 2 hides of this manor's land are in the prebend of Chichester church. Robert ^[son of Theobald]^ holds it from the
      Bishop [* of Winchester *]. Offa held it from the Bishop [* of Winchester *] as a Holding, as a manor. Then and now it answered for 2 hides. It is valued at 8s, but it pays 15s. Value of the whole
      manor before 1066 and now 100s; when acquired 60s. The Abbot of St Peter's of Winchester claims this manor. The Hundred testifies that before 1066 the holder held it from the Abbot, for the term of
      his life only. [= ?11? Land of Earl Roger =]
