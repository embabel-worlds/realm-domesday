    textEdition: In STAPLE Hundred The Count holds EWHURST himself, in lordship. Alfhere held it from King Edward. Then it answered for 6 hides; now for 4 hides and 3 virgates; 5 virgates are foregone because
      1 hide is in the Count of Mortain's Rape [* Pevensey *]. Land for 20 ploughs. In lordship 4 ploughs; 12 villagers and 10 smallholders with 6 ploughs. 4 slaves; meadow, 12 acres; woodland, 10 pigs.
      Osbern [* son of Hugh *] holds 1 hide and 3 virgates of this manor's land in Bodiam; it always lay in Ewhurst [lands]; the hall was there. Roger 1/2 hide; Ralph 2 virgates. In lordship 1 1/2 ploughs;
      7 villagers and 10 smallholders with 4 1/2 ploughs. Value of the whole manor before 1066 £10; later £6; now £9. [= ?9? Land of the Count of Eu =]
