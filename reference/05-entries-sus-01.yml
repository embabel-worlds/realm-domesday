      Warin [the sheriff] 3 hides; Richard 1 hide. In lordship they have 7 1/2 ploughs, with 29 smallholders, 3 villagers and 10 slaves with 3 ploughs. 6 burgesses in Lewes at 43d. Value of the whole manor
      before 1066 £80 and 66d; later £25; now, William's lordship £60; his men's £12 10s.
