    name: Pevensey (Sussex 10,1)
    holding: borough
    textEdition: '[Pevensey Rape] [* Pevensey Hundred *] In the Borough of PEVENSEY Before 1066 there were 24 burgesses in the King''s lordship. They paid 14s 6d in tribute; 20s from toll; 35s from port
      dues; 7s 3d from pasture. The Bishop of Chichester had 5 burgesses; Edmer the priest 15; Ordmer the priest 5; Doda the priest 3. When the Count of Mortain acquired it, only 27 burgesses. Now he has
      60 burgesses himself in lordship, who pay 39s in tribute; toll £4; the mint 20s. The monks of Mortain, 8 burgesses at 66d; Gilbert the sheriff 1 burgess at 20d; William of Keynes 2 burgesses at 2s;
      Boselin [* of Dives *] 5 at 2s; William [* son of Boselin *] 4 at 2s; Ansfrid 4 at 2s; Gerald 2 at 6s; Ansgot 3 at 12d; Bernard 2 at 7d; Ralph 2 at 12d; Alan <of Whilton> 6 at 4s; ^[another]^ Ralph
      3 at 53d; Ascelin 3 at 4s; he holds 1 house himself at 32d and a bit of land at 3s; Walter [* of Ricarville *] 2 burgesses at 16d; Roger [* the cleric *] 2 at 12d; Hugh 1 at 8d. The Count has 1 mill
      at 20s. Alfred [* the butler *] has 15s 4d from grazing. [= ?10? Land of the Count of Mortain =]'
    text: '[Pevensey Rape] [Pevensey Hundred] In the Borough of PEVENSEY Before 1066 there were 24 burgesses in the King''s lordship. They paid 14s 6d in tribute; 20s from toll; 35s from port dues; 7s 3d
