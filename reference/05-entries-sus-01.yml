    textEdition: In BALDSLOW Hundred King Edward held FILSHAM in lordship. There are 15 hides there, which do not and did not pay tax. Land for 30 ploughs. The Count holds 8 hides and 1 virgate of this
      land himself. He has 2 ploughs. <18c> 48 villagers with 7 cottagers have 34 ploughs. Geoffrey holds 2 hides of this manor's land; Robert 1 hide and 1 virgate; William 1/2 hide; Hugh the bowman 5 virgates;
      Ingelrann [* of Eu *] 2 virgates; Robert the cook 1/2 hide; Walter [* son of Lambert *] 5 virgates; Sasward 1 virgate; Wenenc the priest 1 virgate; Osward [* of Norton *] 2 virgates; Roger Daniel
      1/2 hide. In lordship 6 1/2 ploughs; 13 villagers, 17 cottagers and 3 slaves with 7 1/2 ploughs. In the manor, meadow, 30 acres; woodland, 8 pigs. Value of the whole manor before 1066 £14; later,
      it was wasted; now £22; £14 of this is accounted in the Count's part. Wulfward the priest holds the church of this manor with 1 virgate, but it does not belong to the 15 hides. Wulfmer held it from
      King Edward; it did not pay tax then nor does it now. Value 5s. [= ?9? Land of the Count of Eu =]
