      at 26s; meadow, 140 acres; woodland, 23 pigs. There is a church in the manor. In Lewes 44 sites at 22s; 4000 herrings. Norman [the hunter] holds 2 hides of this land from William. 1 plough in lordship
      with 2 smallholders and 1 slave. The holder _ of this land could not withdraw with it. Value of the whole manor before 1066 £60; later £20; now £37.
