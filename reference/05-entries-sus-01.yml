    holding: manor
    textEdition: William holds WASHINGTON himself. Earl Gyrth held it before 1066. Then it answered for 59 hides; now it does not give tax. Bramber Castle is situated in one of these hides. Land for 34
      ploughs. In lordship 5 ploughs; 120 villagers and 25 smallholders with 34 ploughs. 5 salt-houses at 110 ambers of salt or 9s 2d; meadow, 4 acres. From woodland pasturage 60 pigs; 6 slaves. Gilbert
      holds 1/2 hide of this land, Ralph 1 hide, William 3 virgates, Leofwin 1/2 hide; he could withdraw with his land. He gave tax to his lord and his lord gave nothing. These have 4 villagers and 2 smallholders
      with 2 1/2 ploughs. Meadow, 7 acres; woodland at 10 pigs. <28b> Value of the whole manor before 1066 £50; later £50; now William's lordship £50 5s, his men-at-arms' 50s and 12d. However this manor
      was at a revenue at £100. [= ?13? Land of William of Braose =]
