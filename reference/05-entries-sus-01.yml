    textEdition: '[* Chichester Rape *] [In BOSHAM Hundred] Bishop Osbern holds the church of BOSHAM from the King; he held it from King Edward. 112 hides belonged to this church. Now 47 are outside it;
      Hugh son of Ranulf holds 30 hides; Ralph of Quesnay, 17 hides. When ^[Bishop]^ Osbern acquired it, the church answered for 65 hides, now the same. Land [for *** ploughs]. In lordship 2 ploughs. 21
      villagers with 18 smallholders have 8 ploughs. 3 mills at 14s; meadow, 12 acres; a salt-house at 2s; 1 site at 8d [* in Chichester *]. Mauger holds 12 hides of the land of this church as one manor,
      called [West] Thorney. He pays tax for 8 hides. He has 32 villagers with 8 ploughs. Ralph has 1 hide of this church land; a cleric 1 hide, and 4 clerics 1 hide in common. <17c> They have 3 ploughs
      in lordship; 3 villagers and 10 smallholders who have 1 1/2 ploughs. A church and a priest; 2 slaves; 1 site at 8d. Total value before 1066 £300; later £50. Now, what the Bishop holds, £16 10s; however,
      he has 20s more in revenue. Value of what Mauger holds, £6; however, he has 50s more. Value of what the others hold, £4 15s. The clerics hold the church tithe, value 40s. Before 1066, 1 hide in Itchenor
      belonged to this manor; now Warin <of Eyton>, Earl Roger''s man, holds it. [= ?6? Land of Bishop Osbern [of Exeter] =]'
    text: '[Chichester Rape] [In BOSHAM Hundred] Bishop Osbern holds the church of BOSHAM from the King; he held it from King Edward. 112 hides belonged to this church. Now 47 are outside it; Hugh son of
      Ranulf holds 30 hides; Ralph of Quesnay, 17 hides. When [Bishop] Osbern acquired it, the church answered for 65 hides, now the same. Land [for *** ploughs]. In lordship 2 ploughs. 21 villagers with
      18 smallholders have 8 ploughs. 3 mills at 14s; meadow, 12 acres; a salt-house at 2s; 1 site at 8d [in Chichester]. Mauger holds 12 hides of the land of this church as one manor, called [West] Thorney.
      He pays tax for 8 hides. He has 32 villagers with 8 ploughs. Ralph has 1 hide of this church land; a cleric 1 hide, and 4 clerics 1 hide in common. They have 3 ploughs in lordship; 3 villagers and
      10 smallholders who have 1 1/2 ploughs. A church and a priest; 2 slaves; 1 site at 8d. Total value before 1066 £300; later £50. Now, what the Bishop holds, £16 10s; however, he has 20s more in revenue.
      Value of what Mauger holds, £6; however, he has 50s more. Value of what the others hold, £4 15s. The clerics hold the church tithe, value 40s. Before 1066, 1 hide in Itchenor belonged to this manor;
