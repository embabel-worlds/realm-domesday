    name: Ditchling (Sussex 12,6)
    holding: manor
    textEdition: In SWANBOROUGH Hundred [* In STREAT Hundred *] William holds DITCHLING himself, in lordship. King Edward held it. It never paid tax. Before 1066 it answered for 46 hides; when acquired
      only 42 hides; the others were in the Count of Mortain's Rape [* Pevensey *], and 6 woods which belonged to the head of the manor. Now it answers for 33 hides. Land for 60 ploughs. In lordship 8 ploughs.
      108 villagers and 40 smallholders have 81 ploughs. A church; 1 mill at 30d; meadow, 130 acres; woodland, 80 pigs; 11 messuages in Lewes at 12s. Gilbert holds 1 1/2 hides of this land; Hugh 2 hides;
      Alward 3 hides; Warin [* the sheriff *] 3 hides; Richard 1 hide. In lordship they have 7 1/2 ploughs, with 29 smallholders, 3 villagers and 10 slaves with 3 ploughs. 6 burgesses in Lewes at 43d. Value
      of the whole manor before 1066 £80 and 66d; later £25; now, William's lordship £60; his men's £12 10s. [= ?12? Land of William of Warenne =]
    text: In SWANBOROUGH Hundred [In STREAT Hundred] William holds DITCHLING himself, in lordship. King Edward held it. It never paid tax. Before 1066 it answered for 46 hides; when acquired only 42 hides;
