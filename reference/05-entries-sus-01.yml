    name: Rodmell (Sussex 12,4)
    holding: manor
    textEdition: In `HOLMESTROW' Hundred William holds RODMELL himself, in lordship. Earl Harold held it. Before 1066 it answered for 79 hides. William acquired 64 hides, because the others were in the
      Earl's Rape and the Rape of William of Braose ^[Bramber]^. These 64 hides now answer for 33 hides. Land for 36 ploughs. In lordship 6 ploughs; 107 villagers and 25 smallholders with 34 ploughs. 11
      salt-houses at 26s; meadow, 140 acres; woodland, 23 pigs. There is a church in the manor. <26b> In Lewes 44 sites at 22s; 4000 herrings. Norman [* the hunter *] holds 2 hides of this land from William.
      1 plough in lordship with 2 smallholders and 1 slave. The holder _ of this land could not withdraw with it. Value of the whole manor before 1066 £60; later £20; now £37. [= ?12? Land of William of
      Warenne =]
    text: In `HOLMESTROW' Hundred William holds RODMELL himself, in lordship. Earl Harold held it. Before 1066 it answered for 79 hides. William acquired 64 hides, because the others were in the Earl's
