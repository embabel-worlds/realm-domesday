    name: Singleton (Sussex 11,3)
    holding: manor
    textEdition: '[* In Chichester Rape *] In SINGLETON Hundred Earl Roger holds SINGLETON in lordship. Earl Godwin held it. Then it answered for 100 hides less 2 1/2; now for 47 hides. Land for 40 ploughs.
      In lordship 7 ploughs; 86 villagers and 52 smallholders with 33 ploughs. 17 slaves; 2 mills at 12s 7d; meadow, 60 acres; from the woodland 150 pigs. A church in whose [lands] lie 3 hides and 1 virgate
      of this land. The clerics ^[of Singleton]^ have 2 ploughs and 5 smallholders. Payne holds 1 hide of this manor''s land from the Earl; William 1 hide; Geoffrey 2 hides. In lordship 1 plough; 3 villagers,
      1 smallholder and 3 slaves with 1/2 plough. To this manor belong 9 sites in Chichester which pay 7s 4d. 1 mill at 40d; from grazing 15s. A monk of Saint-Evroult holds 1 hide of this manor''s land.
      Value 10s. Value of the whole manor before 1066 £89; later £57; now it is valued at £93 and 1 gold mark; however what belongs to the Earl pays £120 and 1 gold mark; what the clerics hold £8; however,
      they have £10; what the men-at-arms hold £14. [= ?11? Land of Earl Roger =]'
