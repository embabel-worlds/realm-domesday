    name: Steyning (Sussex 5,2)
    holding: manor
    textEdition: '[* Bramber Rape *] In STEYNING Hundred The Abbot holds STEYNING himself. [* Earl *] Harold held it at the end of King Edward[''s life]. Then it answered for 81 hides; in addition a further
      18 hides and 7 acres outside the Rape which have never paid tax; now 67 hides. 33 1/2 hides are in the Rape of Arundel; the others are in the Rape of William of Braose ^[Bramber]^, but the Abbot holds
      them all now. Land in the whole manor for 41 ploughs. In lordship 7 ploughs. 178 villagers with 63 smallholders have 48 ploughs. 2 churches; 9 slaves; 4 mills at 47s; in addition 68 pigs. Meadow,
      113 acres; woodland, 45 pigs from pasturage. In the Borough ^[Steyning]^ there were 118 messuages; they paid £4 2s. Now there are 123 messuages; they pay 100s and 100d. [Their holders] have 1 1/2
