    name: Barrington (Cambridgeshire 21,5)
    holding: land
    textEdition: In `WETHERLEY' Hundred In BARRINGTON Robert holds 7 hides and 2 1/2 virgates. Land for 11 ploughs. In lordship 3 1/2 hides and 2 parts of 1 virgate; 1 plough there; a second possible. 20
      villagers with 7 smallholders and 3 cottagers have 9 ploughs. 2 slaves; 1 1/2 mills at 32s; meadow for 6 ploughs. Total value £12; when acquired £8; before 1066 £16. There were 15 Freemen in this
      land who held 4 hides and 1 1/2 virgates from King Edward and who found 12 1/2 cartages and 4 escorts for the sheriff; 4 others, Earl Algar's men, held 2 hides and 1/2 virgate; 3 others, Esger the
      constable's men, held 1 hide. All these men could grant and sell their land. Of this land also Edric Snipe, [!4! King Edward's thane !4!], held 3 virgates under King Edward <197a> and could sell.
      Edric ^[Snipe]^ also held 1/2 virgate which in 1066 lay in [the lands of] the Church of Chatteris. Robert Gernon annexed this [land] in the Abbess's despite, as the men of the Hundred testify. [=
      ?[21]? Land of Robert Gernon =]
