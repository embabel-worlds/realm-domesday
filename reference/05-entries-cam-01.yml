    textEdition: In `STAPLOE' Hundred SOHAM is a manor of the King's. It answers for 9 1/2 hides. Land for 14 ploughs. 16 villagers and 16 smallholders with 12 ploughs. In lordship 2 ploughs; 4 slaves;
      2 mills at 24s; from fisheries 3500 eels; meadow for 14 ploughs; pasture for the village livestock. 7 fishermen there, who pay to the King a presentation of fish three times a year, according to what
      they can. In total value, it pays £25 a year assayed and weighed, and £13 8s 4d at face value in white pence for corn, malt, honey and other small customary dues. Before 1066 it paid £25 at face value,
      and three days' revenue in corn, honey, <189c> malt and everything else. King Edward always had this manor in lordship. [= ?[1]? Land of the King. King William holds it. King Edward held it =]
