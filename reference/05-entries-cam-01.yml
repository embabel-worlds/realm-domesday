    holding: land
    textEdition: In CHESTERTON Hundred In [Dry] DRAYTON Payne [* the steward *] holds 5 hides and 3 virgates from Hardwin. Land for 5 ploughs. In lordship 2 ploughs; 9 villagers with 3 smallholders have
      2 ploughs; a third possible. 7 cottagers; meadow for 2 ploughs. Value of this land £4; when acquired 100s; before 1066 £6. 19 Freemen held this land. 6 of them, King Edward's men, had 2 hides less
      1/2 virgate; they found 6 escorts for the sheriff and could grant their land. 4 others, Edeva [* the fair *]'s men, had 1 1/2 hides; they could withdraw without the jurisdiction. 5 others were the
      <199b> Abbot of Ely's men; 4 of them held 1 hide [***] and could sell without the jurisdiction; the fifth had 1/2 virgate under the Abbot, but could not sell. The other 4 were St Guthlac's men; they
      held 1 hide and 1 virgate from the Church's household revenue. [= ?24 [[26]]? Land of Hardwin of Scales =]
