    textEdition: In [East] HATLEY Picot holds 2 hides. Land for 3 ploughs; 1 1/2 ploughs there; as many [more] possible. Meadow for 2 ploughs; 2 smallholders; woodland for repairing fences. The value is
      and was 40s; before 1066, 60s. 8 Freemen held this land; they could grant and sell. 2 of them were King Edward's men, and found 2 escorts. 3 were Archbishop Stigand's men; their jurisdiction lay in
      [Guilden] Morden. 1 was Earl Gyrth's man. 1 was Robert son of Wiuhomarch's man. 1 was Wulfmer of Eaton [Socon]'s man. Picot states he had 1 hide of this land in exchange for Eynesbury; and [he had]
      the other in exchange for Rushden, because Ilbert of Hertford delivered [it] to him. [= ?30 [[32]]? Land of Picot of Cambridge =]
