    name: Snailwell (Cambridgeshire 28,2)
    holding: manor
    textEdition: Hugh holds SNAILWELL himself from the Bishop of Bayeux's Holding. It has always answered for 5 hides. Land for 10 ploughs. In lordship 2; a third possible. 6 Freemen; 8 villagers; 3 smallholders;
      3 slaves. <199c> 4 mills at 14s 4d; meadow for 2 ploughs; woodland for fencing, with two carts from the King's woodland at Cheveley. Total value £14; when acquired £12; before 1066 £15. Archbishop
      Stigand held this manor in 1066. 6 Freemen were there, the same Archbishop's men, who could withdraw without his permission and grant or sell their land; but the jurisdiction remained with the Archbishop.
