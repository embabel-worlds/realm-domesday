    holding: manor
    textEdition: ?M? Picot holds BOURN himself. It answers for 13 hides. Land for 15 ploughs. In lordship 5 hides; 2 ploughs there; 2 others possible. 8 villagers with 4 smallholders and 7 Freemen who hold
      4 hides have 4 ploughs; a further 7 possible. 13 cottagers; 6 slaves. Meadow for 15 ploughs; pasture for the village livestock; wood for repairing fences and houses. Total value £13; when acquired
      £18; before 1066 £22. 2 men-at-arms hold 2 hides of this land under Picot. Land for 2 ploughs; they are there, with 4 cottagers. Meadow for 2 ploughs; wood for fences and houses; pasture for the village
      livestock. The value always was and is 40s. Before 1066 a thane held 3 hides of the land of this manor under King Edward. 2 priests, this thane's men, had 1 hide; <201a> they could not separate [it]
      outside of the Church. 3 Freemen of Archbishop Stigand's had 4 hides. A man of Esger the constable's had 1 hide. 2 men of the Abbot of Ramsey's had 1 1/2 hides. A man of Earl Algar's had 1/2 hide.
      13 men of King Edward's had 2 hides, and themselves found 6 cartages and 7 escorts for the sheriff. Accordingly, all 22 could grant and sell their lands. Picot states he acquired this land as two
      manors. [= ?30 [[32]]? Land of Picot of Cambridge =]
    text: Picot holds BOURN himself. It answers for 13 hides. Land for 15 ploughs. In lordship 5 hides; 2 ploughs there; 2 others possible. 8 villagers with 4 smallholders and 7 Freemen who hold 4 hides
      have 4 ploughs; a further 7 possible. 13 cottagers; 6 slaves. Meadow for 15 ploughs; pasture for the village livestock; wood for repairing fences and houses. Total value £13; when acquired £18; before
      1066 £22. 2 men-at-arms hold 2 hides of this land under Picot. Land for 2 ploughs; they are there, with 4 cottagers. Meadow for 2 ploughs; wood for fences and houses; pasture for the village livestock.
      The value always was and is 40s. Before 1066 a thane held 3 hides of the land of this manor under King Edward. 2 priests, this thane's men, had 1 hide; they could not separate [it] outside of the
      Church. 3 Freemen of Archbishop Stigand's had 4 hides. A man of Esger the constable's had 1 hide. 2 men of the Abbot of Ramsey's had 1 1/2 hides. A man of Earl Algar's had 1/2 hide. 13 men of King
      Edward's had 2 hides, and themselves found 6 cartages and 7 escorts for the sheriff. Accordingly, all 22 could grant and sell their lands. Picot states he acquired this land as two manors.
