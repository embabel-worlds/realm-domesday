    name: Caxton (Cambridgeshire 26,42)
    holding: manor
    textEdition: ?M? Hardwin holds CAXTON himself. Before 1066 it answered for 10 hides; now for 6 hides. Land for 12 ploughs. In lordship 5 hides; 4 ploughs there. 17 villagers with 8 smallholders and
      10 cottagers who have 8 ploughs. Meadow for 12 ploughs; wood for fences and houses. In total, value £11; when acquired £6; before 1066 £14. Thorger <of Caxton>, King Edward's thane, held this manor.
      22 Freemen were there. 4 of them were King Edward's men; they held 1 hide and 1/2 virgate; this 1/2 virgate found 3 escorts; these men could <199a> grant and sell their lands. The other 18 were Earl
      Algar's men; they had 6 hides less 1/2 virgate of this land. [= ?24 [[26]]? Land of Hardwin of Scales =]
    text: Hardwin holds CAXTON himself. Before 1066 it answered for 10 hides; now for 6 hides. Land for 12 ploughs. In lordship 5 hides; 4 ploughs there. 17 villagers with 8 smallholders and 10 cottagers
      who have 8 ploughs. Meadow for 12 ploughs; wood for fences and houses. In total, value £11; when acquired £6; before 1066 £14. Thorger , King Edward's thane, held this manor. 22 Freemen were there.
      4 of them were King Edward's men; they held 1 hide and 1/2 virgate; this 1/2 virgate found 3 escorts; these men could grant and sell their lands. The other 18 were Earl Algar's men; they had 6 hides
      less 1/2 virgate of this land.
