    textEdition: In OVER Ralph holds 2 hides and 1 virgate from Hardwin. Land for 2 1/2 ploughs; they are there, with 3 villagers; 1 smallholder; 3 cottagers. Meadow for 2 1/2 ploughs; pasture for the livestock.
      The value is and was 30s; before 1066, 50s. They [!4! 10 Freemen !4!] held this land. 1 Freeman, [!5! Stanhard !5!] [* son of Alwy *], held 1/2 hide of this land under the Abbot of Ely; he could not
      grant or sell outside the Church without the Abbot's permission. 2 other Freemen had 3 virgates; they could sell; the jurisdiction remained with the Abbot of Ely. The other 7 had 1 hide; they were
      the Abbot of Ramsey's men; they could sell without the jurisdiction. [= ?24 [[26]]? Land of Hardwin of Scales =]
