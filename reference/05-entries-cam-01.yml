    textEdition: In MILTON Ralph holds 12 hides from Picot. Land for 7 ploughs. In lordship 2; 2 others possible. 10 villagers with 12 smallholders and 9 cottagers have 3 ploughs. 5 slaves; meadow for 4
      ploughs; pasture for the livestock; from the marsh 650 eels and 12d. Total value £7; when acquired £8; before 1066 £12. Aelbert, the Abbot's steward, held 6 hides and 3 virgates of this manor on condition
      that he could not sell nor separate [it] from the Church, but after his death it should be restored to the Church of Ely. 4 Freemen held 4 hides and 2 1/2 virgates under the Abbot ^[of Ely]^, and
      could sell without the jurisdiction. A man of King Edward's had 2 1/2 virgates and could sell whither he would. [= ?30 [[32]]? Land of Picot of Cambridge =]
