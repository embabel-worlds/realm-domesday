    textEdition: In TEVERSHAM John holds 3 1/2 hides. Land for 4 1/2 ploughs. In lordship 2 hides; 2 ploughs there. 5 villagers with 17 smallholders have 2 1/2 ploughs. 1 slave; meadow for 2 ploughs. The
      value is and was £3; before 1066 £4. 2 Freemen, [!4! Edsi and Suneman !4!], held 1 1/2 hides and 20 acres of this land from Earl Algar; they could not withdraw from him. Abbot Simeon of Ely's predecessor
