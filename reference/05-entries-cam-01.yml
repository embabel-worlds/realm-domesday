    textEdition: ?M? William holds WESTON [Colville] himself. It answers for 7 hides. Land for 15 ploughs. In lordship 4 hides; 2 ploughs there; a third possible. 19 villagers with 7 smallholders have 12
      ploughs. 5 slaves; meadow, 4 acres; woodland, 300 pigs. In total, value £16 and 1 ounce of gold; when acquired £10; <196c> before 1066 as much. Toki <of Walton>, [!4! William's predecessor !4!], held
      this land from the Abbot of Ely in 1066, on condition that he could not separate it from the Church, it being in the Abbey's household revenue, as the men of the Hundred testify. There were 2 Freemen
      on this land; one found cartage and the other escort. They were Godwin the noble's men; they could not withdraw from him. [= ?28 [[18]]? Land of William of Warenne =]
