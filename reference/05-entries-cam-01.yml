    textEdition: In LONGSTOWE Hundred In KINGSTON Ralph [!4! Banks !4!] holds 5 1/2 hides and 16 acres from Picot. Land for 7 1/2 ploughs. In lordship 2 ploughs; 9 villagers with 2 smallholders and 5 cottagers
      have 5 1/2 ploughs. Meadow for 3 ploughs; wood for fences. 4 slaves. In total, value £6; when acquired £8; before 1066 £12. 14 Freemen held this land. 10 of them had 2 hides and 1 1/2 virgates of
      the King's jurisdiction; they found 7 cartages and 3 escorts. 2 others, Earl Algar's men, had 1 virgate. 1, Archbishop Stigand's man, held 3 virgates. One of them, the Abbot of Ely's man, had 1 virgate
      of the Abbot's jurisdiction. 2 others, Earl Algar's men, had 2 hides. They could all withdraw. [= ?30 [[32]]? Land of Picot of Cambridge =]
