    figuresSource: Hull coding
    places: '[Great and Little] Shelford'
    name: '[Great and Little] Shelford (Cambridgeshire 26,18)'
    holding: land
    textEdition: In SHELFORD Hardwin holds 6 hides, 1 virgate and 7 acres. Land for 6 ploughs and 2 oxen; 8 ploughs there. In lordship 1 hide; 1 plough there; 13 villagers with 4 smallholders have 7 ploughs.
      Meadow for 4 ploughs; pasture for the livestock. The value is and was £6; before 1066 £8. 2 1/2 hides and 9 acres of this land and a monastery were in the lordship of the Church of Ely before and
      in 1066, and are now of the household revenue, as the Hundred testifies. 7 Freemen held a further 1 1/2 hides and 6 acres of this land, of the Abbot of Ely's jurisdiction; they could not withdraw
      with the land, but the jurisdiction remained with the Church of Ely. 3 Freemen held 1/2 hide of the same land under Earl Gyrth; they could not withdraw without his permission. Their jurisdiction lay
      in Whittlesford. Alsi held 1/2 hide from Earl Algar; he could grant or sell, but the jurisdiction remained with the Earl; he found 1 escort. 2 Freemen held 1 virgate and 7 acres from Earl Harold;
      they could not withdraw without permission. 5 Freemen held 3 1/2 virgates under King Edward; they found 1 cartage and 2 escorts for the sheriff; they could sell their land, but their jurisdiction
      remained with the King. [= ?24 [[26]]? Land of Hardwin of Scales =]
    text: In SHELFORD Hardwin holds 6 hides, 1 virgate and 7 acres. Land for 6 ploughs and 2 oxen; 8 ploughs there. In lordship 1 hide; 1 plough there; 13 villagers with 4 smallholders have 7 ploughs. Meadow
