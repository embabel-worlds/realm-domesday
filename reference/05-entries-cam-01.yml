    holding: manor
    textEdition: In `STAPLOE' Hundred ?M? CHIPPENHAM answered for 10 hides before 1066. But a sheriff put them at 5 hides, through King Edward's concession, because its revenue oppressed him; it now answers
      for 5 hides. Land for 17 ploughs. Geoffrey holds from the King. In lordship 3 hides; 3 ploughs there. 19 villagers with 13 smallholders have 14 ploughs. 6 slaves; meadow for 3 ploughs; pasture for
      the village livestock; from the fishpond 1500 eels. Total value £20; when acquired £16; before 1066 £12. Ordgar, King Edward's sheriff, who was later Esger the constable's man, held this manor. 5
      hides of this land were in King Edward's revenue; 2 Freemen had 2 hides from the King and could grant their land to whom they would; however, each found 8d and or 1 horse in the King's service, and
      for their fines they did justice in Fordham. Ordgar the sheriff had 3 hides of this land himself and could grant to whom he would. Ordgar placed this land in pledge for 7 marks and 2 ounces of gold,
      as Geoffrey's men state; but the men of the Hundred have seen thereon neither any writ nor commissioner of King Edward, nor do they offer witness. [= ?20 [[22]]? Land of Geoffrey de Mandeville =]
