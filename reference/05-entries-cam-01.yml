    textEdition: ?M? FORDHAM is a lordship village of the King's. It answers for 5 1/2 hides. Land for 10 ploughs. In lordship 2 ploughs; a further 4 possible. 6 villagers and 15 smallholders with 15 acres,
      with 4 ploughs. 1 slave; 2 mills, 16s, feed 2 pigs a year; meadow for 6 ploughs; pasture for the village livestock. It pays £10 assayed and weighed, and £13 8s 4d in white silver for honey, corn and
      malt; before 1066 it paid £10 at face value and three days' revenue in honey, corn and malt. King Edward always had this manor in lordship. In this village a Freeman, Brunmann, holds 1 hide of the
      King's jurisdiction; before 1066 he could grant his land to whom he would, but, however, he always found cartage or 8d in the King's service and made good his fine to the sheriff. [= ?[1]? Land of
      the King. King William holds it. King Edward held it =]
