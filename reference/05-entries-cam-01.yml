      at 24s; from fisheries 3500 eels; meadow for 14 ploughs; pasture for the village livestock. 7 fishermen there, who pay to the King a presentation of fish three times a year, according to what they
      can. In total value, it pays £25 a year assayed and weighed, and £13 8s 4d at face value in white pence for corn, malt, honey and other small customary dues. Before 1066 it paid £25 at face value,
      and three days' revenue in corn, honey, malt and everything else. King Edward always had this manor in lordship.
