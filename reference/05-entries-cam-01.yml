    textEdition: '[* In CAMBRIDGE Hundred *] The Borough of CAMBRIDGE answered for a Hundred before 1066. In this borough there were and are ten wards. In the first ward, 54 messuages; 2 of them are unoccupied.
      In this first ward, Count Alan has 5 burgesses who pay nothing. The Count of Mortain has 3 messuages of the land of Judicael [* the hunter *]. 3 burgesses who paid 5s 8 1/2d before 1066 now pay nothing.
      Ralph Banks has 3 burgesses who pay nothing. Roger [* of Childerley *], Bishop Remigius''s man, [has] 3 burgesses; they pay nothing. Erchenger has 1 burgess; he pays nothing. This single ward was
      accounted as two before 1066 but 27 houses have been destroyed for the castle.'
