    textEdition: '[* In BAMPTON Hundred *] The King holds BAMPTON. 27 1/2 hides. In lordship 6 ploughs; 6 slaves. 40 villagers, 17 boors and 13 smallholders have 16 ploughs; before 1066 they had 26 ploughs.
      4 mills at 25s; from fisheries 20s; from the meadows 65s; from the market 50s; from pig-pasturage, from the salt-houses of Droitwich, and from the men''s other customary dues £9 13s; from the year''s
      corn £15. The Jurisdiction of two Hundreds belongs to this manor. In total, it pays £80 and 40s a year at face value. Ilbert of Lacy holds 1/2 hide by gift of the Bishop of Bayeux. Walter son of Poyntz
      holds a parcel of land. Henry of Ferrers holds a woodland which Bondi the forester held. The County testifies that all this belongs to the King''s lordship. <154d> Before 1066 Joseph had 60 acres
      of land in STOCKLEY of the King''s lordship; but later Earl Harold received it, in his own lordship, and it was in the King''s lordship when the King crossed the sea. [= ?[1]? Land of the King. King
      William holds it. King Edward held it =]'
