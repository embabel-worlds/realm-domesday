    places: Oxford
    name: Oxford (Oxfordshire 1,13)
    holding: borough
    textEdition: If anyone breaks the King's peace, given by his hand or seal, so that he kills a man to whom that peace was given, his limbs and life shall be in the King's decision, if he be taken. If
      he cannot be taken, he shall be treated as an outlaw by all, and if anyone manages to kill him, he shall be permitted to have the forfeited goods. If a stranger chooses to live in Oxford, and has
      a house but no relatives, and ends his life there, the King shall have whatever he leaves. If anyone violently breaks and enters anyone's court or house, so that he kills or wounds or assaults a man,
      he shall pay 100s fine to the King. Likewise, if anyone is summoned to go on a [military] expedition, and does not go, he shall give the King 100s. If anyone kills any man within his own court or
      house, his body and all his substance shall be in the King's power, except for his wife's dowry, if he had her with a dowry. [= ?[1]? Land of the King. King William holds it. King Edward held it =]
      <155a> ?2? Land of the Archbishop of Canterbury
