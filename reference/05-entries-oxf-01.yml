    textEdition: The Count of Mortain has 10 messuages; they pay 3s; all but 1 are unoccupied. Earl Hugh has 7 messuages; they pay 5s 8d; 4 of them are unoccupied. The Count of Evreux has 1 unoccupied messuage;
      it pays nothing. Henry of Ferrers has 2 messuages which pay 5s. William Peverel, 4 messuages which pay 17d; 2 of them are unoccupied. Edward the sheriff, 2 messuages which pay 5s. Arnulf of Hesdin,
      3 messuages which pay 18d; 1 of them is unoccupied. Berengar of Tosny, 1 messuage which pays 6d. Miles Crispin, 2 messuages which pay 12d. Richard of Courcy, 2 messuages which pays 19d. Robert d'Oilly,
      12 messuages which pay 64d; 4 of them are unoccupied. Roger of Ivry, 15 messuages which pay 20s 4d; 6 of them are unoccupied. Ranulf Flambard, 1 messuage which pays nothing. Guy of Raimbeaucourt,
      2 messuages which pay 20d. Walter Giffard, 17 messuages which pay 22s; 7 of them are unoccupied. Walter's predecessor had one of them by gift of King Edward, from the 8 virgates which were liable
      to customary dues before 1066. Gernio has 1 messuage which pays 6d [and belongs] to Hampton. Manasseh [* the cook *]'s son has 1 messuage which pays 4d and belongs to Bletchingdon. All the above hold
      the aforesaid messuages free, because of repairing the wall. All these, which are called Wall-messuages, before 1066 were free from all customary dues except [military] expeditions and wall repair.
      ^[Oxford]^ <154b>
