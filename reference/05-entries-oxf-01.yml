    places: Oxford
    name: Oxford (Oxfordshire B10)
    holding: borough
    textEdition: The priests of St Michael's have 2 messuages which pay 52d. The Canons of St Frideswide's have 15 messuages which pay 11s; 8 of them are unoccupied. Coleman, while he was alive, had 3 messuages
      at 3s 8d. William has 1 at 20d. Spracheling, 1 messuage which pays nothing. Wulfwy the fisherman, 1 messuage at 32d. Alwin has 5 messuages at 37d; 3 of them are unoccupied. Edric, 1 messuage which
      pays nothing. Harding [* of Oxford *] and Leofeva, 9 messuages which pay 12s; 4 of them are unoccupied. Aelric, 1 messuage which pays nothing. Deormann [* of London *], 1 messuage at 12d. Segrim,
      1 messuage at 16d; another Segrim, 1 messuage at 2s. Smewin, 1 messuage which pays nothing. Goldwin, 1 messuage which pays nothing. Edith, 1 messuage which pays nothing. Swetmann, 1 messuage at 8d.
      Saewy, 1 messuage which pays nothing. Leofeva, 1 unoccupied messuage, at 10d before 1066. Aelfeva, 1 messuage at 10d. Alward, 1 messuage at 10d. Alwin, 1 unoccupied messuage. Brictred and Deormann
      [* of London *], 1 messuage at 16d. Alwin, 1 messuage from which he has nothing. Deorwynn, 1 messuage at 6d. Alwin the priest, 1 unoccupied house which pays nothing. Leofric, 1 which likewise pays
      nothing. Wulfric, 1 unoccupied messuage; however, if there is need, he will repair the wall. Swetmann the moneyer, 1 free house which pays 40d. Godwin, 1; Wulfmer, 1; Godrun, 1; Godric, 1; Alwy, 1.
      These 5 [houses] pay nothing. Swetmann has 2 Wall-messuages which pay 3s. Another Swetmann, 1 messuage, free, for the same service, and he has 9d. Saewold <of Waterstock>, 9 messuages which pay 13s;
      6 of them are unoccupied. Lodowin, 1 house, in which he lives, free, for the wall. Segrim, 3 free houses at 64d; 1 of them is unoccupied. Alwin, 1 house, free, for repairing the wall. He has 32d a
      year from it. If the wall is not repaired when needed by him whose job it is either he shall pay the King 40s, or he loses his house. ^[Oxford]^
