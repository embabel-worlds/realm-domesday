    textEdition: The King has 20 Wall-messuages which were Earl Algar's before 1066, and which paid 14s less 2d then and now. He has 1 messuage which pays 6d and belongs to Shipton[-under-Wychwood]; another
      at 4d which belongs to Bloxham; a third which pays 30d and belongs to [Princes] Risborough; and 2 others at 4d which belong to Twyford in Buckinghamshire; one of them is unoccupied. The reason that
      they are called Wall-messuages is that if there is need and if the King commands, they repair the wall. ^[Oxford]^
