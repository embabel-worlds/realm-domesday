      there. There are 10 ploughs between the Frenchmen and the villagers; a further 7 possible. A man-at-arms has 2 hides; 2 villagers, 1 hide each; 2 villagers with 1 hide; 14 villagers with 1 virgate
      each; 6 villagers with 1/2 virgate each; 6 smallholders, 5 acres each; 7 cottagers; 6 slaves. 3 mills at 60s, and 500 eels; from the fishponds, 1000 eels; meadow for 20 ploughs; pasture for the village
      livestock; woodland, 500 pigs; 1 {arpent} of vines. Total value £20; when acquired £12; before 1066 £25. Earl Harold held this manor. In this manor there was a Freeman who held 2 of these 30 hides;
      he could not grant or sell them outside Harmondsworth before 1066. [= ?5? Land of La Trinité of the Mount, Rouen =]'
