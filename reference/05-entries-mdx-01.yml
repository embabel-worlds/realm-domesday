    textEdition: '`OSSULSTONE'' Hundred ?M? Robert [son of] Fafiton holds 4 hides from the King in STEPNEY. Land for 3 ploughs; they are there now. 1 villager with 14 acres; another with 12 acres; Roger
      the sheriff, 1 hide; [***] smallholders with 1/2 hide and 1/2 virgate. Woodland, 60 pigs, and 4s too. Total value 70s; when acquired the same; before 1066 £8. Sired, a Canon of St Paul''s, held this
      manor before 1066; he could sell to whom he would. The Bishop of London claims that he ought to have it. With these 4 hides there are now 53 acres of land, which were not there before 1066, which
      Hugh of Bernières appropriated from the Canons of St Paul''s and placed in this manor, as the Hundred testifies. [= ?15? Land of Robert [son of] Fafiton =]'
