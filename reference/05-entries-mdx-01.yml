    holding: manor
    textEdition: '`OSSULSTONE'' Hundred ?M? Geoffrey de Mandeville holds `EBURY''. It answers for 10 hides. Land for 8 ploughs. In lordship 5 hides; 2 ploughs there. The villagers have 5 ploughs; a sixth
      possible. 1 villager, 1/2 hide; 4 villagers with 1 virgate each; 14 others with 1/2 virgate each; 4 smallholders with 1 virgate; 1 cottager. Meadow for 8 ploughs; from hay 60s; from pasture 7s. Total
      value £8; when acquired £6; before 1066 £12. Harold son of Earl Ralph held this manor. Queen Edith had charge of him, with the manor, in 1066; afterwards, William the chamberlain held it from the
      Queen, as a Holding, for £3 a year in revenue; after the Queen''s death he held it in the same way from the King. William lost the manor 4 years ago; since then the King''s revenue, that is £12, has
      not been paid. [= ?9? Land of Geoffrey de Mandeville =]'
