    name: Clapham (Bedfordshire 19,1)
    holding: manor
    textEdition: In `STODDEN' Hundred ?M? Miles Crispin holds CLAPHAM. It answers for 5 hides. Land for 30 ploughs. Besides these 5 hides there are 10 carucates of land in lordship; 8 ploughs there; a further
      2 possible. 18 villagers have 20 ploughs; 15 smallholders and 4 slaves. Meadow for 6 ploughs; 1 mill, 40s; woodland, 200 pigs and 6d too. Total value £24; as much when acquired; before 1066 £12. Brictric
      <of Waddesdon>, a thane of King Edward's, held this manor from the Abbot of Ramsey. The Abbot and the monks claim this manor, since it is, and was before 1066, for their supplies; the whole Hundred
      bears witness to this. [= ?19? Land of Miles Crispin =]
