    textEdition: ?M? William of Warenne also holds TILBROOK. It answers for 5 hides. Land for 6 ploughs; they are there. 20 Freemen and 4 smallholders. Meadow for 5 ploughs. Value 100s; as much when acquired;
      before 1066 £4. The same Freemen who hold this manor held it. They were so far of the King's full jurisdiction that they could grant and sell their land to whom they might wish. They could withdraw
