      have 2 ploughs; another 2 possible. 2 smallholders and 3 slaves. Meadow for 6 ploughs. Value £3; when acquired £4; before 1066 £6. Godwin, a thane of King Edward's, held this manor. Of this land Ranulf
      brother of Ilger claims 12 acres of land against Gilbert son of Solomon and 4 acres of meadow against Hugh of Grandmesnil, of which Ranulf was wrongfully dispossessed; the men of the Half-Hundred
      state that before 1066 this land, which Hugh and Gilbert now hold, lay with the land which Ranulf brother of Ilger holds. [= ?29? Land of Ranulf brother of Ilger =] ?30? Land of Robert [son of] Fafiton
