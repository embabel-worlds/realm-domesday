    holding: land
    textEdition: In `STODDEN' Hundred William of Warenne holds 2 hides in DEAN and 3 Freemen from him. Land for 3 ploughs; they are there. 5 smallholders and 1 slave. The value is and always was 30s. The
      same Freemen who now hold this land held it; one of them could not grant or sell his land without his lord's permission; but the other two could do this. William Speke was put in possession of 1/2
      hide and 1/2 virgate of this land through the King and his deliverer, but William of Warenne dispossessed him without the King's writ and took away two horses from his men and has not yet given them
      back. This the men of the Hundred confirm. [= ?17? Land of William of Warenne =]
