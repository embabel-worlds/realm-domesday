      3 slaves. Meadow for 2 ploughs; woodland, 225 pigs. 1 Freeman holds 1 hide of this land. Value £4; when acquired 60s; before 1066 £8. 3 Freemen held this manor; they could grant and sell their land.
      In the same [village] [Houghton [Conquest]] the said Adeliza claims from Hugh of Beauchamp 1/2 virgate and 30 acres of wood and open land. The men of the Hundred bear witness that before 1066 this
