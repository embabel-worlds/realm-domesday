      there. 4 villagers have 3 ploughs. 4 smallholders and 4 slaves. 1 mill, 3s; meadow for 3 ploughs, woodland, 20 pigs. Value 50s; when acquired the same; before 1066 £8. Leofwin [* of Caddington *],
