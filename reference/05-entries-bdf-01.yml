    holding: manor
    textEdition: In `WILLEY' Hundred ?M? Alfred of Lincoln holds 3 hides in WYMINGTON, and Gleu <of Rothwell> from him. Land for 4 ploughs. In lordship 1 plough; another possible. 1 villager, 6 smallholders
      and 3 slaves with 2 ploughs. Meadow for 2 ploughs. Value 40s; when acquired 50s; before 1066, 60s. Godwin Frambold held this manor; he could sell. With these 3 hides Alfred claims 1/2 hide against
      Walter of Flanders, of which he wrongfully dispossessed him, as the men of the Hundred bear witness thereon, since his predecessor was possessed of it before 1066, and Alfred was possessed afterwards.
      Further, with this land Alfred also claims from the Bishop of Coutances woodland for 100 pigs, which his predecessor previously had before 1066, but the Bishop wrongfully dispossessed him, as the
      men of the Hundred testify. [= ?31? Land of Alfred of Lincoln =] ?32? Land of Walter of Flanders
