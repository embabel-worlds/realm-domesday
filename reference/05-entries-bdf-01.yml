    textEdition: In the Half-Hundred of `WENESLAWE' ?M? Eudo the steward holds SANDY. It answers for 16 hides and 1 virgate. Land for 16 ploughs. In lordship 8 hides and 1 virgate; 3 ploughs there. 24 villagers
