    textEdition: In the same village ^[BIDDENHAM]^ the burgess Godwin holds 1 hide and the fourth part of 1 virgate from the King. Land for 1 plough; it is there. Meadow for 1 plough. The value is and always
      was 10s. Before 1066 the present holder held 1/2 hide of this land which he could grant to whom he would. But he bought 1/2 hide and the fourth part of 1 virgate after King William came to England,
      but he did not do service for it to the King or to anyone else; and he did not have a deliverer for it. William Speke also claims from him 1 virgate and the fourth part of 1 virgate, which was delivered
      to him; but he lost it later.
