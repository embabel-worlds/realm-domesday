    name: Houghton [Conquest] (Bedfordshire 54,2)
    holding: manor
    textEdition: In HOUGHTON [Conquest] Arnold <of Sileby> holds 4 1/2 hides from Adeliza, as one manor. Land for 6 ploughs. In lordship 2 ploughs. 11 villagers and 7 smallholders with 3 1/2 ploughs; a
      further 1/2 possible. 3 slaves. Meadow for 2 ploughs; woodland, 225 pigs. 1 Freeman holds 1 hide of this land. Value £4; when acquired 60s; before 1066 £8. 3 Freemen held this manor; they could grant
      and sell their land. In the same [village] ^[Houghton [Conquest]]^ the said Adeliza claims from Hugh of Beauchamp 1/2 virgate and 30 acres of wood and open land. The men of the Hundred bear witness
      that before 1066 this land lay with the other land which Adeliza holds, and the holder of this land could grant or sell to whom he would. Ralph Tallboys appropriated this land wrongfully, when he
      was sheriff. [= ?54? Land of ^[Adeliza,]^ Hugh of Grandmesnil's wife =]
