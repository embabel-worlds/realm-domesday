    textEdition: In EASTON William of Cairon holds 1/2 hide and 1/2 virgate from the Bishop. Land for 1 plough; it is there. 1 smallholder and 3 slaves. Meadow for 1 plough; woodland, 100 pigs. Value 15s;
      when acquired 10s; as much before 1066. Alwin Devil, the Bishop of Lincoln's man, held this land; he could do what he would with it. However, the jurisdiction was always the Bishop's. In this land
      of the Bishopric, William of Cairon claims 60 acres of open land and woodland from Hugh of Beauchamp, of which Ralph Tallboys dispossessed this William's father, who held the land before 1066, as
      the men of the Hundred state. [= ?4? Land of the Bishop of Lincoln =]
