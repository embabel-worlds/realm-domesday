    textEdition: In CLIFTON Hundred ?M? Hugh holds STOTFOLD himself. It answers for 15 hides. Land for 15 ploughs. In lordship 5 hides; 3 ploughs there. 21 villagers have 12 ploughs. 14 smallholders and
      6 slaves. 4 mills at £4 and 400 eels; meadow for 7 ploughs. Total value £25; when acquired £12; before 1066 £20. On the day that Ralph Tallboys died it was at a revenue for £30. Eskil [* of Ware *],
      a thane of King Edward's, held this manor. He had 9 1/2 hides himself. 7 Freemen held the rest of the land; they could sell to whom they would. 1 hide of this land belongs to St Alban's Church; as
      the men of the Hundred state, it lay there before 1066. [= ?23? Land of Hugh of Beauchamp =]
