    textEdition: In the same village ^[BIDDENHAM]^ the burgess Ordwy [* of Bedford *] holds 1 hide and the third part of 1/2 hide from the King. Land for 1 plough; it is there. 2 villagers and 1 smallholder.
      Meadow for 1 plough. The value is and always was 10s. Before 1066 the present holder held 1/2 hide and the fourth part of 1 virgate of this land; he could grant to whom he would. But he held 1 virgate
      in pledge before 1066 and still holds it, as the men of this Hundred testify. He also bought 1 virgate and the fourth part of 1 virgate after King William came to England; he does not pay service
      to the King or to anyone.
