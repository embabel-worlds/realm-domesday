    textEdition: In TIDENHAM Hundred The Abbot of Bath had a manor named TIDENHAM. 30 hides were recorded; 10 of them were in lordship. There were 38 villagers who had 38 ploughs; 10 smallholders. In the
      Severn 11 fisheries in lordship and 42 villagers' fisheries. In the Wye 1 fishery and 2 1/2 villagers' fisheries. Earl Roger added 2 fisheries in the Wye. Woodland 2 leagues long and 1/2 league wide.
      There are 12 more smallholders. Of this land Earl William gave to his brother Bishop Osbern 1 virgate of land, with 1 villager. He gave to Walter of Lacy 2 fisheries in the Severn and half in the
      Wye, with 1 villager. He gave to Ralph of Limésy 2 fisheries in the Wye, with 1 villager. He gave to the Abbey of Lyre 1/2 hide of land and the manor's church with the tithes. This manor did not pay
      dues before 1066 except for the monks' supplies. Archbishop Stigand was holding it when Earl William received it. Now it pays £25, blanched, at 20 [pence] to the {ora}. There is a mill there now at
      40d. [= ?[1]? Land of the King. King William holds it =]
