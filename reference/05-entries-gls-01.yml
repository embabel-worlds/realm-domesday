    name: Tewkesbury (Gloucestershire 1,24)
    holding: manor
    textEdition: '[In TEWKESBURY Hundred] In TEWKESBURY before 1066 there were 95 hides. 45 of them are in lordship; they were exempt from all royal service, apart from the service of the lord himself whose
      manor it was. In the head of the manor there were in lordship 12 ploughs; 50 slaves, male and female. 16 smallholders lived around the hall. 2 mills at 20[s]; a fishery; a salt-house at Droitwich
      which belongs to the manor. At SOUTHWICK 3 hides; in TREDINGTON 6 hides; in FIDDINGTON 6 hides; in PAMINGTON 8 hides; in NATTON 3 1/2 hides; in WALTON [Cardiff] 3 hides; [***] in ASTON[-on-Carrant]
      6 hides. There were 21 villagers and 9 riding men who had 26 ploughs; 5 freedmen and 1 smallholder with 5 ploughs. These riding men ploughed and harrowed at the lord''s court. In Gloucester there
      were 8 burgesses who paid 5s 4d and served at the court. In the whole of Tewkesbury, meadow, 120 acres; woodland 1 1/2 leagues long and as wide. <163c> At Tewkesbury there are now 13 burgesses who
      pay 20s a year; a market which the Queen set up there which pays 11s 8d. 1 more plough; 22 slaves, male and female. A fishery; a salt-house at Droitwich. 3 riding men belonged there before 1066; one
      of them held 6 hides in ASTON[-on-Carrant]; Gerard [* the chamberlain *] now holds them; another held 3 hides in WALTON [Cardiff]; Ralph <of Cardiff> now holds them; the third held 2 hides in FIDDINGTON;
      Bernard [* Pancevolt *] now holds them. In these 11 hides are 10 ploughs in lordship; 4 villagers, 1 smallholder and 9 slaves with 1 plough. Meadow, 18 acres. The value of the whole before 1066 £10;
      now as much. ^[Brictric son of Algar held it before 1066]^ [= ?[1]? Land of the King. King William holds it =]'
    text: '[In TEWKESBURY Hundred] In TEWKESBURY before 1066 there were 95 hides. 45 of them are in lordship; they were exempt from all royal service, apart from the service of the lord himself whose manor
      it was. In the head of the manor there were in lordship 12 ploughs; 50 slaves, male and female. 16 smallholders lived around the hall. 2 mills at 20[s]; a fishery; a salt-house at Droitwich which
      belongs to the manor. At SOUTHWICK 3 hides; in TREDINGTON 6 hides; in FIDDINGTON 6 hides; in PAMINGTON 8 hides; in NATTON 3 1/2 hides; in WALTON [Cardiff] 3 hides; in ASTON[-on-Carrant] 6 hides. There
      were 21 villagers and 9 riding men who had 26 ploughs; 5 freedmen and 1 smallholder with 5 ploughs. These riding men ploughed and harrowed at the lord''s court. In Gloucester there were 8 burgesses
      who paid 5s 4d and served at the court. In the whole of Tewkesbury, meadow, 120 acres; woodland 1 1/2 leagues long and as wide. At Tewkesbury there are now 13 burgesses who pay 20s a year; a market
      which the Queen set up there which pays 11s 8d. 1 more plough; 22 slaves, male and female. A fishery; a salt-house at Droitwich. 3 riding men belonged there before 1066; one of them held 6 hides in
      ASTON[-on-Carrant]; Gerard [the chamberlain] now holds them; another held 3 hides in WALTON [Cardiff]; Ralph now holds them; the third held 2 hides in FIDDINGTON; Bernard [Pancevolt] now holds them.
      In these 11 hides are 10 ploughs in lordship; 4 villagers, 1 smallholder and 9 slaves with 1 plough. Meadow, 18 acres. The value of the whole before 1066 £10; now as much. [Brictric son of Algar held
      it before 1066]'
