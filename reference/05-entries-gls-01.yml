    textEdition: 'In BRENTRY Hundred St Mary''s of Worcester held and holds WESTBURY[-on-Trym]. There were and are 50 hides. In lordship 2 ploughs; 8 villagers and 6 smallholders with 8 ploughs. 4 male
      slaves, 1 female. These members belong to this manor: HENBURY, REDWICK, STOKE [Bishop], YATE. In them are 9 ploughs in lordship; 27 villagers and 22 smallholders with 26 ploughs. 20 male and 2 female
      slaves and 20 freedmen with 10 ploughs. A mill at 20d. To this manor belong 6 riding men who have 8 hides and 8 ploughs; they could not be separated from the manor. In Bristol 2 houses paid 16d. Of
      this manor''s land {Turstin} son of Rolf holds 5 hides in AUST, Gilbert son of Turold 3 1/2 hides in COMPTON [Greenfield]; Constantine 5 hides in ITCHINGTON. In these lands 5 ploughs in lordship;
      16 villagers and 12 smallholders with 12 ploughs. 11 slaves. Osbern Giffard holds 5 hides also of this manor''s land and does no service. Value of the whole manor with its members before 1066 £24;
      value now of St Mary''s lordship £29 14s 6d; of what the men hold £9. [= ?3? Land of the Church of Worcester =]'
