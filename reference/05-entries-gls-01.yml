    textEdition: In {WACRESCUMBE} Hundred The Church itself holds WITHINGTON. 30 hides. 3 of them have never paid tax. In lordship 2 ploughs; <165a> 16 villagers and 8 smallholders with 7 ploughs. 6 slaves;
      meadow, 10 acres; woodland 1 league long and 1/2 wide. In [Cassey] COMPTON 1 plough; 2 villagers and 2 smallholders with 1 plough. 2 slaves. A mill at 5s. Also in this manor 4 riding men who have
