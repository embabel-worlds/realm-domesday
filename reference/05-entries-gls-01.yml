    textEdition: Geoffrey de Mandeville holds 6 messuages; before 1066 these paid 6s 8d with another customary due. William [son of] Baderon 2 messuages at 30d. William the scribe holds 1 messuage at 51d.
      Roger of Lacy 1 messuage at 26d. Bishop Osbern 1 messuage at 41d. Berner <of Gloucester> 1 messuage at 14d. William the bald 1 messuage at 12d. Durand the sheriff 2 messuages at 14d. Durand also holds
      1 messuage at 26d, and 1 messuage more, which pays no customary due. Hadwin holds 1 messuage which gives rent but keeps back another customary due. Gosbert 1 messuage, Dunning 1 messuage, Widard <of
      Farlow> 1 messuage. Arnulf the priest 1 messuage, which pays rent; he keeps back another customary due. All these messuages paid the royal customary dues before 1066; now King William has nothing
      from them, nor Robert [* the bursar *] his officer. These messuages were in King Edward's revenue on the day he was alive and dead; but now they have been taken away from the King's revenue and customary
      dues. Before 1066 the King's lordship in the City supplied all lodging or clothing; when Earl William acquired it in the revenue it supplied the clothing likewise. Where the castle is sited there
      were 16 houses which do not exist now, and 14 houses in the Borough of the City have been destroyed. ^[Gloucester]^ ?[W]? [* Land of the King in Wales *]
