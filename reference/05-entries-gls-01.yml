    holding: manor
    textEdition: William also holds GUITING [Power]. King Edward held it and leased it to Alwin his sheriff so that he might have it for his lifetime; however he did not give it as a gift, as the County
      testifies. On Alwin's death King William gave his wife and land to Richard, a young man. Now William, Richard's successor, holds this land thus. 10 hides; 9 of them pay tax. In lordship 4 ploughs;
      4 villagers, 3 Frenchmen, 2 riding men and a priest with 2 smallholders; between them they have 5 ploughs. 11 slaves, male and female. 2 mills at 14s. 5 salt-houses pay 20 packloads of salt. In Winchcombe
      2 burgesses pay 11s 4d. The value was £16; now £6. [= ?34? Land of William Goizenboded =]
