    holding: outlier
    textEdition: 'These outliers belong to this manor: HARDWICKE, 5 hides; BOURTON[-on-the-Hill], 8 hides; TODENHAM, 7 hides; SUTTON[-under-Brailes], 5 hides; in total 25 hides. In lordship 13 ploughs;
      45 villagers and 27 smallholders with 21 ploughs. 37 slaves; 4 mills at 20s; meadow, 20 acres; woodland 1 league long and 1/2 wide; water-meadows 3 furlongs long and 1 wide. Riding men, that is, free
      men, held of this manor''s land before 1066, who all, however, ploughed, harrowed, scythed and reaped for the lord''s work. At ELMSTONE Brictric [held] 1 hide; Reinbald [* the priest *] holds it.
      At `ELLINGS'' Godric [held] 2 hides; at WIGHTFIELD Edwy 1 hide; at TODENHAM Edwy 1 hide; Walter Ponther holds them. At HAYDEN 2 hides; at BOURTON[-on-the-Hill] 2 hides; Wulfwy held them. At KEMERTON
      1/2 hide; Leofwin [* uncle of Thorkil *] held it. Gerard [* the chamberlain *] holds these lands. {{There also Abbot Baldwin [* of Bury St Edmunds *] holds 1/2 hide}}. At EVINGTON Alwy? [* the sheriff
      *] [held] 1 hide and 1 virgate; at ORIDGE [Street] Leofwin [* uncle of Thorkil *] 1/2 hide; at RYE Edric 2 1/2 virgates; William son of Baderon holds them. At RYE Edric [held] 2 1/2 virgates; at KEMERTON
      Alwin [* the sheriff *] 1/2 hide; Abbot Baldwin holds them. At HASFIELD Brictric <of Newton> [held] 1 1/2 hides; {Turstin} son of Rolf holds them. At `[Upper] LEMINGTON'' Auti [held] 3 hides; Gilbert
      son of Turold holds them. At MORETON[-in-Marsh] Alfrith <of Moreton> [held] 1/2 hide; he also holds it himself. In these lands in lordship 11 1/2 ploughs; 14 villagers and 27 smallholders with 7 ploughs.
      14 slaves; meadow, 20 acres. Besides these [lands] Gerard the chamberlain holds 8 hides in KEMERTON and 3 hides in BODDINGTON which have always paid tax and rendered other services in Deerhurst Hundred.
      But after Gerard had them, they rendered neither tax nor service. Before 1066 the whole manor gave in revenue £41 and 8 sesters of honey by the King''s measure; value now £40, of which £26 belongs
      to the lord''s manor and £14 to the men. ^[Outliers of Deerhurst]^ [= ?19? Land of St Peter''s of Westminster =] ?20? Land of Saint-Denis, Paris'
