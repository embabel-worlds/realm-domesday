    holding: manor
    textEdition: In MOULSOE Hundred ?M? In CLIFTON [Reynes] William of Bosc-le-hard and his brother ^[Roger of Bosc-le-hard]^ hold 4 hides from Robert as one manor. Land for 4 ploughs; in lordship 2. 6
      villagers with 7 smallholders have 2 ploughs; 3 slaves; meadow for 4 ploughs; woodland, 400 pigs. In total, the value is and was 100s; before 1066 £6. Oswulf [* son of Frani *], a thane of King Edward's,
      held this manor; he could sell. In this village, Clifton [Reynes], Sifrith and Thorbert <of Chellington> hold 3 virgates, which William and Roger have appropriated and concealed, against the King,
      as the men of the Hundred say. Of the 4 hides mentioned above, Alric [* son of Goding *], Oswulf [* son of Frani *]'s man, held 1 virgate; he could sell to whom he would. [= ?18? Land of Robert of
      Tosny =] ?19? Land of Robert d'Oilly
