    textEdition: '[In AYLESBURY Hundred] AYLESBURY, a household manor of the King, always answered for 16 hides. Land for 16 ploughs; in lordship 2. 20 villagers with 14 smallholders have 10 ploughs; a
      further 4 possible. 2 slaves; 2 mills at 23s; meadow for 8 ploughs; from the remainder, 20s. In total value it pays £56 assayed and weighed and from tolls £10 at face value; before 1066 it paid £25
      at face value. In this manor there was and is one Freeman who has 1 virgate of land which he could grant or sell to whom he would; however he always serves the King''s sheriff. The Bishop of Lincoln
      holds the church of this manor. [= ?[1]? Land of the King. King William holds it. King Edward held it =] <143c>'
