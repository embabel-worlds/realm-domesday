    holding: manor
    textEdition: In STOKE Hundred ?M? Robert d'Oilly holds IVER. It answers for 17 hides. Land for 30 ploughs; in lordship 2 hides; 4 ploughs there. 32 villagers have 26 ploughs; 5 of these villagers have
      6 hides. 6 smallholders and 4 slaves. 3 mills at 44s; meadow for 30 ploughs; from 4 fisheries 1500 eels, and fish every Friday for the village reeve's work; woodland, 800 pigs; 2 {arpents} of vines.
      Total value £22; when acquired 100s; before 1066 £12. Toki, a thane of King Edward's, held this manor; there were three Freemen there. One of these, Toki's man, held 3 virgates, but he could not sell
      without his permission; the second, Queen Edith's man, 2 1/2 hides; the third, Saewulf [* brother of Siward *]'s man, had 2 1/2 hides. These two could grant or sell to whom they would; they did not
      belong to this manor. Robert exchanged this manor with Clarenbald of Le Marais for Padbury. It is of his wife's Holding. [= ?19? Land of Robert d'Oilly =]
