    holding: manor
    textEdition: '[In BUNSTY Hundred] In TYRINGHAM Acard [* of Ivry *] holds 7 hides, 1 virgate, and the fourth part of 1 virgate from William as one manor. Land for 8 ploughs; in lordship 3. 9 villagers
      with 6 smallholders have 5 ploughs. 6 slaves; meadow for 8 ploughs; woodland, 200 pigs, and 26d from minor customary dues. In total, value £6; when acquired £8; before 1066 as much. <149a> Five thanes
      held this manor; one of them, Harold <of Tyringham>, had 3 hides as one manor; Godwin the priest, 1/2 hide; {Estan} <of Farningham>, 2 hides as one manor; Godric, Harold''s man, 1 virgate; and Aelfeva,
      Harold''s wife, 1 1/2 hides as one manor; all of them could sell to whom they would. [= ?17? Land of William son of Ansculf =]'
