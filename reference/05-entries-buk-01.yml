    textEdition: In IXHILL Hundred Robert son of Walter holds OAKLEY from Robert. It answers for 5 hides and 3 virgates. Land for 7 ploughs; in lordship 3. 9 villagers with 7 smallholders have 4 ploughs.
      3 slaves; woodland, 200 pigs, if it were not for the King's park in which it lies. The total value is and was £6; before 1066 £7. These 5 hides and 3 virgates are 8 hides. Aelfgyth [* mother of Godwin
      *], a girl, held 2 of these hides, which she could grant or sell to whom she would; and from King Edward's household revenue she had 1/2 hide herself, which Godric the sheriff assigned to her for
      as long as he should be sheriff, so that she might teach his daughter gold embroidery. Robert son of Walter now holds this land, as the Hundred testifies. [= ?19? Land of Robert d'Oilly =] <149c>
