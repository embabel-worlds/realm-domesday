    textEdition: In STOKE Hundred ?M? Bertram of Verdun holds FARNHAM [Royal]. It answers for 10 hides. Land for 8 ploughs; in lordship 5 hides; 2 ploughs there. 5 villagers with 3 smallholders have 4 ploughs;
      a further 2 possible. 2 slaves; meadow for 2 ploughs; woodland, 600 pigs. Total value 100s; when acquired £4; as much before 1066. Countess Goda held this manor. Geoffrey de Mandeville held 1/2 hide
      of this manor in Amersham, of which he dispossessed the said Bertram while he was overseas on the King's service. The Hundred confirms this. Ralph Tallboys built a mill on Bertram's land which was
      not there before 1066, as the Hundred testifies. [= ?38? Land of Bertram of Verdun =] ?39? Land of Nigel of Aubigny
