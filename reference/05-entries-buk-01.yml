    textEdition: In AYLESBURY Hundred ?M? Remigius, Bishop of Lincoln holds STOKE [Mandeville]. It answers for 8 hides. Land for 21 ploughs; in lordship 3 hides; 6 ploughs there. 20 villagers with 4 smallholders
      have 15 ploughs. 3 slaves; 1 mill at 10s; woodland, 30 pigs; meadow for 3 ploughs. This manor lies with the [lands of] Aylesbury Church. 18 smallholders who pay 20s a year. Total value £20; when acquired
      £12; before 1066 £18. Bishop Wulfwy held this manor with the church before 1066. From the eight hundreds which lie in the circuit of Aylesbury, each Freeman who has 1 hide or more pays one load of
      corn to this church. Furthermore from each Freeman 1 acre of corn or 4d was paid over to this church before 1066, but after the coming of King William it was not paid. [= ?[3a]? Land of the Bishop
      of Lincoln =] <144a>
