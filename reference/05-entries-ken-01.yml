      9 houses in the City of Rochester belong to this manor; they paid 6s; now they have been taken away. Earl Godwin held this manor. Richard of Tonbridge holds 1/2 sulung of this manor. Woodland, 20
      pigs. Value before 1066, later and now, 40s. Adam son of Hubert holds 1 sulung and 1 yoke of the same manor from the Bishop. One of his men has 1/2 plough in lordship, and 4 villagers with 1/2 plough
      and 1 cottager. The value is and was 30s. Ansketil of Rots holds 3 sulungs of this manor. He has 1 plough in lordship. 5 villagers with 12 cottagers have 1 1/2 ploughs. 5 slaves; a mill at 10s; meadow,
      12 acres; 2 fisheries at 5s. Value before 1066 and later £6; now £6 5s. [= ?5? Land of the Bishop of Bayeux =]
