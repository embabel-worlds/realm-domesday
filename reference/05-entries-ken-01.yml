    places: Wye
    name: Wye (Kent 6,1)
    holding: manor
    textEdition: '[* In WYE Lathe *] [* In WYE Hundred *] The Abbot of St Martin of the Battlefield holds a manor which is called WYE, which answered for 7 sulungs before 1066 and now. Land for 52 ploughs.
      In lordship 9 ploughs. 114 villagers with 22 smallholders have 17 ploughs. A church; 7 slaves. 4 mills at 23s 8d; meadow, 133 acres; woodland, 300 pigs from pasturage. Value before 1066 £80 and 100s
      and 6s 8d; when acquired £125 10s at 20 [pence] to the {ora}; now £100 at face value; if the Abbot had had full jurisdictions it would be valued at £20 more. Ralph of Courbépine holds 1 pig pasture
      and 1 yoke of Freemen''s land of this manor; he pays 6d as a customary due; Adelulf <of Wye> [holds] 2 parts of 1 sulung; he pays 12d. Hugh de Montfort has 2 yokes which pay 300 eels and 2s. Before
      1066 they paid full jurisdiction. Full jurisdiction and all the penalties from 22 Hundreds which rightly belong to the King belong to this manor. [= ?6? Land of Battle Church =] <12a> ?7? Land of
      St Augustine''s Church'
    text: '[In WYE Lathe] [In WYE Hundred] The Abbot of St Martin of the Battlefield holds a manor which is called WYE, which answered for 7 sulungs before 1066 and now. Land for 52 ploughs. In lordship
      9 ploughs. 114 villagers with 22 smallholders have 17 ploughs. A church; 7 slaves. 4 mills at 23s 8d; meadow, 133 acres; woodland, 300 pigs from pasturage. Value before 1066 £80 and 100s and 6s 8d;
