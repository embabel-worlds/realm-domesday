    textEdition: In `LIMEN' Lathe In FOLKESTONE Hundred William of Arques holds FOLKESTONE. Before 1066 it answered for 40 sulungs; now for 39. Land for 120 ploughs. In lordship 14 ploughs; 209 villagers
      and 83 smallholders; between them all they have 45 ploughs. 5 churches, from which the Archbishop ^[of Canterbury]^ has 55s. 3 slaves. 7 mills at £9 12s. Meadow, 100 acres; woodland, 40 pigs. Earl
      Godwin held this manor. Of this manor Hugh son of William holds 9 sulungs of the villagers' land. He has 4 1/2 ploughs there in lordship, and 8 villagers with 17 smallholders who have 16 ploughs.
