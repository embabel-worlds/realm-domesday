    places: Fordwich
    name: Fordwich (Kent 7,10)
    holding: borough
    textEdition: In FORDWICH Hundred The Abbot holds a small Borough which is called FORDWICH himself. King Edward gave two parts of this Borough to St Augustine's; but the Bishop of Bayeux, with King William's
      assent, also assigned to St Augustine's the third part, which had belonged to Earl Godwin. It answers for 1 yoke. There were 100 measures of land less 4 there which paid 13s. Now there are 73 messuages,
      which pay as much. Value before 1066 and later 100s; now £11 2s. There also are 24 acres of land which St Augustine's always had, where there were and are 6 burgesses who pay 22s. In this Borough
      Archbishop Lanfranc holds 7 measures of land which served St Augustine's before 1066; now the Archbishop takes [their] service from it. [= ?7? Land of St Augustine's Church =]
