      £22; later £10; the Abbot's part £26. Wadard <of Cogges> has 1 plough in lordship, and 8 villagers with 2 smallholders who have 4 ploughs. The value is and was £10. He pays no service from it except
      30s a year to the Abbot. [= ?7? Land of St Augustine's Church =]
