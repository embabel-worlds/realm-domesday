      paid £40 in revenue and 40000 herrings for the supplies of the monks. In the year in which this Survey was made Sandwich paid £50 in revenue and herrings as before. Before 1066 there were 307 habitable
      messuages; now there are 76 more; that is, 383 altogether. [= ?2? Land of the Archbishop of Canterbury =]'
