    name: Canterbury (Kent C6)
    holding: borough
    textEdition: The King has full jurisdiction throughout the whole City of Canterbury, apart from the land of Holy Trinity Church, of St Augustine's, of Queen Edith, of Alnoth the noble [* of Kent *],
      of Esbiorn Bicga and of Sired of Chilham. It was agreed about the straight roads which have entry and exit through the City, that whoever does wrong on them shall pay the fine to the King; likewise
      regarding the straight roads outside the City as far as 1 league, 3 perches and 3 feet. If anyone digs or fixes a post within these public roads within the City or outside it, the King's reeve follows
      him wherever he has gone, and receives the fine for the King's works.
