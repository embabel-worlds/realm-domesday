    textEdition: In the Half-Lathe of MILTON In MILTON Hundred King William holds MILTON [Regis]. It answers for 80 sulungs. As well as these, there are 4 sulungs in lordship. In lordship 3 ploughs. In
      this manor 309 villagers with 74 smallholders have 167 ploughs. 6 mills at 30s; meadow, 18 acres. 27 salt-houses at 27s. <2d> 32 fisheries at 22s 8d; from the tolls, 40s; from the pasture, 13s 4d;
      woodland, 220 pigs. Walter's men pay 50s for Escorts and cartage. In this manor, 10 slaves. Total value before 1066, £200 at face value; as much when Haimo the sheriff acquired it; now the same. Hugh
      of Port holds 8 sulungs and 1 yoke of this manor, which were with the other sulungs before 1066 in customary payment. He has 3 ploughs in lordship. Value of this land which Hugh of Port holds, £20,
      which are accounted in the £200 of the whole manor of Milton [Regis]. Its holder pays £140 fired and weighed, and in addition £15 6s less 2d at face value. The reeve gives Haimo the sheriff £12. Wadard
      <of Cogges> has as much of the King's woodland as pays 16d a year. He holds 1/2 a pig pasture which a villager held before 1066. Alnoth the noble [* of Kent *] took away 2 parts from a villager by
      force. The Abbot of St Augustine's holds the churches and tithes of this manor; 40s from 4 sulungs of the King go to him. [= ?1? Land of the King. King William holds it. King Edward held it =]
