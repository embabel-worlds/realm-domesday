    textEdition: '[* In THE BOROUGH Lathe *] In BARHAM Hundred Fulbert holds BARHAM from the Bishop. It answers for 6 sulungs. Land for 32 ploughs. In lordship 3 ploughs. 52 villagers with 20 cottagers
      have 18 ploughs. A church; a mill at 20s 4d. 25 fisheries at 35s less 4d; from cartage, that is, a service, 60s; from grazing, 26s; meadow, 20 acres; from pasturage, 150 pigs. The Bishop gave Herbert
      son of Ivo an outlier of this manor which is called Hougham. He has 1 plough in lordship, and 12 villagers with 9 ploughs. Meadow, 20 acres. From the same manor the Bishop also gave 1 sulung to Osbern
      Paisforiere. 2 mills at 50s. In lordship 1 plough, and 4 villagers with 1 plough. Value of the whole of Barham before 1066 £40; when the Bishop acquired it, the same; however, it paid him £100. Value
      of Barham by itself now £40; Hougham £10; what Osbern has £6; value of the land of Ranulf, a man-at-arms, 40s. Archbishop Stigand held this manor, but it was not the Archbishopric''s, but was of King
      Edward''s household revenue. [= ?5? Land of the Bishop of Bayeux =] <10a>'
    text: '[In THE BOROUGH Lathe] In BARHAM Hundred Fulbert holds BARHAM from the Bishop. It answers for 6 sulungs. Land for 32 ploughs. In lordship 3 ploughs. 52 villagers with 20 cottagers have 18 ploughs.
      A church; a mill at 20s 4d. 25 fisheries at 35s less 4d; from cartage, that is, a service, 60s; from grazing, 26s; meadow, 20 acres; from pasturage, 150 pigs. The Bishop gave Herbert son of Ivo an
      outlier of this manor which is called Hougham. He has 1 plough in lordship, and 12 villagers with 9 ploughs. Meadow, 20 acres. From the same manor the Bishop also gave 1 sulung to Osbern Paisforiere.
      2 mills at 50s. In lordship 1 plough, and 4 villagers with 1 plough. Value of the whole of Barham before 1066 £40; when the Bishop acquired it, the same; however, it paid him £100. Value of Barham
      by itself now £40; Hougham £10; what Osbern has £6; value of the land of Ranulf, a man-at-arms, 40s. Archbishop Stigand held this manor, but it was not the Archbishopric''s, but was of King Edward''s
      household revenue.'
