    textEdition: In the Half-Lathe of SUTTON In `AXTON' Hundred King William holds DARTFORD. It answers for 1 1/2 sulungs. Land for 40 ploughs. In lordship 2 ploughs. 142 villagers with 10 smallholders
      have 53 ploughs. 3 slaves; a mill; meadow, 22 acres; pasture, 40 acres; from the woodland 8 small and 3 large pig pastures; 2 hythes, that is 2 harbours. Value before 1066, £60; as much when Haimo
      the sheriff acquired it; now it is valued by the English at £60; but the French reeve who holds at a revenue says that its value is £90. However, he pays from this manor £70 weighed and 111s of pence
      at 20d to the {ora}, and £7 and 26d at face value. In addition to this it pays the sheriff 100s. The men of the Hundred testify that from this manor of the King's have been taken 1 meadow, 1 alder
      grove, 1 mill and 20 acres of land and furthermore as much meadow as belongs to 10 acres of land. All of these were in King Edward's revenue while he was alive. Value of this, 20s. However, they say
      that Osward [* of Norton *], then sheriff, leased them to Alstan, reeve of London. Now Helto the steward and his nephew hold them. They also testify that Hawley has been taken from this manor. It
      answered for 1/2 sulung. The sheriff held this land. When he lost the sheriffdom, it stayed in the King's revenue. It remained so after King Edward's death. Now Hugh of Port holds it with 54 acres
      of land more. Value of the whole, £15. Further from the same manor of the King 6 acres of land have been taken and a wood which Osward the sheriff also placed outside the manor through a pledge of
      40s. The Bishop of Rochester holds the church of this manor. Value 60s. As well as this there are a further 3 small churches. [= ?1? Land of the King. King William holds it. King Edward held it =]
