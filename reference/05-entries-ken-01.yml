    figuresSource: Hull coding
    places: Canterbury
    name: Canterbury (Kent C1)
    holding: borough
    textEdition: '[* In THE BOROUGH Lathe *] [* In CANTERBURY Hundred *] In the City of CANTERBURY King Edward had 51 burgesses who paid tribute and another 212 over whom he had full jurisdiction; and 3
      mills at 40s. Now there are 19 burgesses who pay tribute. [The houses] of 32 others who were there have been destroyed, 11 in the city ditch, the Archbishop ^[of Canterbury]^ has 7 of them, the Abbot
      of St Augustine''s another 14 in exchange for the castle. There are still 212 burgesses over whom the King has full jurisdiction; and the 3 mills pay 108s. The toll pays 68s; 8 acres of meadow which
      used to be the King''s messengers'' now pay 15s in tribute; 1000 acres of unproductive woodland which produce 24s. In total, value before 1066, £51; as much when Haimo the sheriff acquired it; now
      valued at £50. However the present holder pays £30 assayed and weighed, and £24 at face value. Over and above all this the sheriff has 110s.'
    text: '[In THE BOROUGH Lathe] [In CANTERBURY Hundred] In the City of CANTERBURY King Edward had 51 burgesses who paid tribute and another 212 over whom he had full jurisdiction; and 3 mills at 40s.
      Now there are 19 burgesses who pay tribute. [The houses] of 32 others who were there have been destroyed, 11 in the city ditch, the Archbishop [of Canterbury] has 7 of them, the Abbot of St Augustine''s
      another 14 in exchange for the castle. There are still 212 burgesses over whom the King has full jurisdiction; and the 3 mills pay 108s. The toll pays 68s; 8 acres of meadow which used to be the King''s
      messengers'' now pay 15s in tribute; 1000 acres of unproductive woodland which produce 24s. In total, value before 1066, £51; as much when Haimo the sheriff acquired it; now valued at £50. However
      the present holder pays £30 assayed and weighed, and £24 at face value. Over and above all this the sheriff has 110s.'
    households: 282
