    textEdition: In `GODLEY' Hundred lies the Abbey itself. Before 1066 and now the village itself [CHERTSEY] answered for 5 hides. Land [for *** ploughs]. In lordship 2 ploughs; 39 villagers and 20 smallholders
      with 17 ploughs. A mill at the hall; meadow, 200 acres; woodland at 50 pigs from pasturage; a smithy which works for the hall. Of these 5 hides Richard Sturmy holds 2 1/2 hides under King William,
      but the Hundred testifies that his predecessor held from the Abbey but could not go elsewhere without the Abbot's permission. He has 1 plough there, in lordship; 1 villager and 4 smallholders with
      1 plough. Value of the whole manor before 1066 £18; now £22; what Richard holds 40s. [= ?8? Land of the Church of Chertsey =]
