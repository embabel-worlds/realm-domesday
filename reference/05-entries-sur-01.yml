    name: Southwark (Surrey 5,28)
    holding: borough
    textEdition: '[In BRIXTON Hundred] In SOUTHWARK the Bishop has a monastery and a tidal waterway himself. King Edward held them at his death; whoever had the church held from the King. The King had two
      parts of the income from the waterway where ships moored, Earl Godwin the third part. But the men of the Hundred, French and English, testify that the Bishop of Bayeux began a suit with Ranulf the
      sheriff about them; but when he realised that the suit was not rightfully conducted to the King''s advantage, he withdrew the suit. The Bishop however gave the church and the waterway first to Aethelwold,
      and then to Ralph, in exchange for a house. The sheriff also denies that he ever received the King''s command or seal in this matter. The men of Southwark testify that before 1066 no one but the King
      took toll on the shore or on the waterfront. If a criminal was charged there, he paid his fine to the King; but if he was not charged, and went elsewhere, under a person who had full jurisdiction,
      that person had the culprit''s fine. The men of Southwark were themselves adjudged one site and its tolls in the revenue of Kingston [upon Thames]. Count Eustace held it. What the King has in Southwark
      is valued at £16. [= ?5? Land of the Bishop of Bayeux =]'
    text: '[In BRIXTON Hundred] In SOUTHWARK the Bishop has a monastery and a tidal waterway himself. King Edward held them at his death; whoever had the church held from the King. The King had two parts
      of the income from the waterway where ships moored, Earl Godwin the third part. But the men of the Hundred, French and English, testify that the Bishop of Bayeux began a suit with Ranulf the sheriff
      about them; but when he realised that the suit was not rightfully conducted to the King''s advantage, he withdrew the suit. The Bishop however gave the church and the waterway first to Aethelwold,
      and then to Ralph, in exchange for a house. The sheriff also denies that he ever received the King''s command or seal in this matter. The men of Southwark testify that before 1066 no one but the King
      took toll on the shore or on the waterfront. If a criminal was charged there, he paid his fine to the King; but if he was not charged, and went elsewhere, under a person who had full jurisdiction,
      that person had the culprit''s fine. The men of Southwark were themselves adjudged one site and its tolls in the revenue of Kingston [upon Thames]. Count Eustace held it. What the King has in Southwark
      is valued at £16.'
