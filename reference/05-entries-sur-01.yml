    textEdition: In BRIXTON Hundred William holds WANDSWORTH himself. 6 Freemen held it from King Edward; they could go where they would. There were two halls. <36a> Then and now it answered for 12 hides.
      Land for 4 ploughs. Ansculf [* of Picquigny *] had this land after he received the sheriffdom, but the men of the Hundred say that they have seen neither seal or a deliverer. Ansfrid 5 hides, now
      for 1 hide; Heldred, 3 hides, now for nothing; Wulfward, 3 hides; Walter the vinedresser, 1 hide; they did not pay tax. On their lands, 2 1/2 ploughs in lordship; 5 villagers and 22 smallholders with
      2 ploughs. Meadow, 22 acres. Value of the whole manor before 1066, 110s; later 50s; now £8 in all. [= ?21? Land of William son of Ansculf =]
