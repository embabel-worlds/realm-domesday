    textEdition: In `COPTHORNE' Hundred The King holds EWELL in lordship. Before 1066 it answered for 16 hides, less 1 virgate; now for 13 1/2 hides, to the revenue. Land [for *** ploughs]. In lordship
      1 plough; 48 villagers and 4 smallholders with 15 ploughs. 2 mills at 10s; meadow, 14 acres; woodland at 100 pigs; from grazing, 11 pigs. Value before 1066, £20; later and now £16; however, it pays
      £25. The men of the Hundred testify that 2 hides and 1 virgate were removed from this manor; they were there before 1066, but the reeves lent them to their friends; and 1 woodland pig pasture and
      1 croft. The church of Leatherhead is attached to this manor, with 40 acres of land. Value 20s. Osbern of Eu holds it. [= ?1? Land of the King. King William holds it. King Edward held it =]
