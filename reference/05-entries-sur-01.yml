    textEdition: In BLACKHEATH Hundred The King holds GOMSHALL in lordship. Earl Harold held it. Then it answered for 20 hides, now for nothing. Land for 20 ploughs. In lordship 2; 30 villagers and 8 smallholders
      with 18 ploughs. 6 slaves. A mill at 40d; meadow, 3 acres; woodland at 30 pigs. Value before 1066 £15; later £10; now £20; however, it pays £30. The villagers of this village are exempt from all the
      sheriff's concerns. The Bishop ^[of Bayeux]^ wrongfully placed 1/2 hide of the land of this manor in the manor of Bramley, and holds it; it was in Gomshall before and also after 1066. In WOTTON Hundred
      the King has 1 hide in lordship which lies in [the lands of] Gomshall. [= ?1? Land of the King. King William holds it =]
