    holding: manor
    textEdition: In BRIXTON Hundred The Archbishop holds MORTLAKE himself, in lordship. Before 1066 it answered for 80 hides. The Canons of St Paul's hold 8 of these hides, which paid and pay tax with these.
      Now they pay tax together for 25 hides. Land for 35 ploughs. In lordship 5 ploughs; 80 villagers and 14 smallholders with 28 ploughs. A church; 16 slaves. 2 mills at 100s; meadow, 20 acres; from the
      woodland, 55 pigs from pasturage. In London there were 17 messuages which paid 52d; in Southwark 4 messuages at 27d; from the village of Putney 20s from tolls. 1 fishery without dues. Before 1066
      Earl Harold had this fishery <31a> in Mortlake. Archbishop Stigand had it for a long while after 1066. However [the jurors] state that [* Earl *] Harold established it by force before 1066 on Kingston
      [upon Thames] land, and on St Paul's land. Value of the whole manor before 1066 £32; later £10; now £38. [= ?2? Land of the Archbishop of Canterbury =]
