    places: Battersea
    name: Battersea (Surrey 6,1)
    holding: manor
    textEdition: In BRIXTON Hundred St Peter's of Westminster holds BATTERSEA. Earl Harold held it. Then it answered for 72 hides, now for 18 hides. Land [for *** ploughs]. In lordship 3 ploughs; 45 villagers
      and 16 smallholders with 14 ploughs. 8 slaves. 7 mills at £42 9s 8d, or corn of the same price; meadow, 82 acres; woodland at 50 pigs from pasturage. In Southwark 1 smallholder at 12d; from the tolls
      of Wandsworth, £6; from a villager who has 10 pigs, 1 pig; if less, he pays nothing. 1 man-at-arms holds 4 hides of the land of this manor; his stock is accounted above with the rest. Total value
      before 1066 £80; later £30; now £75 9s 8d. King William gave this manor to St Peter's in exchange for Windsor. The Count of Mortain holds 1 1/2 hides of the land of this manor; they were there before
      1066 and for some time after. Gilbert the priest holds 3 hides; they were there in the same way. The Bishop of Lisieux, 2 hides [* in Peckham *] of which the church had possession after 1066; but
      the Bishop of Bayeux dispossessed it later. The Abbot of Chertsey holds 1 hide, which the reeve of this village took from this manor because of a feud, and put in Chertsey. [= ?6? Land of the Church
      of Westminster =]
