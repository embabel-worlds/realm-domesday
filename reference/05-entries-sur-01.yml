    name: Thorncroft (Surrey 19,39)
    holding: manor
    textEdition: 'In `COPTHORNE'' Hundred Richard holds THORNCROFT himself, in lordship. Cola held it from King Edward. Now in lordship 2 ploughs; 5 villagers and 4 smallholders with 2 ploughs. 9 slaves.
      A mill at 20s; meadow, 5 acres; woodland at 1 pig. With this manor these lands were handed over to Richard: Betchworth as 6 hides; 1 hide and 1 virgate which Merewin <of Thorncroft> held; 1 hide which
      Alric and Almer held as 1 manor; another hide which Coleman the hunter held as 1 manor. These men were so free that they could go where they would. These lands were joined with Thorncroft. Before
      1066 they answered for 25 1/2 hides, less 1 virgate; now for 4 hides less 4 acres. On the hide which Alric and Almer held, 1/2 plough and 2 oxen in lordship. On Merewin <of Thorncroft>''s hide, 1
      plough in lordship; meadow, 3 acres. On Coleman''s hide, 2 smallholders. In all land for 5 ploughs. Value of Thorncroft before 1066, 100s; when acquired 60s; now 110s. The 2 hides, always 30s; Coleman''s
      hide, 10s. [= ?19? Land of Richard son of Count Gilbert =]'
    text: 'In `COPTHORNE'' Hundred Richard holds THORNCROFT himself, in lordship. Cola held it from King Edward. Now in lordship 2 ploughs; 5 villagers and 4 smallholders with 2 ploughs. 9 slaves. A mill
