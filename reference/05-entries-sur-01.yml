    textEdition: King William holds WOKING in lordship. It was in King Edward's revenue. Then it answered for 15 1/2 hides; they never paid tax. Land for 6 ploughs. In lordship 1; 33 villagers and 9 smallholders
      with 20 ploughs. A church; Osbern [* of Eu *] holds it. 1 mill at 11s 4d; meadow, 32 acres; woodland at 133 pigs. Walter son of Other holds 3 virgates of this land. A forester held it before 1066;
      it was then placed outside the manor, through King Edward. There is nothing there now. <30b> Value before 1066 and later £15 at face value; now £15 by weight, and 25s to the sheriff. [= ?1? Land of
      the King. King William holds it =]
