    name: Carshalton (Surrey 25,2)
    holding: manor
    textEdition: In WALLINGTON Hundred Geoffrey holds CARSHALTON himself. 5 free men [held it] from King Edward; they could go where they would. One of them held 2 hides, and four 6 hides each. There were
      five manors; now it is in one manor. Then it answered for 27 hides, now for 3 1/2 hides. Land for 10 ploughs. In lordship 1; 9 villagers and 9 cottagers with 5 ploughs. A church; 7 slaves. Meadow,
      12 acres. The men of the County and of the Hundred state that they have never seen a writ or a deliverer who put Geoffrey in possession of this manor on the King's behalf. Value before 1066 £20; when
      he took possession 100s; now £10. Wesman holds 6 of these hides from Geoffrey son of Count Eustace to whom Geoffrey de Mandeville gave this land, with his daughter. In lordship 1 plough; 3 villagers
      and 1 cottager with 3 ploughs. A mill at 35s; 3 slaves; meadow, 10 acres; woodland at 2 pigs. Land for 2 ploughs. Value before 1066 £4; later 40s; now 110s. Of these hides one of the King's smiths
      has 1/2 hide, which he received with his wife before 1066; but he has never done service for it. [= ?25? Land of Geoffrey de Mandeville =]
