    textEdition: The King holds MERTON. Earl Harold held it. Then and now it answered for 20 hides. Land for 21 ploughs. In lordship 2 ploughs; 56 villagers and 13 smallholders with 18 ploughs. A church.
      2 mills at 60s; meadow, 10 acres; woodland, 80 pigs. Value before 1066 £25; later £16; now £35; however, its holder pays £43. In Southwark 16 messuages at 18s 2d belong to this manor. One Orcus holds
      2 hides which always lay in [the lands of] this manor, but are in another Hundred. He held them himself before 1066. Then they answered for 2 hides, now for nothing. In lordship 1 plough. Meadow,
      2 acres. Value always 20s. The Bishop of Lisieux holds 2 sulungs in Kent which were attached to this manor before and after 1066, as the men of the Hundred testify. He claims as patron the Bishop
      of Bayeux; his reeve did not wish to enter a plea thereon. [= ?1? Land of the King. King William holds it =]
    text: The King holds MERTON. Earl Harold held it. Then and now it answered for 20 hides. Land for 21 ploughs. In lordship 2 ploughs; 56 villagers and 13 smallholders with 18 ploughs. A church. 2 mills
