    places: Fawler
    name: Fawler (Berkshire 7,38)
    holding: manor
    textEdition: Eskil [* of Seacourt *] holds FAWLER from the Abbot. Edric held it in freehold from King Edward; he could go where he would. Then and now it answered for 10 hides. Land for 4 ploughs. In
      lordship 2 ploughs; 2 villagers and 1 slave with 1 plough. A mill at 5s; meadow, 50 acres. Value before 1066 £7; later £4; now £6. Of this manor, the Shire confirms that Edric, who held it, delivered
      it to his son, who was a monk in Abingdon, to hold at a revenue and to provide him with the necessities of life for as long as he lived; but that after his death, he should have the manor. Therefore
      the men of the Shire do not know what belongs to the Abbey, for they have not seen the King's writ or seal. But the Abbot testifies that before 1066 he put the manor in the [lands of the] church where
      it was, and has King Edward's writ and seal for it, which all his monks confirm. [= ?7? Land of Abingdon Church =]
    text: Eskil [of Seacourt] holds FAWLER from the Abbot. Edric held it in freehold from King Edward; he could go where he would. Then and now it answered for 10 hides. Land for 4 ploughs. In lordship
