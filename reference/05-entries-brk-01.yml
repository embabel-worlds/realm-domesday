      inheritance, but the burgesses testify that they never had it. The King does not have the customary dues of these 13, and, further, William of Warenne has 1 site from which the King does not have
      customary dues. In addition there are 22 Frenchmen''s messuages which pay 6s 5d. King Edward had 15 acres in which his Guards lived; Miles Crispin holds them; the [burgesses] do not know how; one
