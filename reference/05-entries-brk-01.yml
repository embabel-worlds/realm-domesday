      which do not pay tax. In lordship 4 ploughs; 17 villagers and 71 cottagers with 16 ploughs. 6 slaves; 3 mills at 62s; meadow, 100 acres. In this manor there were 10 free men before 1066, who held
      12 1/2 hides of the land of this manor, but could not withdraw from it. Now Richard Poynant holds 8 hides of this land, which now answer for 3 hides. From Richard William holds 3 hides and Hugh 1
      hide. <57a> In lordship 3 ploughs; 4 villagers and 11 cottagers. Meadow, 26 acres; 7 slaves. Gilbert holds from the King 5 virgates of land of this manor. It answers for 1 virgate. Hervey [* the commissioner
      *] holds from the King 3 hides and 1 virgate which do not pay tax. In lordship 2 ploughs; 1 villager and 14 cottagers with 1 1/2 ploughs. 2 slaves; meadow, 3 acres. Value of the whole before 1066
      and later £64; now, the King's lordship, £47 at face value; Richard's part, and the others', £17 15s. Of this manor the Abbey of Mont-Saint-Michel holds from the King one church, with 1 hide. 1 plough
      there, with 4 cottagers; meadow 7 acres. Value £3. Also, two priests in the same village hold from the King, in the tithes and the church, the value of £4. [= ?[1]? Land of the King. King William
      holds it. King Edward held it =]
