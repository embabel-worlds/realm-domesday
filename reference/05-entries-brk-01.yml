    kind: urban
    edition: Great Domesday
    figuresSource: Hull coding
    places: Wallingford
    name: Wallingford (Berkshire B10)
    holding: borough
    textEdition: When tax was given before 1066, commonly throughout Berkshire the hide gave 3 1/2d before Christmas and as much at Whitsun. If the King sent an army anywhere, one man-at-arms only went
      from 5 hides and for his supplies or pay 4s were given to him for 2 months from each hide; they did not send this money to the King, but gave it to the men-at-arms. If anyone was summoned for an expedition,
      but did not go, he forfeited the whole of his land to the King. But if anyone who had [the reason to] stay behind promised to send another man in his place, but the man who was to be sent stayed behind,
      his lord was cleared for 50s. At his death, a thane or a King's household man-at-arms sent to the King as death-duty all his arms and horse, one with a saddle, another without a saddle; but if he
      had dogs or hawks, they were presented to the King, to accept if he wished. ^[Wallingford]^
