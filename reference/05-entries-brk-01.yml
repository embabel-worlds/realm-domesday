    textEdition: Robert also holds 1 hide _ which Azur <of Slindon>, King Edward's bursar, held; he could go where he would with it. Then for 1 hide; now for nothing. Land for 2 ploughs. In lordship 1;
      11 cottagers with 1/2 plough. Meadow, 10 acres. Azur also holds this land from Robert, but the men of the Hundred testify that he ought to hold from the King as King William restored it to him at
      Windsor and gave him his writ for it. Robert therefore holds it wrongfully; for none of them has seen the King's writ, or a man who put him in possession of it on his behalf. The value is and was
      £3, although it pays £4. [= ?41? Land of Robert d'Oilly =] ?42? Land of Robert of Stafford
