    textEdition: '[* In `SLOTISFORD'' Hundred *] In the Borough of WALLINGFORD King Edward had 8 virgates of land, and in them were 276 sites, which paid £11 in tribute. Those who lived there did service
      for the King with horses, or by water, as far as Blewbury, Reading, Sutton [Courtenay] and Benson. The reeve gave wages or allowances to those who did so, not from the King''s tribute, but from his
      own. All customary dues in this Borough are now as they were before. But there are 13 fewer sites. 8 were destroyed for the castle; a moneyer has 1, exempt so long as he coins money; Saewulf of Oxford
      has 1; [* Alwy *] son of Alsi of Faringdon, 1, which the King gave him, as he states; Humphrey Visdeloup has 1, for which he calls the King to warrant; Nigel [* of Aubigny *] 1 from Henry [* of Ferrers
      *], through Swarting''s inheritance, but the burgesses testify that they never had it. The King does not have the customary dues of these 13, and, further, William of Warenne has 1 site from which
      the King does not have customary dues. In addition there are 22 Frenchmen''s messuages which pay 6s 5d. King Edward had 15 acres in which his Guards lived; Miles Crispin holds them; the [burgesses]
      do not know how; one of them lies in [Long] Wittenham, Walter Giffard''s manor.'
