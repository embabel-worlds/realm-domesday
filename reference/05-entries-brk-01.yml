    textEdition: '[In `RIPPLESMERE'' Hundred] King William holds WINDSOR in lordship. King Edward held it. 20 hides. Land [for *** ploughs]. In lordship 1 plough; 22 villagers and 2 smallholders with 10
      ploughs. 1 slave; a fishery at 6s 8d; meadow, 40 acres; woodland at 50 pigs from pasturage; another woodland has been put in [the King''s] Enclosure; further, there are 100 sites less 5 in the town;
      26 of them are exempt from tribute, and 30s comes from the others. Albert the cleric has 1 1/2 hides of the land of this manor, and the third part of a pig pasture; Walter son of Other, 1 1/2 hides
      and 1 virgate and as much woodland as 5 pigs come from in pasturage; Gilbert Maminot 3 virgates; William Bellett 1 hide; Aelfric 1 hide; a second Aelfric 1/2 hide; the village priest 1 1/2 hides;
      2 servants of the King''s Court 1/2 hide; Eudo the steward 2 hides. Value before 1066 £15; later £7; now £15. [= ?[1]? Land of the King. King William holds it. King Edward held it =]'
