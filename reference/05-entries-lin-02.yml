    text: Guy of Craon holds 4 bovates of land in DRAYTON and 10 bovates in BICKER hundred from the land of Aethelstan son of Godram. Count Alan claims these, and Algar, his man, has given a pledge to the
      King's barons to establish by court-judgement or by combat that Aethelstan himself was not in possession of these 14 bovates before 1066. Against this Guy's man, Alstan of Frampton, has given his
      pledge to prove that he was in possession of them with full jurisdiction, and that Guy was in possession of them from the time of Ralph the constable until now, and he holds them now.
