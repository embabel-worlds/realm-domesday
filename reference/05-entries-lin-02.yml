    textEdition: The men of `Candleshoe' Wapentake testify, with the consent of <375d> the whole Riding, that Sighvatr, Alnoth, Fenkell and Eskil equally and jointly divided their father's land between
      themselves before 1066 and held it in such a way that if a royal expedition was necessary and Sighvatr could go, the other brothers helped him. After him, the next one went and Sighvatr, with the
      rest, helped him; and so on with them all. However, Sighvatr was the King's man. [The men] of Bolingbroke [Wapentake] testify to the same with the above men, and the South Riding also agrees.
    text: The men of `Candleshoe' Wapentake testify, with the consent of the whole Riding, that Sighvatr, Alnoth, Fenkell and Eskil equally and jointly divided their father's land between themselves before
