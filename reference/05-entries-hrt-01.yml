    textEdition: Humphrey <of Wigginton> holds WIGGINTON from the Count. It answers for 7 1/2 hides and the third part of 1/2 hide. Land for 5 ploughs. In lordship 1; another possible. 5 villagers have
      2 ploughs; a third possible. 6 cottagers; 1 slave. 1 mill at 5s; meadow for 1 plough; woodland, 100 pigs. <136d> Total value £4; when acquired 40s; before 1066 £6. Brictric <of Waddesdon>, Queen Edith's
      man, held 3 1/2 hides of this manor and Godwin, Engelric [* the priest *]'s man, had 3 hides and the third part of 1/2 hide; he could not grant or sell outside Tring. These are of the 7 hides which
      the Count of Mortain took from Tring. Leofric, Oswulf [* son of Frani *]'s man, held 1/2 hide; he could sell. Another 1/2 hide lay in [the lands of] Berkhamsted. [= ?15? Land of the Count of Mortain
      =]
