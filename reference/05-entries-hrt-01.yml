    name: Throcking (Hertfordshire 4,1)
    holding: land
    textEdition: '[In `EDWINSTREE'' Hundred] The Bishop of London holds 1 1/2 hides in THROCKING, and Humphrey from him. Land for 1 1/2 ploughs. They are there, with 2 villagers, 1 smallholder and 1 cottager.
      Meadow for 1 plough; pasture for the livestock; wood for fences. Value 52s; when acquired 30s; before 1066, 40s. Two brothers, Bishop William''s men, held this land; it was of the King''s jurisdiction;
      they could sell. They paid 6d to the sheriff in customary dues, or 1 1/2 cartages. 1 virgate of this land was and is in pledge. Humphrey clears it from the King''s tax; however, he does not have it.
      This land is [part] of Bishop William''s purchase, as the Bishop''s men say, but the men of the Shire do not confirm them. [= ?4? Land of the Bishop of London =]'
    text: '[In `EDWINSTREE'' Hundred] The Bishop of London holds 1 1/2 hides in THROCKING, and Humphrey from him. Land for 1 1/2 ploughs. They are there, with 2 villagers, 1 smallholder and 1 cottager.
