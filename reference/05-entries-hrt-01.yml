    textEdition: In BERKESDEN Peter [* of Valognes *] and Theobald <of Barley> hold 1 virgate from Hardwin. Land for 1 plough; it is there, with 2 smallholders. Meadow for 2 oxen. The value is 10s and always
      was. 3 Freemen held this land. One of them, Edeva the fair's man, had a fourth part of 1 virgate; the second, [* Earl *] Algar's man, likewise had a fourth part; the third, [* Earl *] Gyrth's man,
      had 1/2 virgate; they could sell. Count Alan claims that he should rightly have three parts of this virgate; for he was in possession thereof when he recently crossed the sea, as the men of the Hundred
      bear witness for him. But Hardwin claims Peter the sheriff as protector and deliverer, by <142a> order of the Bishop of Bayeux, because he delivered it to him in exchange for Libury. [= ?37? Land
      of Hardwin of Scales =]
