    textEdition: In `DANISH' Hundred Edward of Salisbury holds [Great] GADDESDEN. It answered for 6 hides before 1066; now for 3 hides; but one of them answers in Tring Hundred, and should be valued here.
      Land for 12 ploughs. In lordship 2 hides; 4 ploughs there. 15 villagers with a priest have 6 ploughs; a further 2 possible. 2 smallholders; 1 cottager; 8 slaves. 1 mill at 5s; meadow for 1 1/2 ploughs;
      pasture for the village livestock; woodland, 500 pigs. Total value £22; when acquired £20; before 1066 £25. Wulfwynn [* of Creslow *] held this manor in 1066 from the Abbot of St Albans; she could
      not dispose of it outside the church, but after her death it was to return to the Church, as the Hundred testifies. [= ?32? Land of Edward the sheriff =]
