    holding: land
    textEdition: In BROADWATER Hundred Count Alan holds 1 1/2 hides in WATTON. Godwin holds from him. Land for 4 ploughs. In lordship, 2 possible. 3 smallholders and 2 cottagers have 2 ploughs. Meadow for
      2 oxen; pasture for the livestock. The value is and was 20s; before 1066, 30s. Godwin held this land from St Peter's Church; he could not sell, but after his death it was to return to the <137a> Church,
      as the Hundred testifies. But his wife turned with this land to Edeva the fair, by force, and held it in 1066. 16 acres were taken from this land after 1066; Ansketil of Rots now holds them under
      the Archbishop ^[of Canterbury]^; however Count Alan clears them for the King's tax. [= ?16? Land of Count Alan =]
