    textEdition: In BRAUGHING Hundred Ranulf holds 17 hides and 1/2 virgate in STANSTEAD [Abbots] himself. Land for 16 ploughs. In lordship 13 hides; 2 ploughs there; a third possible. 4 villagers with
      a priest and the village reeve, and 4 Frenchmen, have 8 ploughs; a further 5 possible. 6 cottagers; 2 slaves. 1 mill at 10s; meadow for 16 ploughs; pasture for the village livestock; woodland, 100
      pigs. Also 7 burgesses who pay 23s, with other customary dues of the meadow and woodland. Total value £17; when acquired £10; before 1066 £20. Alwin of Gotton held 11 hides and 1/2 virgate of this
      manor and of these Ralph Tallboys gave [10 hides and 1/2 virgate] to Ranulf, with his niece, as a marriage portion; he placed the 11th hide in Hunsdon. [1]4 Freemen held another 7 hides. 4 of them,
      Eskil [* of Ware *]'s men, had 4 hides. The other 10, Alwin of Gotton's men, had 3 hides; they paid the King's sheriff 12d a year in customary dues. All 14 however could sell their land. [= ?25? Land
      of Ranulf brother of Ilger =] ?26? Land of Hugh of Grandmesnil
