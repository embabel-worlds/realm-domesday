    textEdition: '[In TRING Hundred] ?M? Robert d''Oilly holds `TISCOTT'' and Ralph Bassett from him. It answered for 4 hides before 1066; now for 2. Land for 4 ploughs. In lordship 2. 3 1/2 villagers with
      2 Freemen, with one hide, and 5 smallholders have 2 ploughs. 1 cottager; 1 slave. 1 mill at 10s; meadow for 3 ploughs. In total, value 70s; when acquired £4; before 1066, 100s. 5 Freemen held this
      manor. 2 of them, Brictric <of Waddesdon>''s men, had 1 1/2 hides; 2 others, Oswulf son of Frani''s men, 1 1/2 hides; the fifth, Edmer Ator''s man, held 1 hide. None of them belonged to [Robert]''s
      predecessor, Wigot [* of Wallingford *], but each of them could sell his land. One of them bought his land from King William for 9 ounces of gold, as the men of the Hundred testify. Later he turned
      to Wigot for protection. [= ?19? Land of Robert d''Oilly =]'
