    textEdition: In TRING Hundred The Count of Mortain holds BERKHAMSTED. It answers for 13 hides. Land for 26 ploughs. In lordship 6 hides; 3 ploughs there; another 3 possible. A priest with 14 villagers
      and 15 smallholders have 12 ploughs; a further 8 possible. 6 slaves. A dyke builder has 1/2 hide and Ranulf, a servant of the Count, 1 virgate. In the borough of this town ^[Berkhamsted]^, 52 burgesses,
      who pay £4 from tolls, have 1/2 hide. 2 mills at 20s; 2 {arpents} of vineyard; meadow for 8 ploughs; pasture for the village livestock; woodland, 1000 pigs, and 5s too. Total value £16; when acquired
      £20; before 1066 £24. Edmer [* Ator *], a thane of Earl Harold's, held this manor. [= ?15? Land of the Count of Mortain =]
