    textEdition: King William holds [Kings] WALDEN. It answers for 2 hides. Land for 20 ploughs. In lordship 2 virgates; 2 ploughs. A priest with 13 villagers and 4 smallholders have 6 ploughs; a further
      2 possible. 2 cottagers; 4 slaves. Meadow for 1/2 plough; pasture for the village livestock; woodland, 400 pigs. The total value is and was £8; before 1066 £10. Leofeva held this manor from Earl Harold;
      she could sell without his permission. She found 1 cartage and escort for the King's service, but wrongfully and by force, as the Shire testifies. A widow, Esger [* the constable *]'s woman, holds
      1 of these 2 hides from the King as one manor; she has 1 plough. 17 villagers with 7 smallholders have 6 ploughs; [a further] 3 possible. 5 cottagers. Meadow for 1/2 plough; woodland, 400 pigs; pasture
      for the village livestock. The total value is and was £4; before 1066 £8. She also held this manor before 1066 from Earl Harold; she could sell without his permission. Wrongfully and by force she
      found 1 cartage and escort for the King's service, as the Shire testifies. Ilbert [* of Hertford *] placed these 2 manors in Hitchin when he was sheriff, as the Hundred testifies. [= ?1? Land of the
      King. King William holds it =]
