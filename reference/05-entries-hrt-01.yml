    textEdition: In WAIN 1 Freeman holds 1 hide. Land for 2 ploughs; they are there. 2 villagers with 1 smallholder and 9 cottagers. Meadow for 1/2 plough; pasture for the village livestock; wood for fences;
      attached to this land is woodland for 50 pigs, which Osmund of Vaubadon annexed in King William's despite. It lay in the jurisdiction of Hitchin before 1066, as the Shire testifies. The value of this
      land is and was 20s; before 1066, 30s. Godwin, Earl Harold's man, held this land; he could sell. Peter the sheriff placed it in Hitchin for the revenue. It was not there before 1066, nor did it pay
      customary dues there. Ilbert [* of Hertford *] gave this land to a man-at-arms of his while he was sheriff; Geoffrey of Bec claims the King's mercy for this land. [= ?1? Land of the King. King William
      holds it =]
