      reeve, and with 3 Frenchmen and 2 Englishmen, have 26 1/2 ploughs; [a further 5 1/2 ploughs possible;] 27 smallholders; 12 cottagers; 9 slaves. Under the Frenchmen and Englishmen are 32 men, of the
      villagers and smallholders. 2 mills at 24s, and 400 eels less 25; the other men have 3 mills which pay 10s a year; meadow for 20 ploughs; woodland, 400 pigs. A park for woodland beasts; 4 {arpents}
      of vines, just planted. Total value £45; when acquired £50; before 1066 as much. <138d> Eskil of Ware held this manor, and 1 Freeman, his man, had 2 hides. Another Freeman, Earl Gyrth's man, held
