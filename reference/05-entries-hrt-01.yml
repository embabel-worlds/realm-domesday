    textEdition: In BRAUGHING Hundred ?M? The Count holds BRAUGHING himself. It answers for 5 hides. Land for 11 ploughs. In lordship 3 hides; 3 ploughs there. 10 villagers with a priest and 9 smallholders
      have 8 ploughs. 3 cottagers; 6 slaves. 1 mill at 12d; meadow for 3 ploughs; pasture for the village livestock; woodland, 6 pigs. The total value is and was £16; before 1066 £20. 2 thanes held this
      manor; one of them, King Edward's man, had 4 hides; the second, Esger the constable's man, had 1 hide; they could not sell because they always lay in the alms [lands] in the time of King Edward and
      of all his predecessors, as the Shire testifies. [= ?17? Land of Count Eustace =] ?18? Land of Earl Roger
