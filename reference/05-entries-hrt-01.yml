    textEdition: In BRAUGHING Hundred Rohais, wife of Richard son of Count Gilbert, holds STANDON. It answers for 11 hides. Land for 24 ploughs. In lordship 6 hides; 5 ploughs there. 29 villagers with a
      priest, 15 smallholders, 2 Freemen and a Frenchman have 12 ploughs; a further 7 possible. 9 cottagers; 8 slaves. 5 mills at 45s; meadow for 24 ploughs; pasture for the livestock; woodland, 600 pigs;
      2 {arpents} of vines. Total value £33; when acquired £16; before 1066 £34. Archbishop Stigand held this manor. In this manor were 6 Freemen, the Archbishop's men; each had 1 hide; they could sell,
      except the jurisdiction. One of them however could also sell his jurisdiction with the land. [= ?42[a]? Land of ^[Rohais,]^ Richard son of Gilbert's wife =] ?43? Land of ^[Adeliza]^, Hugh of Grandmesnil's
      wife
