    holding: land
    textEdition: In LIBURY Peter holds 1/2 virgate and 10 acres. Land for 3 oxen. 1 smallholder. Woodland, 4 pigs. Value of this land 2s before 1066. A Freeman of King Edward's held it; he could sell; in
      customary dues, he found the fourth part of one cartage, or 1 penny a year, for the King's sheriff. Peter the sheriff took this land from this Freeman of King William's; it is in the King's hands,
      in forfeiture, for his not paying the King's tax, as [the sheriff's] men say. But the men of the Shire do not bear witness to the sheriff, because it was always exempt from tax and from other things
      concerning the King for as long as he held it, as the Hundred testifies. [= ?36? Land of Peter of Valognes =]
