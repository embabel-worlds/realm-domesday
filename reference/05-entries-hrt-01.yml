    name: '[Temple] Dinsley (Hertfordshire 1,9)'
    holding: dependency
    textEdition: King William holds [Temple] DINSLEY. It answers for 7 hides. Land for 20 ploughs. In lordship 3 1/2 hides; 3 ploughs. 19 villagers have 8 ploughs; a further 9 possible. 7 smallholders;
      7 cottagers; 6 slaves; 1 Frenchman, an almsman of the King. 2 mills at 16s; meadow for 1 plough; pasture for the village livestock; woodland, 300 pigs. In total value it pays £14 a year assayed and
      weighed and £5 at face value; the same before 1066 and when Peter the sheriff acquired it. 2 Freemen held this manor as 2 manors from Earl Harold before 1066; they could sell. However, each of them
      found 2 cartages and 2 escorts in Hitchin, but by force and wrongfully, as the Hundred testifies. Ilbert [* of Hertford *] held these 2 manors as 1 manor and was put in possession thereof through
      the King's writ, as long as he was sheriff, as the Shire testifies. After he relinquished the sheriffdom, Peter of Valognes and Ralph Tallboys took the manor from him and placed it in Hitchin because
      he refused to find cartage for the sheriff. Geoffrey of Bec, Ilbert's successor, claims the King's mercy for this manor. [= ?1? Land of the King. King William holds it =]
    text: King William holds [Temple] DINSLEY. It answers for 7 hides. Land for 20 ploughs. In lordship 3 1/2 hides; 3 ploughs. 19 villagers have 8 ploughs; a further 9 possible. 7 smallholders; 7 cottagers;
