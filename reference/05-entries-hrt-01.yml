    places: Tring
    name: Tring (Hertfordshire 17,1)
    holding: manor
    textEdition: '[In TRING Hundred] Count Eustace holds TRING. It answered for 39 hides before 1066; now for 5 hides and 1 virgate. Land for 20 ploughs. In lordship 12 hides; 3 ploughs there; a further
      2 possible. 21 villagers with 6 smallholders, 16 cottagers and 3 Freemen have 9 ploughs; a further 6 possible. 8 slaves. 2 mills at 9s; meadow for 10 ploughs; pasture for the village livestock, and
      3s too; woodland, 1000 pigs. In this village is an outlier where 8 villagers reside who have 2 ploughs; a third possible. Total value £22 of white pence, at this Count''s weights; when acquired £20;
      before 1066 £25. Engelric [* the priest *] held this manor before 1066; 2 Freemen, Oswulf son of Frani''s men, were there; they held 2 hides; they could sell. Engelric [* the priest *] placed these
      Freemen in this manor after 1066, as the men of the Hundred testify. A man of the Abbot of Ramsey''s had 5 hides of this manor in the same way; he could not grant or sell his land outside St Benedict''s
      Church. Engelric [* the priest *] placed him in this manor after 1066; he was not there before 1066, as the Hundred testifies. The said 3 Freemen, who are still there, and who have 1 hide, were Engelric
      [* the priest *]''s men; they could sell their land. [= ?17? Land of Count Eustace =]'
    text: '[In TRING Hundred] Count Eustace holds TRING. It answered for 39 hides before 1066; now for 5 hides and 1 virgate. Land for 20 ploughs. In lordship 12 hides; 3 ploughs there; a further 2 possible.
      21 villagers with 6 smallholders, 16 cottagers and 3 Freemen have 9 ploughs; a further 6 possible. 8 slaves. 2 mills at 9s; meadow for 10 ploughs; pasture for the village livestock, and 3s too; woodland,
      1000 pigs. In this village is an outlier where 8 villagers reside who have 2 ploughs; a third possible. Total value £22 of white pence, at this Count''s weights; when acquired £20; before 1066 £25.
      Engelric [the priest] held this manor before 1066; 2 Freemen, Oswulf son of Frani''s men, were there; they held 2 hides; they could sell. Engelric [the priest] placed these Freemen in this manor after
      1066, as the men of the Hundred testify. A man of the Abbot of Ramsey''s had 5 hides of this manor in the same way; he could not grant or sell his land outside St Benedict''s Church. Engelric [the
      priest] placed him in this manor after 1066; he was not there before 1066, as the Hundred testifies. The said 3 Freemen, who are still there, and who have 1 hide, were Engelric [the priest]''s men;
      they could sell their land.'
