    holding: manor
    textEdition: Geoffrey holds SAWBRIDGEWORTH himself for 24 1/2 hides. Land for 40 ploughs. In lordship 15 hides; 10 ploughs there; a further 2 possible. 50 villagers and 4 Freemen with a priest have
      28 ploughs. A reeve has 1/2 hide; a priest 1 hide. 14 of the villagers, 1 virgate each; 35 villagers, 1/2 virgate each; and the said villagers hold 1 1/2 virgates and 9 acres, from which they pay
      17s 4d a year. 46 smallholders have 8 acres each; 2 smallholders with 10 acres; 20 cottagers with 26 acres. 30 cottagers; 30 slaves. Under the Freemen are 7 cottagers. Esger [* the constable *] has
      2 hides; under him are 2 villagers, 7 smallholders, 3 cottagers and 4 slaves. Kip has 1/2 hide and 1 mill at 20s. Another Freeman at 5s 4d. Meadow for 20 ploughs; pasture for the livestock; woodland,
      300 pigs; and from their payments 4s. Total value £50; when acquired £60; before 1066 as much. <140a> Esger the constable held this manor. There were 4 Freemen there; two of them, Esger's men, had
      1/2 hide; they could sell, except for the jurisdiction; the third, Earl Harold's man, had 1 virgate; the fourth, Alwin of Gotton's man, had 1 virgate; these could sell and grant. The jurisdiction
      was Esger the constable's. 1 further Freeman, Esger's man, had 2 hides; but he could not sell. [= ?33? Land of Geoffrey de Mandeville =]
