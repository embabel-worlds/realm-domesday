    name: Sacombe (Hertfordshire 36,11)
    holding: manor
    textEdition: In SACOMBE Peter holds 9 hides less 1 virgate. Land for 7 ploughs. In lordship 6 hides; 3 ploughs there; a fourth possible. 5 villagers with 6 smallholders and 1 cleric have 3 ploughs.
      6 cottagers; 4 slaves. 1 mill at 20s; woodland, 60 pigs. The total value is and was £6; before 1066 £8. Almer ^[of Bennington]^ held 4 hides of this manor as one manor, as the Hundred testifies; Leofwin
      [* of Caddington *] held 2 hides less 1 virgate as one manor; he was Earl Harold's man; he could sell. <141b> In the manor which Almer ^[of Bennington]^ held were 4 Freemen. One of them held 1/2 hide;
      he could sell. The second held 1 virgate, but he could not sell, except with the permission of his lord, Almer. The third and fourth had 1/2 hide less 6 acres; they could sell. King Edward had full
      jurisdiction over these two; each found a fourth part of a cartage a year for the sheriff, or 1 penny. These four were Almer of Bennington's men. In the same manor a woman held 5 virgates under Eskil
      of Ware; she could sell, except for the 1 virgate, which she placed in pledge with Almer of Bennington for 10s; she found 1 cartage and a fourth part of another cartage, or 5d. [= ?36? Land of Peter
      of Valognes =]
