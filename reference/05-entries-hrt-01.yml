    holding: manor
    textEdition: In TEWIN Healfdene <of Hanslope> holds 5 1/2 hides from Peter. Land for 5 1/2 ploughs. In lordship 1; another possible. <141c> 4 villagers with 5 smallholders have 3 1/2 ploughs. 5 cottagers;
      1 slave. 1 mill at 8s; meadow for 2 ploughs; pasture for the livestock; woodland, 50 pigs, and from the payments of the woodland 2s. Total value 60s; when acquired 30s; before 1066 £4. Healfdene also
      held this manor; he was King Edward's thane; he could sell. But King William granted this manor to this Healfdene and his mother for the soul of his son Richard, as he says himself and shows through
      his writ. Peter now says that he has this manor by the King's gift. [= ?36? Land of Peter of Valognes =] ?37? Land of Hardwin of Scales
    text: In TEWIN Healfdene holds 5 1/2 hides from Peter. Land for 5 1/2 ploughs. In lordship 1; another possible. 4 villagers with 5 smallholders have 3 1/2 ploughs. 5 cottagers; 1 slave. 1 mill at 8s;
