    textEdition: In BROADWATER Hundred King William holds WYMONDLEY. It answers for 8 hides. Land for 18 ploughs. In lordship 2 1/2 hides; 3 ploughs. 24 villagers, 1 Freeman, 5 smallholders, and 5 cottagers
      have 15 ploughs. 6 slaves. 1 mill at 20s; meadow for 1 plough and 2 oxen; pasture for the village livestock; wood for fences. This manor was in the lordship of St Mary's Church, Chatteris, but Earl
      Harold took it away, as the whole Shire testifies, and attached it to his manor of Hitchin, three years before King Edward's death. [= ?1? Land of the King. King William holds it =]
