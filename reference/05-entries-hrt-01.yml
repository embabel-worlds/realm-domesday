    textEdition: ?M? Godwin [* of Hormead *] also holds HORMEAD from ^[Prince]^ Edgar. It answers for 6 hides. and 3 virgates. Land for 10 ploughs. In lordship 4; a fifth possible. 6 villagers with 15 smallholders
      have 5 ploughs. 2 cottagers; 6 slaves. Meadow for 1 plough; pasture for the livestock; woodland, 24 pigs. Total value £8; when acquired £6; before 1066 £12. Of this manor Alnoth [* Grutt *], a thane
      of Archbishop Stigand's, held 1 1/2 hides as one manor; Wulfwin, Esger the constable's man, 1 hide; Alward [* the noble *], Almer of Bennington's man, 1 hide; 7 Freemen of King Edward's held 3 hides
      and 1 virgate; they paid 13d a year to the sheriff; all these could sell their land. Ilbert the sheriff placed these 7 Freemen and Wulfwin and Alward [* the noble *] in this manor after 1066; they
      were not there before 1066, as the Hundred testifies. [= ?38? Land of Prince Edgar =] ?39? Land of Mainou the Breton
