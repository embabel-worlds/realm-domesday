      and from pasture 10d. The total value is and was 70s; before 1066 £6. Leofwin [* of Caddington *], Earl Harold's man, held this manor; he could sell. Alwin Gotton, King Edward's man, held 1 hide of
      this land; he could sell. Ralph Tallboys received it from Stanstead [Abbots] and attached it to this manor. [= ?44? Land of Ralph Tallboys' daughter =] <143a> BUCKINGHAMSHIRE
