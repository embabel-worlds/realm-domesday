    textEdition: Uhtred <of Crosby> held CROSBY and KIRKDALE as 1 hide and was exempt from all customary dues except these six; breach of the peace, highway robbery, breaking and entry, a combat which persisted
      after an oath had been taken, if a man, after he had been constrained thereto by the reeve's judgement, did not pay anyone what he owed or did not heed a boundary set by the reeve. For these the fine
      was 40s. But Uhtred paid the King's tax like the men of the district. [= ?[R1]? Roger of Poitou held these lands between the Ribble and the Mersey from King William =]
