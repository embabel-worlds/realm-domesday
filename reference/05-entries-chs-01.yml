      the King had two parts of all income and returns from the salt-houses and the Earl one third. But as well as these the Earl had a salt-house of his own, attached to his manor of Acton. From this salt-house
      the Earl had salt sufficient for his household for the whole year; but if any of it were sold, the King had two pence of the toll, the Earl the third penny. [= [* The salt-works of Earl Hugh *] =]
