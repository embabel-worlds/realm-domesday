    holding: manor
    textEdition: In {EXESTAN} Hundred Hugh [* son of Osbern *], Osbern [* son of Tezzo *] and Reginald [* the sheriff *] hold GRESFORD. Thorth [* of Wroxeter *] held it as a free man. 13 hides paying tax.
      Land for 12 ploughs. Hugh has 5 hides; Osbern [* son of Tezzo *] 6 1/2 hides; Reginald [* the sheriff *] 1 1/2 hides. In lordship 1 1/2 ploughs. A church and a priest, 7 villagers, 12 smallholders
      and 1 Frenchman. Between them they have 2 1/2 ploughs. In the whole manor, woodland 4 leagues long and 2 wide; 2 hawk's eyries. Osbern [* son of Tezzo *] has a mill which grinds corn for his hall.
      Before 1066 it was all waste, and they acquired it waste; value now 65s between them. Before 1066 1 hide of this manor lay in [the lands of] St Chad's Church [* of Lichfield *]; 1/2 in {Chespuic}
      and 1/2 in {RADENOURE}. The County testifies this, but does not know how the church lost [the land]. [= ?[27]? [* Shared lands held from Earl Hugh *] =]
    text: In EXESTAN Hundred Hugh [son of Osbern], Osbern [son of Tezzo] and Reginald [the sheriff] hold GRESFORD. Thorth [of Wroxeter] held it as a free man. 13 hides paying tax. Land for 12 ploughs. Hugh
      has 5 hides; Osbern [son of Tezzo] 6 1/2 hides; Reginald [the sheriff] 1 1/2 hides. In lordship 1 1/2 ploughs. A church and a priest, 7 villagers, 12 smallholders and 1 Frenchman. Between them they
