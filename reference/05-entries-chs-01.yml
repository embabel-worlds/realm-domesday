    textEdition: Before 1066 this {wich} ^[NANTWICH]^ paid £21 in revenue, with all the pleas of this Hundred. When Earl Hugh acquired it, it was abandoned, except for a single salt-house; now William Malbank
      holds this {wich} from the Earl, with all the customary dues that belong to it, and the whole of this Hundred, which is valued at 40s, of which money 30s is imposed upon the land of William himself,
      the other 10s upon the Bishop ^[of Chester]^'s land and upon the lands which Richard [* of Vernon *] and Gilbert [* the hunter *] have in this Hundred; the {wich} is at a revenue of £10. [= [* The
      salt-works of Earl Hugh *] =]
