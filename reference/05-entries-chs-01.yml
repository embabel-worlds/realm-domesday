      as stated above. They accorded these burgesses the laws and customs which are observed in Hereford and Breteuil, namely that throughout the whole year they pay only 12d for any penalty apart from
      homicide, theft and premeditated breaking and entry. In the year of this survey the toll of this Borough was granted at a revenue of 3s. ^[Earl Edwin held it]^ [= ?[FT2]? [* Robert of Rhuddlan holds
      from Earl Hugh *] =]
