    textEdition: These were the laws there. If the peace given by the King's hand, or by his writ or his commissioner, were broken by anyone, the King had 100s thereby. But if the King's peace, given by
      the Earl or on his orders, were broken, the Earl had the third penny of the 100s which were given for it; and if the peace given by the King's reeve or the Earl's officer were broken, the fine was
      40s and the third penny was the Earl's. ^[Chester]^
