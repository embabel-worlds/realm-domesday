    text: None of the thanes who had salt-houses in this wich [NORTHWICH] paid the Friday salt-boilings at any time of the year. Anyone from another shire who brought a cart with 2 or more oxen paid 4d
      toll; a man from the same shire paid 2d a cart, by the third night after his return home; if the third night passed, he paid a fine of 40s. A man from another shire paid 1d for a packhorse load; but
      a man from the same shire paid 1 farthing by the third night, as stated.
    folio: CHS 12
