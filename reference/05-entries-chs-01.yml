    name: Middlewich (Cheshire S2,2)
    holding: manor
    textEdition: Whoever carted purchased salt from these two {wich}s ^[NANTWICH and MIDDLEWICH]^ paid 4d in toll if he had four or more oxen to his cart; if two oxen, he paid 2d toll, if there were two
      packloads of salt. A man from another Hundred paid 2d for a packhorse load, but a man from the same Hundred paid only 1/2d for a packload of salt. Anyone who so overloaded a cart that the axle broke
      within one league of either {wich} paid 2s to the officer of the King or the Earl, if he could be caught within the league; similarly, anyone who so overloaded a horse that he broke its back paid
      2s, if caught within the league; beyond the league, nothing. [= [* The salt-works of Earl Hugh *] =]
