    name: Rhuddlan (Cheshire FT1,1)
    holding: borough
    textEdition: 'In ATI''S CROSS Hundred Earl Hugh holds RHUDDLAN from the King. Before 1066 `ENGLEFIELD'' lay there; it was all waste. Earl Edwin held it. When Earl Hugh acquired it it was likewise waste.
      Now he has in lordship half of the castle called Rhuddlan, which is the head of this land. He has there 8 burgesses; half of the church and the mint; half the iron mines, wherever found on this manor;
      half the waters of the Clwyd; of the mills and fisheries made there, namely on the part of the river that belongs to the Earl''s Holding; half of the forests which did not belong to any other village
