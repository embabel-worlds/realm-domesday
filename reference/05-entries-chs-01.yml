    name: Weaverham (Cheshire 1,1)
    holding: manor
    textEdition: In RULOE Hundred Earl Hugh holds WEAVERHAM in lordship. Earl Edwin held it. 13 hides paying tax. Land for 18 ploughs. In lordship 2; 2 ploughmen; 2 slaves. 10 villagers, 1 smallholder;
      1 rider with 1 villager; between them they have 3 ploughs. A church and a priest; a mill which serves the hall; meadow, 1 acre; woodland 2 leagues long and 1 league wide; 2 hedged deer enclosures.
      10 burgesses in the City ^[Chester]^ belong to this manor; 6 of them pay 10s 8d and 4 pay nothing. A Frenchman holds from the Earl. In Nantwich there were 7 salt-houses which belonged to this manor;
      one of them now pays salt to the hall; the others are disused. In another Hundred 1 virgate of land, called Antrobus, belongs to this manor; it is waste. Jocelyn [* of Tuschet *] holds 4 hides of
      this manor's land from the Earl. He has 1 plough, 3 slaves; 5 villagers and 1 rider with 2 ploughs. 1/2 fishery. The Earl has put 3 hides of this land in the Forest. Before 1066 the revenue from the
      whole was £10; the Earl found it waste; now, his lordship 50s, Jocelyn [* of Tuschet *]'s 10s. [= ?[1]? [* Land of Earl Hugh *] =]
