    name: Cheshire R1,40a
    textEdition: All these thanes customarily paid 2 {orae} of pence for each carucate of land. As a customary due they used to build the King's buildings and whatever belonged to them, as though they were
      villagers, fisheries, hedged woodland enclosures and stag-beats. Anyone who did not go to this [work] when he should was fined 2s, and afterwards came to the work and worked until it was done. Each
      one of them sent his harvesters for one day in August to cut the King's corn; if he did not he was fined 2s. ^[King Edward had them]^ [= ?[R1]? Roger of Poitou held the land between the Ribble and
      the Mersey from King William =]
