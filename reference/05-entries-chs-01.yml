      house in Northwich. Of the land of this manor Odard <of Aston> holds 1/2 hide; Geoffrey 2 hides; Aitard <of Halton> 1 1/2 hides; Humphrey [* of the Cotentin *] 1 1/2 hides; Odard <of Aston> 1/2 hide;
      Hardwin 1/2 hide. In lordship 3 ploughs; 12 villagers, 1 rider and 5 smallholders with 5 ploughs between them; 6 ploughmen. Meadow, 1/2 acre; woodland 18 acres. Total value of the manor before 1066,
      40s; later waste; now, what William holds 50s, what the men-at-arms hold 54s. [= ?[9]? [* William son of Nigel holds from Earl Hugh *] =]
