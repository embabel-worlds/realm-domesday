      and 5 leagues and 1 furlong wide. One of them, Gamal [* son of Gruffydd *], who held 2 hides in ROCHDALE, had his own exempt customary dues, except for these six: theft, breaking and entry, highway
      robbery, breach of the King''s peace, breach of a boundary fixed by a reeve and a combat persisting after an oath had been taken. For these the fine was 40s. [= ?[R5]? ^[Roger of Poitou held it]^
      from King William =]'
