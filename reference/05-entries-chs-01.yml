    textEdition: All these salt-houses, both of the commons and of the lords, were bounded on one side by a river and on the other by a dyke. Anyone who incurred a penalty within these boundaries could
      pay a fine of 2s, or of 30 boilings of salt, except for homicide, or for a theft for which the thief was condemned to death. Those who committed such offences were punished as in the rest of the shire.
      ^[Nantwich]^ [= [* The salt-works of Earl Hugh *] =]
