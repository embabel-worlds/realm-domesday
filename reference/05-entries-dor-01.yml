    name: Sherborne (Dorset 2,6)
    holding: manor
    textEdition: The Bishop holds SHERBORNE himself. Queen Edith held it, and before her Bishop Alwold. Before 1066 it paid tax for 43 hides. Land for 46 ploughs. The Bishop holds 12 hides of this land;
      he has 25 villagers and 14 smallholders with 12 ploughs. Meadow, 130 acres of which 3 acres are in Somerset near Milborne [Port]; pasture 1 league long and 1 wide; woodland 2 leagues long and as wide.
      Also of this manor's land Odbold holds 4 hides from the Bishop, Sinoth 5 1/2 hides, Engelbert 5 hides, Waleran 3 hides, Ralph 3 hides, the wife of Hugh son of Grip 2 hides. On these 22 1/2 hides are
      21 ploughs. 33 villagers, 15 smallholders, 10 Cottagers and 4 slaves. 4 mills which pay 18 1/2s. Six thanes hold 8 1/2 hides also of this land. They have 8 ploughs and 4 slaves and 17 villagers and
      19 smallholders. 3 mills which pay 30d. In this manor [of] Sherborne, besides the said land, the Bishop has in lordship 16 carucates of land. This land was never divided into hides and did not pay
      tax. In lordship 5 ploughs; 26 villagers, 26 smallholders and 8 slaves with 11 ploughs. A mill which pays 10s. Of this exempt land Sinoth holds 1 carucate of land from the Bishop, and Edward another.
      2 ploughs there; 2 slaves; 8 smallholders. [= ?2? Land of the Bishop of Salisbury =] ?3? [Land of the monks of Sherborne [* and the Bishop of Salisbury *]]
