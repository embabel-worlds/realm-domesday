    textEdition: The King holds MELCOMBE [Horsey]. Earl Harold wrongfully took it away from St Mary's of Shaftesbury. Before 1066 it paid tax for 10 hides. Land for 10 ploughs, of which 7 1/2 hides and
      1 virgate of land are in lordship; 2 ploughs there; 4 slaves; 9 villagers and 20 smallholders with 7 ploughs. Meadow, 5 acres; woodland, 1 league; pasture 1 league long and 8 furlongs wide. 12 acres
      of meadow which belong to this manor were leased to Wulfgar? White; now William Bellett holds them. ^[Countess]^ Goda attached to this manor 3 1/2 virgates of land which three free thanes held before
      1066. They paid tax for as much. Land for 1 plough, which is there, with 3 villagers. Meadow, 15 acres; woodland, 5 acres. These 3 1/2 virgates are in Buckland [Newton] Hundred. The value of the whole
      was and is £16. Countess Goda held it. [= ?[1]? Land of the King. King William holds it =] <76a-b>
