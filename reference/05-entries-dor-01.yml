    textEdition: The Church itself holds CHESELBOURNE. Before 1066 it paid tax for 16 hides. Land [for *** ploughs], of which 2 hides and 3 virgates are in lordship; 3 ploughs there; 5 slaves; 21 villagers
      and 10 smallholders with 8 ploughs. A mill which pays 15s; meadow, 10 acres; pasture 1 1/2 leagues long and 1 league wide. The value was and is £16. Earl Harold had taken this manor and Stour away
      from St Mary's before 1066, but King William restored them to its possession because in the Church itself was found a writ with the seal of King Edward ordering that they should be restored to the
      Church with Melcombe [Horsey] which the King still holds. Earl Harold himself also took away `PIDDLE' from the Church; the Count of Mortain holds it. [= ?19? Land of Shaftesbury Abbey =] <79a> ?20?
