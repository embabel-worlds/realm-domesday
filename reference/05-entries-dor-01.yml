    textEdition: William of Falaise holds SILTON from the King. Wulfward White held it before 1066. It paid tax for 8 hides. Land for 8 ploughs. In lordship 2 ploughs; 6 slaves; 8 villagers and 10 smallholders
      with 4 ploughs. 3 mills which pay 5s; meadow, 20 acres; woodland 1 league long and 1/2 league wide. The value was £11; now £6. William also holds with this land 1 hide and 1/2 virgate of land _. Land
      for 1 plough. 3 villagers have it there. Value 10s. Wulfward held this land in pledge before 1066 from a reeve of his. Further, with this land William also holds 1 hide _. Land for 1 plough, which
      is there, in lordship. Value 20s. Wulfward bought this hide from the Bishop of Exeter before 1066, but it did not belong to this manor. With this said land William also holds 3 hides in MILTON[-on-Stour],
      and Roger from him. Wihtnoth held them before 1066. Land for 1 1/2 ploughs. 5 smallholders with 1 plough. A mill which pays 15d; meadow, 8 acres; woodland 8 furlongs long and 2 furlongs wide. The
      value was and is 20s. [= ?35? Land of William of Falaise =] ?36? Land of William of Mohun
