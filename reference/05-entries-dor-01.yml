    name: '[Sturminster] Newton (Dorset 8,1)'
    holding: manor
    textEdition: St Mary's Church, Glastonbury, holds [Sturminster] NEWTON. Before 1066 it paid tax for 22 hides. Land for 35 ploughs. Besides this there is land for 14 ploughs in lordship there which has
