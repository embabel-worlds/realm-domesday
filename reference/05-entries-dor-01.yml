    textEdition: The King holds HINTON [Martell]. Countess Goda held it before 1066. It paid tax for 14 hides and 1 virgate of land. Land for 12 ploughs, of which 6 hides and 1 virgate of land are in lordship;
      1 plough there. 8 villagers and 14 smallholders have 3 ploughs. A mill which pays 10s; meadow, 37 acres; pasture 5 furlongs long and as wide; woodland 1 league long and 1/2 league wide. Value £13
      5s. Also of this land a priest held 1 hide in thaneland; he could go where he would with it; now it is in the King's lordship. Another priest held 2 1/2 hides of this land. The Bishop of Lisieux has
      one of these in lordship; value 20s. A priest of this manor has the other 1 1/2 hides; he has 2 ploughs there, with 4 villagers and 2 smallholders. A mill which pays 5s; meadow, 11 acres; woodland,
      1 furlong in length and 1/2 furlong in width; 11 houses in Wimborne [Minster]. Value of the whole 30s. This priest could go where he would with his land before 1066. Also of this land another priest
      living in `TARRANT' holds 1 hide and the third part of 1 hide. He has 3 villagers and 4 smallholders with 1 plough. Meadow, 1 acre; pasture, 5 furlongs in length and 1 furlong in width. Value 30s.
      Also of this land Wulfric [* the hunter *] holds 1 virgate of land; value 2s. Also of this land 1 1/2 hides and 1/2 virgate of land belong to Wimborne Church. Bishop Maurice holds them; he has 6 smallholders
      and 8 burgesses and a mill which pays 5s; meadow, 15 acres; pasture, 1/2 league in length and 4 furlongs in width. Value £6 7s 6d. [= ?[1]? Land of the King. King William holds it =] <76c> <76d> <75d>
