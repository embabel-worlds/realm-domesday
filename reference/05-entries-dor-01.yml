    holding: manor
    textEdition: The King holds BURTON [Bradstock], BERE [Regis], COLBER, SHIPTON [Gorge], BRADPOLE and CHIDEOCK. King Edward held them in lordship. It is not known how many hides are there and they did
      not pay tax before 1066. Land for 55 ploughs. In lordship 8 ploughs; 20 slaves; 41 villagers, 30 smallholders, 7 freedmen and 74 cottagers; between them they have 27 ploughs. 8 mills which pay £4
      35d; meadow, 111 acres; pasture 4 leagues long and as wide; woodland 3 leagues long and 1 league wide. [!1! 6 cobs; 9 cattle; 108 pigs; 800 sheep. !1!] This manor with its dependencies and customary
      dues pays one night's revenue. Scrubland at `HAWCOMBE' belongs to Burton [Bradstock] [and belonged] in such a way that before 1066 two parts of it were in the King's revenue and the third part, or
      the third oak, was Earl Edwin?'s; it now belongs to Frampton, a manor of Saint-Etienne of Caen. [= ?[1]? Land of the King. King William holds it. King Edward held it =]
