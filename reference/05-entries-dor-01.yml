    name: Swyre (Dorset 34,8)
    holding: manor
    textEdition: William [* Bellett *] holds SWYRE from William. Tholf [* the Dane *] held it before 1066. It paid tax for 9 hides. Land for 7 ploughs. In lordship 3 ploughs; 5 slaves; 5 villagers and 11
      smallholders with 3 ploughs. A mill which pays 16s; meadow, 30 acres; pasture 7 furlongs long and 1 furlong wide. The value was and is £9. In that village ^[Swyre]^ William holds a part of the land
      which never paid tax before 1066 but was in lordship and in the King's revenue. A King's reeve had leased it to Toxus [the priest?], then retook it into the King's hands. Toxus was put in possession
      of it again by King Edward, so he says, and so held it during King Edward's life and at the [time of his] death and in the time of ^[Earl]^ Harold. Previously it was pasture, now arable. [= ?34? Land
      of William of Eu =]
    text: William [Bellett] holds SWYRE from William. Tholf [the Dane] held it before 1066. It paid tax for 9 hides. Land for 7 ploughs. In lordship 3 ploughs; 5 slaves; 5 villagers and 11 smallholders
