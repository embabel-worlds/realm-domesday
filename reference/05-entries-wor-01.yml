    places: Witton
    name: Witton (Worcestershire 26,16)
    holding: manor
    textEdition: Urso also holds WITTON in Droitwich, and Gunfrid from him. The Church of Evesham held it before 1066. 1/2 hide. In lordship 1 plough; 2 slaves; 2 smallholders; 7 burgesses in Droitwich.
      1 1/2 salt-houses which pay 30d. The value was 20s; now 15s. One Wulfgeat gave this land to the Church of Evesham. He placed his grant upon the altar when his son, Alfgeat, became a monk there. This
      was done in the fifth year of King Edward's reign. But later on Abbot Alwin? leased this land to his [own] uncle for as long as the man should live. Later he died in [* Earl *] Harold's war against
      the Norsemen and the church recovered its land, before King William came to England. The Abbot held it as long as he lived, and his successor, Abbot Walter, likewise held it for more than 7 years.
      [= ?26? Land of Urso of Abetot =]
