    holding: dependency
    textEdition: 'To this manor belonged and belong GRAFTON, 3 1/2 hides; COOKSEY [Green], 2 1/2 hides; `WILLINGWICK''; 2 hides and 3 virgates; CHADWICH, 3 hides. In total, 12 hides, less 1 virgate. Five
      thanes of Earl Edwin held these lands: Erngeat [* son of Grim *], Alwin, Brictred, Frani [* son of Erngeat *], Alwold [* son of Erngeat *]; they could not withdraw from the lord of the manor. Now
      four men-at-arms hold these lands from Urso the sheriff: Roger, 3 1/2 hides; William, 2 1/2 hides; Walter, 2 hides and 3 virgates; Alfred [* of Marlborough *], 3 hides. In these lands, in lordship
      5 1/2 ploughs; 1 riding man and 29 smallholders who have 11 1/2 ploughs. 2 slaves; 6 ploughmen; 1 more plough would be possible. In `WILLINGWICK'' and CHADWICH are 3 leagues of woodland, but the King
      has put them in the Forest. In Droitwich 1 salt-house at 10s. In total, value before 1066 £6 13s; now 100s, in total. ^[Belongs to Bromsgrove]^ [= ?[1]? Land of the King. King William holds it =]'
