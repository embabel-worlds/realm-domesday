    holding: manor
    textEdition: In `ASH' Hundred The Bishop also holds [Sheriffs] LENCH, and Urso [* the sheriff *] from him. 4 hides which pay tax. Two thanes held 2 of these; Aelfeva, a woman, held the other 2. They
      could go where they would; they held them as 3 manors. In lordship 2 ploughs; 6 villagers, 2 smallholders and 4 slaves with 2 ploughs; 8 more ploughs possible. Woodland which pays 2s. Value before
      1066, 110s; later 30s; now 42s. Gilbert son of Turold gave 2 hides of this land to the Church of Evesham for the soul of Earl William, with King William's consent; accordingly, one monk was placed
      in the church. Abbot Alwy gave 1 gold mark to King William for the other 2 hides. He assigned this land to the church for his [own] soul, as Gilbert son of Turold, who collected the gold for the King's
      use, testifies. The church itself had been in possession of these 4 hides for many years, until the Bishop of Bayeux took them from the church and gave them to Urso [* the sheriff *]. [= ?11? Land
      of the Bishop of Bayeux =] ?12? Land of St Guthlac's
