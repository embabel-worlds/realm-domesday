    holding: manor
    textEdition: 'In `CAME'' Hundred William son of Ansculf holds SELLY [Oak] from the King, and Wibert from him. Wulfwin held it. One outlier, BARTLEY [Green], belongs there. In total, 4 hides. [***].
      In lordship 1/2 plough; 2 villagers and 9 smallholders with 4 ploughs. A wood 1 league long. Value before 1066, 100s; now 60s. Wulfwin bought this manor before 1066 from the Bishop of Chester, for
      the lives of three men. When he was ailing and had come to the end of his life, he summoned his son, the Bishop [of] Li[chfield?], his wife and many of his friends, and said: `Hear me, my friends,
      I desire that my wife hold this land which I bought from the church so long as she lives, and that after her death the church from which I received it should accept it back. Let whoever shall take
      it away from it be excommunicated''. The more important men of the whole County testify that this was so. [= ?23? Land of William son of Ansculf =] <177b>'
