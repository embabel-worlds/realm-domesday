    textEdition: '[In `CRESSLOW'' Hundred] King William holds KIDDERMINSTER in lordship, with 16 outliers: WANNERTON, TRIMPLEY, HURCOTT, FRANCHE, another [estate called] FRANCHE, {BRISTITUNE}, HABBERLEY,
      {FASTOCHESFELDE}, WRIBBENHALL, RIBBESFORD, another [estate called] RIBBESFORD, SUTTON, OLDINGTON, MITTON, {TEULESBERGE}, {SUDUUALE}. In these lands, including the manor, 20 hides. The whole of this
      manor was waste. In lordship 1 plough; 20 villagers and 30 smallholders with 18 ploughs; a further 20 more ploughs possible. 2 male and 4 female slaves. 2 mills at 16s; 2 salt-houses at 30s; a fishery
      at 100d; woodland at 4 leagues. In this manor the reeve holds the land of one riding man; he has 1 plough and a mill at 5 {orae}. To this manor belongs 1 house in Droitwich and another in Worcester
      which pay 10d. The whole manor paid £14 in revenue before 1066; now it pays £10 4s by weight. The King has placed the woodland of this manor in the Forest. Of this manor''s land William holds 1 hide
      and the land of one riding man. He has 1 villager and 8 smallholders who have 4 1/2 ploughs. Value 11s. Also of this land Aiulf <of Wolverton> holds 1 virgate. 1 plough and 2 slaves there. Value 2s.
      [= ?[1]? Land of the King. King William holds it. King Edward held it =]'
