    textEdition: In this County if anyone has knowingly broken the peace which the King has given with his hand, he is judged an outlaw. If anyone has knowingly broken the King's peace which the sheriff
      gives, he will be fined 100s. A man who has committed highway robbery is fined 100s; a man who has committed house-breaking, 100s; a man who has committed rape pays no penalty other than corporal
      punishment. The King has these forfeitures from this County, with the exception of the land of St Peter's, Westminster, to which King Edward granted whatever [rights] he had there, as the County states.
      ^[Worcester]^
