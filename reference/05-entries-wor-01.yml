    textEdition: Gilbert son of Turold holds COMBERTON. Edric, a free man, held it. 9 hides. In lordship 1 plough; a priest, 7 villagers and 2 smallholders with 4 ploughs. 2 male and 2 female slaves. Meadow,
      30 acres. A Frenchman holds 1 hide. He has 1 plough, 2 male slaves, 1 female. Edric also performed the same service as other free men. The value was £6; now 70s. To this [manor] belongs one outlier
      of 10 hides [* in STRENSHAM *]. Ulf and Asgot held it and reaped for 1 day a year in the lord's meadow and served like the others. Now the said Gilbert holds these 10 hides. He has 3 ploughs in lordship;
      14 villagers and 6 smallholders with 11 ploughs. 4 male slaves, 1 female. A mill which pays 30 packloads of corn; meadow, 30 acres; woodland 1 league long and as wide. The value of the whole was £10;
      now 100s. ^[Lay and lies in Pershore]^ [= ?8? Land of St Peter's, Westminster =]
