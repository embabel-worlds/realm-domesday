    figuresSource: Hull coding
    name: Worcestershire 2,1
    textEdition: ^[In `OSWALDSLOW' Hundred]^ St Mary's Church of Worcester has one Hundred, which is called `OSWALDSLOW', in which lie 300 hides. By an arrangement of ancient times the Bishop of this church
      has from them all the payments of the Jurisdictions, all customary dues there which belong to the supplies of the household, both the King's service and his own, so that no sheriff can have any suit
      there, neither in any plea nor in any other case whatever. The whole County confirms this. The said 300 hides were [part] of the lordship itself of the church, and if any [part] of them was allotted
      or leased to any man, in whatever manner, to serve the Bishop therefrom, the man who held such land leased to him, could not keep back from it any customary due at all for himself, except through
      the Bishop, nor keep the land except until the completion of the time arranged between them; nor could he turn elsewhere with this land. [= ?2? Land of the Church of Worcester =] <172d>
    text: '[In `OSWALDSLOW'' Hundred] St Mary''s Church of Worcester has one Hundred, which is called `OSWALDSLOW'', in which lie 300 hides. By an arrangement of ancient times the Bishop of this church
      has from them all the payments of the Jurisdictions, all customary dues there which belong to the supplies of the household, both the King''s service and his own, so that no sheriff can have any suit
      there, neither in any plea nor in any other case whatever. The whole County confirms this. The said 300 hides were [part] of the lordship itself of the church, and if any [part] of them was allotted
      or leased to any man, in whatever manner, to serve the Bishop therefrom, the man who held such land leased to him, could not keep back from it any customary due at all for himself, except through
      the Bishop, nor keep the land except until the completion of the time arranged between them; nor could he turn elsewhere with this land.'
