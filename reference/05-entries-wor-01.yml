      5 villagers and 8 smallholders with 3 ploughs. 4 male and 3 female slaves. A mill at 10s; meadow, 16 acres. Value 40s. {Turstin} son of Rolf holds 3 hides of this land. Brictric held them. In lordship
      2 ploughs; 7 villagers and 4 smallholders with 1 plough. 4 male and 3 female slaves. Meadow, 16 acres; woodland 2 furlongs long and as wide. Value 60s. These two, Dunning and Brictric, reaped for
