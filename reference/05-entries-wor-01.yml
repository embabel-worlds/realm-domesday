    name: Worcestershire 9,7
    textEdition: ^[In PERSHORE Hundred]^ The County states that the Church of Pershore should have Church tax from all the 300 hides; namely, from each and every hide where a freeman lives one packload
      of corn at Martinmas, and if he has more hides they should be free; and if that date should be missed the man who has kept back the corn shall pay for it elevenfold; however, first he shall pay what
      he owes. The Abbot of Pershore himself has the forfeiture from his 100 hides just as he should have from his own land. From the other 200 hides the Abbot himself has [his] packload and payment in
      full and the Abbot of Westminster has the forfeiture because it is his land. The Abbot of Evesham has [it] likewise from his own land, and all the others likewise from their lands. [= ?9? Land of
      St Mary's of Pershore =] ?10? Land of the Church of Evesham
    text: '[In PERSHORE Hundred] The County states that the Church of Pershore should have Church tax from all the 300 hides; namely, from each and every hide where a freeman lives one packload of corn
      at Martinmas, and if he has more hides they should be free; and if that date should be missed the man who has kept back the corn shall pay for it elevenfold; however, first he shall pay what he owes.
      The Abbot of Pershore himself has the forfeiture from his 100 hides just as he should have from his own land. From the other 200 hides the Abbot himself has [his] packload and payment in full and
      the Abbot of Westminster has the forfeiture because it is his land. The Abbot of Evesham has [it] likewise from his own land, and all the others likewise from their lands. Land of the Church of Evesham'
