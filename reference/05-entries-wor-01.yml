    name: Worcestershire 2,80
    textEdition: In all these manors there cannot be more ploughs than is stated. The Shire states that from each and every hide of land, whether free or villagers', which belongs to the Church of Worcester,
      the Bishop should have at Martinmas one packload of corn of the better sort which grows there. But if that day has passed and the corn has not been handed over, whoever has kept it back shall hand
      over the corn, and shall pay elevenfold; and in addition the Bishop shall receive the forfeiture just as he should have from his land. [= ?2? Land of the Church of Worcester =] <174b>
