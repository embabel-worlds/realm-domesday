# The questions a person types at Domesday, and what a correct answer must satisfy.
# Run by tests/ask_battery.py through the same ask surface the app uses (kg_ask).
#
# answerable — expect one of the spec's kinds:
#   matchesView: {name, column, args}   the ask's figure equals the view's top-row figure. Money may
#                                       come back in pence or pounds; either reconciles.
#   nonEmpty: true / minRows: n         a floor, where no single figure is the answer.
#
# unanswerable — the adversarial half: questions this realm cannot answer, asked `repeat` times.
#   Each run must reference no property the live schema does not declare (a fabrication), and, where
#   `noFigure` is set, must not put a positive number forward as the answer.

answerable:
  # Questions a plausible query gets wrong, checked against the reference data: a hundred summed through its
  # places counts an entry once per place, and Oswaldslow leads only when its detached parts (places in GLS and
  # WAR) count; Hull spells Earl Harold three ways; Shrewsbury and Oxford are boroughs, not manors.
  - question: "Which hundred of Worcestershire had the most households?"
    category: traps
    expect: { name: Oswaldslow }
  - question: "How many households were there in Oswaldslow hundred in Worcestershire?"
    category: traps
    expect: { value: 1182 }
  - question: "How many Yorkshire entries were recorded as waste?"
    category: traps
    expect: { value: 520 }
  - question: "Who ended up with most of Earl Harold's manors after the Conquest?"
    category: traps
    expect: { name: King William }
  - question: "What was the most valuable manor in 1086?"
    category: traps
    expect: { name: Neatham }
  - question: "Which woman held the most entries as a tenant-in-chief in 1086?"
    category: traps
    expect: { name: Countess Judith }
  - question: "What were Bishop Odo of Bayeux's lands in Kent worth in 1086?"
    category: traps
    expect: { value: 374602, money: true }
  - question: "How many villagers were there in Worcestershire?"
    expect: { matchesView: { name: DomesdayCountyFigures, column: villagers, args: { county: WOR } } }
  - question: "How many slaves were recorded in Gloucestershire?"
    expect: { matchesView: { name: DomesdayCountyFigures, column: slaves, args: { county: GLS } } }
  - question: "How many mills were there in Kent?"
    expect: { matchesView: { name: DomesdayCountyFigures, column: mills, args: { county: KEN } } }
  - question: "How many plough teams were there in Lincolnshire in 1086?"
    expect: { matchesView: { name: DomesdayCountyFigures, column: ploughTeams, args: { county: LIN } } }
  - question: "How many Domesday entries are there for Yorkshire?"
    expect: { matchesView: { name: DomesdayCountyFigures, column: entries, args: { county: YKS } } }
  - question: "How many households did Devon have in Domesday?"
    expect: { matchesView: { name: DomesdayCountyFigures, column: households, args: { county: DEV } } }
  - question: "Who was the richest landholder in 1086?"
    expect: { matchesView: { name: DomesdayGreatestLandholders, column: tenantInChief } }
  - question: "Who held the most valuable land before the Conquest?"
    expect: { matchesView: { name: DomesdayGreatestLords1066, column: lord1066 } }
  - question: "Which county had the most waste?"
    expect: { matchesView: { name: DomesdayWaste, column: countyOrEntry } }
  - question: "Which county was the richest in 1086?"
    expect: { matchesView: { name: DomesdayCountySummary, column: county } }
  - question: "What was Abberley worth in 1086?"
    expect: { matchesView: { name: DomesdayPlaceEntries, column: value1086Pence, args: { placeId: "1" } } }
  - question: "How many villagers lived at Abberley?"
    expect: { matchesView: { name: DomesdayPlaceEntries, column: villagers, args: { placeId: "1" } } }
  - question: "Who held Abberley before 1066?"
    expect: { matchesView: { name: DomesdayPlaceEntries, column: lords1066, args: { placeId: "1" } } }
  - question: "Who was the tenant-in-chief of Abberley in 1086?"
    expect: { matchesView: { name: DomesdayPlaceEntries, column: tenantsInChief, args: { placeId: "1" } } }
  - question: "How much was Count Robert of Mortain's land worth in 1086?"
    expect: { matchesView: { name: DomesdayPersonSummary, column: value1086Pence, args: { name: "Count Robert/of Mortain" } } }
  - question: "How many entries did Bishop Odo of Bayeux hold as tenant-in-chief?"
    expect: { matchesView: { name: DomesdayPersonSummary, column: entries, args: { name: "Bishop Odo/of Bayeux" } } }
  - question: "Who took over Earl Harold's lands after the Conquest?"
    expect: { minRows: 3 }
  - question: "Which women held land in Domesday?"
    expect: { minRows: 5 }
  - question: "Where were the castles in Domesday?"
    expect: { minRows: 10 }
  - question: "Which manors lost the most value between 1066 and 1086?"
    expect: { minRows: 5 }
  - question: "List the places in Domesday called Norton"
    expect: { minRows: 20 }
  - question: "What did Ralph of Tosny hold?"
    expect: { minRows: 5 }
  - question: "how many churches in worcestershire"
    expect: { matchesView: { name: DomesdayCountyFigures, column: churchEntries, args: { county: WOR } } }
  # Asked by a user, 2026-10-18: the generator filtered countyName = 'England' and summed nothing.
  - question: "how many goats there are in england"
    expect: { matchesView: { name: DomesdayCountyFigures, column: goats, args: {} } }
  - question: "How many villagers were there in England altogether?"
    expect: { matchesView: { name: DomesdayCountyFigures, column: villagers, args: {} } }
  # Asked by a user, 2026-10-18.
  - question: "which lords rule the most peasants"
    # 1066 or 1086 are both fair readings of "rule"; the king of either is right
    expect: { anyName: ["King William", "King Edward"] }
  - question: "which county has the most people"
    expect: { matchesView: { name: DomesdayCountyRanking, column: county, args: { measure: households } } }
  - question: "how many people total in england"
    # Asked by a user, 2026-10-18: a bare 214,191.5 is households, not people — the answer must say so and estimate
    expect: { matchesView: { name: DomesdayPopulation, column: [households, estimatedPeopleLow, estimatedPeopleHigh] }, columnsLike: [estimat] }
  - question: "which hundred of Worcestershire was worth most in 1086"
    expect: { matchesView: { name: DomesdayHundredSummary, column: hundred, args: { county: WOR } } }
  # The rules, the measures, the text and today — each answer a view or a fact checked by hand.
  - question: "Who succeeded Wulfmer at Abberley?"
    category: rules
    expect: { name: Ralph of Tosny }
  - question: "Who were Earl Hugh's men in Cheshire?"
    category: rules
    expect: { anyName: [William Malbank, Robert of Rhuddlan, Robert son of Hugh, William son of Nigel] }
  - question: "Which English lords kept their land after the Conquest?"
    category: rules
    expect: { anyName: [Thorkell of Warwick, Gospatric, Kolgrimr, Osbern son of Richard, Alfred of Marlborough] }
  - question: "Which hundreds were laid waste?"
    category: rules
    expect: { minRows: 5 }
  - question: "What share of Worcestershire did the Church hold in 1086?"
    category: measures
    expect: { matchesView: { name: DomesdayWhoHeldTheLand, column: churchPercent, args: { county: WOR } } }
  - question: "What share of England's land value did women hold in 1066?"
    category: measures
    expect: { matchesView: { name: DomesdayWomenBeforeAfter, column: sharePercent } }
  - question: "Which county was least fully ploughed?"
    category: measures
    expect: { matchesView: { name: DomesdayPloughStocking, column: county } }
  - question: "Which county has the most entries that mention vineyards?"
    category: text
    expect: { matchesView: { name: DomesdayTextMentionsByCounty, column: county, args: { word: vineyard } } }
  - question: "How many entries in Cambridgeshire mention eels?"
    category: text
    expect: { value: 42 }
  - question: "How many households does Abberley parish have today?"
    category: now
    expect: { value: 288 }
  - question: "Which parish has grown the most since Domesday?"
    category: now
    expect: { name: Sutton Coldfield }

  # Little Domesday and the text, once refused, now held.
  - question: "How many villagers were there in Essex?"
    category: little-domesday
    expect: { matchesView: { name: DomesdayCountyFigures, column: villagers, args: { county: ESS } } }
  - question: "Were there more slaves before or after the Conquest?"
    category: little-domesday
    expect: { matchesView: { name: DomesdayBeforeAndAfter, column: [slaves1066Comparable, slaves1086Comparable] } }
  - question: "Did the number of villagers in Norfolk fall after 1066?"
    category: little-domesday
    expect: { matchesView: { name: DomesdayBeforeAndAfter, column: [villagers1066Comparable, villagers1086Comparable], args: { county: NFK } } }
  - question: "What is the modern population of Abberley?"
    category: now
    expect: { value: 786 }
  - question: "Quote the Domesday text for Abberley"
    category: text
    expect: { nonEmpty: true }

unanswerable:
  - question: "What was the name of the priest at Abberley?"
    repeat: 3
  - question: "Who held Abberley in 1200?"
    repeat: 3
  - question: "How many acres of arable land were there in Kent?"
    repeat: 3
