name: realm-domesday
description: |
  Domesday Book as a graph you can query: the 1086 survey of England, entry by entry, from the
  Hull Domesday Project's database and its transcription of the Phillimore translation. Every
  entry of Great Domesday (18,174) and Little Domesday — Essex, Norfolk and Suffolk (4,397) — with
  what it says and its figures: households by class, plough teams, ploughlands, tax in geld units,
  annual value in 1066 and 1086 in pence, mills, meadow, woodland, churches, castles, waste. Every
  place it names (14,334, with OS grid references) and every person and institution (14,042, one
  record per name per county), and who held each entry by role: the lord in 1066, the
  tenant-in-chief and the tenant in 1086. Each place is joined to the parish (Census 2021) and
  neighbourhood (deprivation 2025) it lies in today. Ask who gained and who lost at the Conquest,
  which counties were wasted, where the mills were, and what a village is now.

  Great Domesday's figures are Hull's coding; Little Domesday's are parsed from the translation.
  Both are reconciled against Open Domesday; the agreement per field is in the README.

  Keyless. Nothing to configure. Data CC BY-NC-SA (Professor J.J.N. Palmer, University of Hull).
version: 0.1.0
# Experimental: new, and its figures are parsed — they agree with Open Domesday's to between 81%
# (lord's plough teams) and 99% (villagers, smallholders) per field, measured on 450 manors.
maturity: experimental
