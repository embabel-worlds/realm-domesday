      description: "What the entry is. `manor` for a rural holding (most entries); `urban` for a borough, its section or its own entry (Shrewsbury, Oxford); `claim` and `summary` for a line of the claims or Yorkshire summary that restates a holding entered elsewhere; `fief heading`, `rubric`, `index of landholders`, `customs`, `Wales`. A question about manors means kind `manor`; never also filter on a value being stated unless the question asks for value."
