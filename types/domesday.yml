# Domesday Book as a graph: five stored types, seeded from reference/ and never changed.
#
#   DomesdayCounty ◀─IN─ DomesdayHundred ◀─IN─ DomesdayPlace ◀─DESCRIBES / INCLUDES─ DomesdayEntry ─IN─▶ DomesdayCounty
#                               ▲                                                          │
#                               └─────────────────────── IN_HUNDRED ───────────────────────┤
#        LORD_1066, OVERLORD_1066, TENANT_IN_CHIEF, TENANT_1086, … ─────────────────────────┴──▶ DomesdayPerson
#
# An ENTRY is one numbered section of the Phillimore edition ("Worcestershire 15,8") and carries the
# figures. A PLACE is a vill in Hull's gazetteer; an entry DESCRIBES the place it is about,
# INCLUDES the dependencies named within it, and is IN_HUNDRED once for each hundred those places
# lie in. A PERSON is Hull's index of names, one record per name per county; the edge from an
# entry says the role.
#
# Both books: Great Domesday's 31 counties from Hull's coded database, and Little Domesday's Essex,
# Norfolk and Suffolk, whose entries and figures are parsed from Hull's transcription of the
# translation (an entry's `edition` and `figuresSource` say which). Little Domesday alone records
# 1066 and when-acquired population and livestock (`villagers1066`, `slaves1066`, …).

- name: DomesdayCounty
  description: "A Domesday county, keyed by Hull's three-letter code (`WOR`, `YKS`). `inGreatDomesday` is false for Essex, Norfolk and Suffolk, which are in Little Domesday; their entries are here, their figures parsed from the translation."
  userAnchor: false
  properties:
    code:
      identity: true
      description: "Hull's county code, e.g. `WOR` Worcestershire, `YKS` Yorkshire, `KEN` Kent. Identity."
    name: "The county's name, e.g. `Worcestershire`."
    circuit:
      type: int
      description: "The Domesday commissioners' circuit, 1–7. Circuit 7 is Little Domesday (Essex, Norfolk, Suffolk)."
    inGreatDomesday:
      type: boolean
      description: "True when the county's entries are in Great Domesday, and so in this realm."

- name: DomesdayHundred
  description: "A hundred (a wapentake in the Danelaw), the subdivision of a county Domesday was surveyed by. IN its DomesdayCounty. Its entries reach it by IN_HUNDRED, once each: sum a hundred's figures over (e:DomesdayEntry)-[:IN_HUNDRED]->(h), never through DESCRIBES and the places, which counts an entry once per place. Filter a county's hundreds by the HUNDRED's county (`h.countyName = 'Worcestershire'`): an entry's IN_HUNDRED points at its own county's hundred of that name, so a detached part (Oswaldslow's land in Gloucestershire places) counts with the hundred it belonged to."
  userAnchor: false
  properties:
    hundredId:
      identity: true
      description: "County code and hundred name, e.g. `WOR:Doddingtree`. Identity."
    name: "The hundred's name, e.g. `Doddingtree`."
    county: "County code, e.g. `WOR`."
    countyName: "County name, e.g. `Worcestershire`. List a county's hundreds with `h.countyName = 'Worcestershire'`."

- name: DomesdayPlace
  description: "A place Domesday names — a vill, in Hull's modern spelling (`Abberley`, `Milton Keynes`). IN its DomesdayHundred; NOW_IN the ModernParish and NOW_IN_NEIGHBOURHOOD the ModernNeighbourhood its grid square's centre lies in today. Reached from the entries about it by DESCRIBES, and from entries that name it as a dependency by INCLUDES. Many names recur: there are several Abbertons and dozens of Nortons, so expect more than one place per name and tell them apart by county. Find by name with toLower(p.name) CONTAINS 'norton'."
  userAnchor: false
  properties:
    placeId:
      identity: true
      description: "Hull's place id. Identity."
    name: "The place's modern name, e.g. `Abberley`."
    county: "County code, e.g. `WOR`."
    countyName: "County name, e.g. `Worcestershire`."
    hundred: "The hundred's name, when Hull records one."
    area: "A larger area the place lies in, when Hull records one, e.g. `West Riding`, `Kesteven`."
    locationNote: "Hull's note on where the place is, when it is not simply its grid square, e.g. `in Wales`."
    gridRef: "OS grid reference of its 1 km square, e.g. `SO7567`. Absent when Hull could not locate the place."
    gridRefMark: "A mark Hull put after the grid reference, `*` or `!`. The Explorer's help does not say what it means; the square is plotted all the same."
    lat:
      type: number
      description: "Latitude of the centre of its grid square, WGS84."
    lng:
      type: number
      description: "Longitude of the centre of its grid square, WGS84."
    entryCount:
      type: int
      description: "How many entries name this place, as subject or dependency."
    inLittleDomesday:
      type: boolean
      description: "True for places in Essex, Norfolk and Suffolk, which Little Domesday describes."
    wikidataId: "The place's Wikidata QID, through its Open Domesday settlement id (P3118). Absent for about four places in ten."
    wikipedia: "Its English Wikipedia article title (underscores), through Wikidata."
    geonamesId: "Its GeoNames id, through Wikidata."
    visionOfBritainPlaceId: "Its Vision of Britain place id, through Wikidata — visionofbritain.org.uk/place/<id>."
    manorialDocumentsRegisterId: "The National Archives' Manorial Documents Register id of the manor, through Wikidata — where the manor's records are held today."
    openDomesdayPath: "Its Open Domesday page path, e.g. `SO7468/abberley` — opendomesday.org/place/<path>/."
    parishCode: "The ONS code of the civil parish (or unparished area) its grid square's centre falls in today, by point-in-polygon on ONS boundaries."
    parishName: "That parish's name today."
    ladCode: "The ONS code of its local authority district today."
    ladName: "That district's name today."
    lsoa21Code: "The 2021 Lower Layer Super Output Area its centre falls in — the key to the 2025 indices of deprivation."
    modernPlaceName: "The nearest place-name in the ONS Index of Place Names 2024."
    modernPlaceDistanceKm:
      type: number
      description: "How far that modern place is from the Domesday grid square's centre, in km."
    likelyLost:
      type: boolean
      description: "True when no Wikidata settlement and no same-named modern place within 2 km survives — a candidate lost or deserted village. A candidate, not a finding."

- name: DomesdayPerson
  description: "A person or institution Domesday names, from Hull's index: one record per name PER COUNTY, so a magnate who held in twenty counties is twenty records sharing a name (`Robert, Count of Mortain`). To ask about a person across England, match on `canonicalName` and aggregate by it: `name` keeps Hull's editorial brackets, so one man is indexed as `Earl Harold`, `(Earl) Harold` and `{Earl} Harold`, and grouping by `name` splits him. A name is not always one person — there are many Alwins — so a plain name across counties may be several people. Reached from entries by role: LORD_1066, OVERLORD_1066, MAN_OF_OVERLORD_1066, HELD_PART_1066, TENANT_IN_CHIEF, TENANT_1086, SUBTENANT_1086, HELD_PART_1086, URBAN_HOLDER_1066, URBAN_HOLDER_1086, HOLDER_1070, CLAIMANT, DEFENDANT, OFFICIAL, NAMES."
  userAnchor: false
  examples:
    # STEERING — who held land is an EDGE from the entry, by role, and wealth is the entries' value:
    # 1086 is TENANT_IN_CHIEF (value1086), before the Conquest is LORD_1066 (value1066). Group by canonicalName.
    - q: "who held the most valuable land in 1086"
      cypher: |
        MATCH (e:DomesdayEntry)-[:TENANT_IN_CHIEF]->(p:DomesdayPerson)
        RETURN p.canonicalName AS tenantInChief, sum(e.value1086) AS value1086Pence, count(DISTINCT e) AS entries
        ORDER BY value1086Pence DESC LIMIT 10
    # STEERING — peasants are villagers + smallholders + cottagers + slaves (never plough teams); before the
    # Conquest the holder is LORD_1066, in 1086 TENANT_IN_CHIEF:
    - q: "which English lords had the most peasants before 1066"
      cypher: |
        MATCH (e:DomesdayEntry)-[:LORD_1066]->(p:DomesdayPerson)
        RETURN p.canonicalName AS lord, sum(coalesce(e.villagers, 0) + coalesce(e.smallholders, 0) + coalesce(e.cottagers, 0) + coalesce(e.slaves, 0)) AS peasants
        ORDER BY peasants DESC LIMIT 10
    # STEERING — who took over someone's land: the 1066 lord and the 1086 tenant-in-chief of the SAME entry:
    - q: "who took over the lands of Earl Example after the Conquest"
      cypher: |
        MATCH (l:DomesdayPerson)<-[:LORD_1066]-(e:DomesdayEntry)-[:TENANT_IN_CHIEF]->(t:DomesdayPerson)
        WHERE toLower(l.canonicalName) CONTAINS 'earl' AND toLower(l.canonicalName) CONTAINS 'example'
        RETURN t.canonicalName AS tenantInChief1086, count(DISTINCT e) AS entries ORDER BY entries DESC
    # STEERING — a title is part of the name and is matched case-insensitively (`Bishop Odo/of Bayeux`):
    - q: "which bishop was the richest tenant-in-chief"
      cypher: |
        MATCH (e:DomesdayEntry)-[:TENANT_IN_CHIEF]->(p:DomesdayPerson) WHERE toLower(p.canonicalName) CONTAINS 'bishop'
        RETURN p.canonicalName AS bishop, sum(e.value1086) AS value1086Pence ORDER BY value1086Pence DESC LIMIT 1
    # STEERING — succession is the DERIVED edge SUCCEEDED (the realm's rules conclude it: the 1086 tenant-in-chief
    # holding at least half of a 1066 lord's entries in a county), never re-derived by hand:
    - q: "who succeeded Example after the Conquest / who was Example's antecessor"
      cypher: |
        MATCH (t:DomesdayPerson)-[s:SUCCEEDED]->(l:DomesdayPerson)
        WHERE toLower(t.canonicalName) CONTAINS 'example' OR toLower(l.canonicalName) CONTAINS 'example'
        RETURN l.canonicalName AS antecessor1066, t.canonicalName AS successor1086, l.countyName AS county, s.succeededEntries AS entries
        ORDER BY entries DESC
    # STEERING — a lord's men are the DERIVED edge MAN_OF (a sub-tenant holding two or more entries of him):
    - q: "who were Earl Example's men"
      cypher: |
        MATCH (u:DomesdayPerson)-[m:MAN_OF]->(t:DomesdayPerson)
        WHERE toLower(t.canonicalName) CONTAINS 'earl' AND toLower(t.canonicalName) CONTAINS 'example'
        RETURN u.canonicalName AS man, t.countyName AS county, m.manOfEntries AS entries ORDER BY entries DESC
    # STEERING — who kept land through the Conquest is the DERIVED label ConquestSurvivor:
    - q: "which English lords kept their land after the Conquest"
      cypher: |
        MATCH (p:ConquestSurvivor)
        RETURN p.canonicalName AS survivor, p.countyName AS county, p.survivorEntries1086 AS entries1086 ORDER BY entries1086 DESC
    # STEERING — how many manors someone held is a COUNT of kind `manor` entries, with no condition on value:
    - q: "how many manors did Earl Example hold in 1086"
      cypher: |
        MATCH (e:DomesdayEntry)-[:TENANT_IN_CHIEF]->(p:DomesdayPerson)
        WHERE toLower(p.canonicalName) CONTAINS 'earl' AND toLower(p.canonicalName) CONTAINS 'example' AND e.kind = 'manor'
        RETURN count(DISTINCT e) AS manors
    # STEERING — what someone's lands were WORTH is ONE figure, the sum of their entries' values; never list the lands:
    - q: "what were Bishop Example's lands in Exampleshire worth in 1086"
      cypher: |
        MATCH (e:DomesdayEntry)-[:TENANT_IN_CHIEF]->(p:DomesdayPerson)
        WHERE toLower(p.canonicalName) CONTAINS 'bishop' AND toLower(p.canonicalName) CONTAINS 'example' AND e.countyName = 'Exampleshire'
        RETURN sum(e.value1086) AS value1086Pence, count(DISTINCT e) AS entries
    # STEERING — "ruled the most peasants / people" is the households of the entries a holder held:
    - q: "which lords had the most people on their land in 1086"
      cypher: |
        MATCH (e:DomesdayEntry)-[:TENANT_IN_CHIEF]->(p:DomesdayPerson)
        RETURN p.canonicalName AS lord, sum(e.households) AS households ORDER BY households DESC LIMIT 10
    - q: "who held Exampleton before 1066"
      cypher: |
        MATCH (pl:DomesdayPlace)<-[:DESCRIBES]-(e:DomesdayEntry)-[:LORD_1066]->(p:DomesdayPerson)
        WHERE toLower(pl.name) = 'exampleton'
        RETURN pl.countyName AS county, e.ref AS ref, p.canonicalName AS lord1066
  properties:
    personId:
      identity: true
      description: "Hull's name id. Identity."
    name: "The name as Hull indexes it, brackets and all, e.g. `Ralph of Tosny`, `(Earl) Harold`, `Hugh {of Bolbec}`. For display; match and group on canonicalName."
    wikipediaSearch: "The name a Wikipedia search is given for this person: the first of Hull's `/` alternatives in the canonical name."
    wikipedia: "The person's English Wikipedia article title (underscores), when the match was checked by hand. Absent for most people."
    wikidataId: "The person's Wikidata QID, when the match was checked by hand."
    odnbId: "The person's Oxford Dictionary of National Biography article id, when Wikidata gives one (the dictionary itself is by subscription)."
    linkConfidence: "`high` or `medium`: how sure the hand-checked Wikidata match is (data/people-wikidata.csv gives the reason)."
    canonicalName: "The name with Hull's editorial brackets dropped and their words kept, e.g. `Earl Harold`, `Earl Hugh of Chester`, `Bishop Odo/of Bayeux`. Match and group a person on THIS."
    county: "County code of the entries this record covers, when Hull gives one."
    countyName: "County name, when Hull gives one."
    gender:
      description: "`male`, `female` or `unknown`, as Hull codes it."
    isInstitution:
      type: boolean
      description: "True for a church, abbey or other institution rather than a person."
    entryCount:
      type: int
      description: "How many entries name this record, in any role."

- name: DomesdayEntry
  description: "NOT RECORDED in Domesday, so never answer with a proxy — horses (only cobs, uncounted), ages, women or children as such, wages or earnings, anything between 1086 and today, the name of any peasant; `valueLater` is the value WHEN ACQUIRED (between 1066 and 1086), never a later year; `ploughlands` is land for so many ploughs, not acres. For those, return WHERE false. TODAY is held apart, for the places Domesday names only: a place NOW_IN its ModernParish (Census 2021) and NOW_IN_NEIGHBOURHOOD its ModernNeighbourhood (deprivation 2025). One entry of Domesday Book — Great Domesday, or Little Domesday for Essex, Norfolk and Suffolk (`edition`) — as the Phillimore edition numbers it (`ref`: `Worcestershire 15,8`). Only Little Domesday counts people and stock for 1066 and for when acquired: those counts are on DomesdayFigures, reached by FIGURES_1066 and FIGURES_WHEN_ACQUIRED — the entry's own figures are 1086. A before-and-after question about PEOPLE can be answered for East Anglia alone. The figures are parsed from the entry's coded clauses; an absent figure means the entry does not state it, which is NOT zero. Money is in PENCE: £1 = 20s = 240d, so value1086 2520 is £10 10s. Edges: DESCRIBES the place it is about, INCLUDES the dependencies it names, IN its county, IN_HUNDRED each hundred it is about (once each — the path for a hundred's figures), and one edge per person by role — LORD_1066 (held the manor before the Conquest), TENANT_IN_CHIEF (held it of the king in 1086), TENANT_1086 (held it of the tenant-in-chief in 1086), and the rest listed on DomesdayPerson."
  userAnchor: false
  examples:
    # STEERING — every figure (villagers, slaves, mills, plough teams, households, value) is a property
    # of DomesdayEntry, never of DomesdayPlace or DomesdayCounty, and a county is filtered by NAME:
    - q: "how many smallholders were recorded in Somerset"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE e.countyName = 'Somerset'
        RETURN sum(e.smallholders) AS smallholders
    # STEERING — "in England" / "in Domesday" / "altogether" is every entry: no county filter at all:
    - q: "how many oxen were there in England"
      cypher: |
        MATCH (e:DomesdayEntry)
        RETURN sum(e.ploughTeams) AS ploughTeams, count(e) AS entries
    # STEERING — a county's totals come straight from its entries: no join to a holder (an entry naming no
    # lord would drop out) and none to places (an entry about two places would count twice):
    - q: "what was Exampleshire worth before the Conquest"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE e.countyName = 'Exampleshire'
        RETURN sum(e.value1066) AS value1066Pence
    # STEERING — population is `households`, already the total of every class; isWaste is a flag, so waste is counted:
    - q: "what was the population of Exampleshire and how much of it was waste"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE e.countyName = 'Exampleshire'
        RETURN sum(e.households) AS households, sum(CASE WHEN e.isWaste THEN 1 ELSE 0 END) AS wasteEntries
    # STEERING — the whole of England: these questions take NO county filter, never countyName = 'England':
    - q: "what was England worth in 1086"
      cypher: |
        MATCH (e:DomesdayEntry)
        RETURN sum(e.value1086) AS value1086Pence
    - q: "how many slaves were there in England altogether"
      cypher: |
        MATCH (e:DomesdayEntry)
        RETURN sum(e.slaves) AS slaves
    # STEERING — the richest manor in England: name the PLACE (e.places), not only the ref:
    - q: "which was the most valuable manor in 1086"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE e.kind = 'manor' AND e.value1086 IS NOT NULL
        RETURN e.places AS manor, e.countyName AS county, e.ref AS ref, e.value1086 AS value1086Pence ORDER BY e.value1086 DESC LIMIT 1
    # STEERING — the Church is the tenants-in-chief that are institutions (isInstitution), as a share of the county's value;
    # the bishops of Bayeux, Coutances and Lisieux held their English land as barons and are not the Church:
    - q: "what share of Exampleshire did the Church hold in 1086"
      cypher: |
        MATCH (e:DomesdayEntry)-[:TENANT_IN_CHIEF]->(t:DomesdayPerson)
        WHERE e.countyName = 'Exampleshire' AND e.value1086 IS NOT NULL
        WITH e, max(CASE WHEN t.isInstitution AND NOT t.canonicalName =~ '.*(Bayeux|Coutances|Lisieux).*' THEN 1 ELSE 0 END) AS church
        RETURN toInteger(round(100.0 * sum(CASE WHEN church = 1 THEN e.value1086 ELSE 0 END) / sum(e.value1086))) AS churchPercent
    # STEERING — how fully the land was ploughed is plough teams ÷ ploughlands over entries giving both:
    - q: "which county was least fully ploughed"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE e.ploughTeams IS NOT NULL AND e.ploughlands > 0
        RETURN e.countyName AS county, toInteger(round(100.0 * sum(e.ploughTeams) / sum(e.ploughlands))) AS stockingPercent
        ORDER BY stockingPercent LIMIT 1
    # STEERING — the richest manor is the PLACE, by its entry's value, kind `manor` (a borough is `urban`); no stated value is skipped:
    - q: "what was the most valuable manor in Exampleshire in 1086"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE e.countyName = 'Exampleshire' AND e.kind = 'manor' AND e.value1086 IS NOT NULL
        RETURN e.places AS manor, e.ref AS ref, e.value1086 AS value1086Pence ORDER BY e.value1086 DESC LIMIT 1
    # STEERING — a hundred's figures are its entries by IN_HUNDRED (one edge per entry per hundred), filtered on the
    # HUNDRED's county, which takes in its detached parts:
    - q: "which hundred of Exampleshire had the most households"
      cypher: |
        MATCH (e:DomesdayEntry)-[:IN_HUNDRED]->(h:DomesdayHundred)
        WHERE h.countyName = 'Exampleshire'
        RETURN h.name AS hundred, sum(e.households) AS households ORDER BY households DESC LIMIT 1
    - q: "how many households were there in Example hundred"
      cypher: |
        MATCH (e:DomesdayEntry)-[:IN_HUNDRED]->(h:DomesdayHundred) WHERE toLower(h.name) = 'example'
        RETURN h.county AS county, sum(e.households) AS households
    # STEERING — what Domesday does not record is refused, never answered with a neighbouring figure:
    - q: "how many horses were there in 1086"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE false RETURN e.entryId AS horsesAreNotRecordedInDomesday LIMIT 1
    - q: "what was Exampleshire worth in 1100"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE false RETURN e.entryId AS domesdayRecordsNoValueAfter1086 LIMIT 1
    # STEERING — a PLACE today is its parish, by NOW_IN; households beside households, never residents:
    - q: "how many households does Exampleton have today, and how many in 1086"
      cypher: |
        MATCH (e:DomesdayEntry)-[:DESCRIBES]->(p:DomesdayPlace)-[:NOW_IN]->(par:ModernParish)
        WHERE toLower(p.name) = 'exampleton'
        RETURN p.countyName AS county, par.parishName AS parish, sum(e.households) AS households1086, par.households2021 AS households2021
    # A whole county today is NOT held: only the parishes Domesday places lie in, so a county sum would be short.
    - q: "how many people live in Exampleshire today"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE false RETURN e.entryId AS onlyTheParishesOfDomesdayPlacesAreHeldNotWholeCounties LIMIT 1
    - q: "how many children (or women, or old people) lived in Exampleshire in 1086"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE false RETURN e.entryId AS domesdayCountsHouseholdsNotAgeOrSex LIMIT 1
    - q: "what did a villager earn, or what was the tax in euros"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE false RETURN e.entryId AS domesdayRecordsNoWagesOrModernMoney LIMIT 1
    - q: "how many acres of arable land were there in Exampleshire"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE false RETURN e.entryId AS arableIsRecordedAsPloughlandsNotAcres LIMIT 1
    # STEERING — before vs after the Conquest: VALUES compare over entries stating both years; PEOPLE only
    # in Little Domesday, whose 1066 counts are DomesdayFigures by FIGURES_1066 — East Anglia, not England:
    - q: "were there more villagers before or after the Conquest"
      cypher: |
        MATCH (e:DomesdayEntry)-[:FIGURES_1066]->(f:DomesdayFigures)
        WHERE f.villagers IS NOT NULL AND e.villagers IS NOT NULL
        RETURN sum(f.villagers) AS villagers1066, sum(e.villagers) AS villagers1086, count(e) AS entries,
               'Essex, Norfolk and Suffolk only: Great Domesday did not count people in 1066' AS note
    - q: "was Exampleshire worth more before or after the Conquest"
      cypher: |
        MATCH (e:DomesdayEntry) WHERE e.countyName = 'Exampleshire' AND e.value1066 IS NOT NULL AND e.value1086 IS NOT NULL
        RETURN count(e) AS comparableEntries, sum(e.value1066) AS value1066Pence, sum(e.value1086) AS value1086Pence
    # STEERING — "how many PEOPLE": Domesday counts households, so the answer is households with the
    # conventional estimate of people (four to five each) and a note saying so — never a bare household count:
    - q: "how many people lived in England in 1086"
      cypher: |
        MATCH (e:DomesdayEntry)
        WITH sum(e.households) AS h
        RETURN round(h) AS households, round(h * 4) AS estimatedPeopleLow, round(h * 5) AS estimatedPeopleHigh,
               'Domesday counts heads of household, not people; four to five to a household is an estimate.' AS note
    # STEERING — Domesday counts HOUSEHOLDS, not people: "people", "population", "inhabitants" is households:
    - q: "which county had the largest population"
      cypher: |
        MATCH (e:DomesdayEntry)
        RETURN e.countyName AS county, sum(e.households) AS households ORDER BY households DESC LIMIT 1
    # STEERING — a PLACE's figures are its entries' figures, reached by DESCRIBES:
    - q: "what was Exampleton worth in 1086 and how many households did it have"
      cypher: |
        MATCH (p:DomesdayPlace)<-[:DESCRIBES]-(e:DomesdayEntry) WHERE toLower(p.name) = 'exampleton'
        RETURN p.name AS place, p.countyName AS county, e.ref AS ref, e.value1086 AS value1086Pence,
               e.households AS households
    # STEERING — "which county had the most X" groups entries by countyName; no edge to the county is needed:
    - q: "which county had the most mills"
      cypher: |
        MATCH (e:DomesdayEntry)
        RETURN e.countyName AS county, sum(e.mills) AS mills ORDER BY mills DESC LIMIT 1
  properties:
    entryId:
      identity: true
      description: "Hull's entry id; Open Domesday uses the same number. Identity."
    name: "The places and reference, e.g. `Abberley (Worcestershire 15,8)`."
    ref: "County and Phillimore section, e.g. `Worcestershire 15,8` — how a Domesday entry is cited."
    phillimore: "Phillimore section number alone, e.g. `15,8`."
    county: "Three-letter county code, e.g. `WOR`, `GLS`, `KEN`. Never guess a code from a name — filter on `countyName` instead."
    countyName: "County name as written, e.g. `Worcestershire`, `Gloucestershire`, `Kent`. Filter a county by THIS: `e.countyName = 'Kent'`. There is no county called England: a question about England, all of Domesday or the whole country takes NO county filter."
    section: "When the entry is in a part of a county's text other than its fiefs: `Lincolnshire claims`, `Yorkshire claims`, `Yorkshire summary`, `Huntingdonshire claims`, `Bruce fief`."
    text: "What the entry says, in the Phillimore translation as Hull transcribed it (CC BY-NC-SA) — the READING text: what an editor supplied is in square brackets, `***` is a figure the scribe left blank, and `?` after a name is the editor's doubt. Hull's apparatus (folios, marginalia, fief headings, struck-out words) is removed; `textEdition` keeps it. Absent for Yorkshire, which Hull's transcription omits, and for fief headings. Quote it for what Domesday SAYS; read the figures for what it COUNTS."
    textEdition: "The same entry exactly as Hull's edition publishes it, apparatus and all: [= =] fief heading, ?M? marginalia and chapter numbers, <210c> folio and column, other <…> Hull's conjectured byname, [* *] an identification made elsewhere, ^[ ]^ implied meaning, [ ] words the Phillimore editor supplied, { } a word left in Latin or its Domesday spelling, {{ }} words struck out (never count a figure inside them). For citation and close reading."
    pigs:
      type: number
      description: "Pigs (livestock)."
    cobs:
      type: number
