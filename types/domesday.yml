- name: DomesdayFigures
  description: "What Little Domesday (Essex, Norfolk, Suffolk) counted on a holding BEFORE 1086 — in 1066 (moment `1066`, reached by FIGURES_1066) or when the holder acquired it (moment `when acquired`, by FIGURES_WHEN_ACQUIRED). The same names as the entry's 1086 figures: villagers, slaves, ploughTeams, sheep … Great Domesday counted none of this, so a then-and-now comparison of people or stock is East Anglia's only. Compare over entries that state BOTH years: `MATCH (e:DomesdayEntry)-[:FIGURES_1066]->(f:DomesdayFigures) WHERE f.slaves IS NOT NULL AND e.slaves IS NOT NULL RETURN sum(f.slaves) AS slaves1066, sum(e.slaves) AS slaves1086`. Parsed from the translation."
  userAnchor: false
  examples:
    # STEERING — before and after the Conquest, for PEOPLE: only Little Domesday counted them in 1066, on DomesdayFigures:
    - q: "were there more slaves before or after the Conquest"
      cypher: |
        MATCH (e:DomesdayEntry)-[:FIGURES_1066]->(f:DomesdayFigures)
        WHERE f.slaves IS NOT NULL AND e.slaves IS NOT NULL
        RETURN sum(f.slaves) AS slaves1066, sum(e.slaves) AS slaves1086, count(e) AS entries,
               'Little Domesday (Essex, Norfolk, Suffolk) only: Great Domesday did not count people in 1066' AS note
  properties:
    figuresId:
      identity: true
      description: "The entry's id and the moment, e.g. `201266:1066`. Identity."
    moment: "`1066` or `when acquired`."
    ref: "The entry's Phillimore reference, e.g. `Norfolk 4,35`."
